<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naperville North Strength &amp; Performance Board</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#002F55;--navy2:#0A4472;--orange:#FF4800;--orange2:#FF6A2E;--bg:#F3F4F6;--card:#fff;--border:#E5E7EB;--mid:#6B7280;--ink:#111827;--green:#047857;--greenbg:#D1FAE5;--greentx:#065F46;--red:#DC2626;--redbg:#FEE2E2;--redtx:#B91C1C;--graybg:#E5E7EB;--graytx:#6B7280}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.osw{font-family:Oswald,Inter,sans-serif;font-weight:700}
header.app{background:var(--navy);color:#fff}
.hwrap{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.hlogo{height:48px}
.htitle{line-height:1.05}
.htitle .t1{font-size:20px;letter-spacing:-.02em}
.htitle .t2{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;color:#cbd5e1;font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:8px 14px;border-radius:6px;cursor:pointer}
.tab:hover{color:#fff}
.tab.on{background:var(--orange);color:#fff}
.kioskbtn{margin-left:auto;background:#fff;color:var(--navy);border:0;font:inherit;font-weight:900;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer}
.kioskbtn:hover{background:var(--orange2);color:#fff}
main{max-width:1120px;margin:0 auto;padding:22px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px}
.cardhead{padding:10px 16px;background:#F3F4F6;border-bottom:1px solid var(--border);font-family:Oswald;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px 10px 0 0}
.cardhead .sub{font-family:Inter;font-size:11px;color:var(--mid);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);padding:8px 8px;font-weight:700}
th:first-child,td:first-child{padding-left:16px}
td{padding:8px 8px;border-top:1px solid #F1F2F4;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover{background:#FFF3EC}
.b{font-weight:800}.mid{color:var(--mid)}.dim{color:#9CA3AF}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;white-space:nowrap}
.p-over{background:var(--greenbg);color:var(--greentx)}
.p-below{background:var(--redbg);color:var(--redtx)}
.p-none{background:var(--graybg);color:var(--graytx);font-weight:700}
.gain-up{color:var(--green);font-weight:800}.gain-dn{color:var(--red);font-weight:800}
.btn{font:inherit;border-radius:7px;padding:9px 16px;font-weight:800;cursor:pointer;border:1px solid transparent}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange2)}
.btn-ghost{background:#fff;border-color:#D1D5DB;color:var(--ink)}.btn-ghost:hover{background:#F3F4F6}
.btn-link{background:none;border:0;color:var(--mid);cursor:pointer;font:inherit;font-size:13px;padding:0}
.btn-link:hover{color:var(--ink)}
.btn:disabled{background:#9CA3AF;cursor:not-allowed}
.btn-del{background:none;border:0;color:#EF4444;font-size:11.5px;cursor:pointer;font-weight:600}
.btn-del:hover{color:#B91C1C}
label.f{display:block}
label.f span{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mid);margin-bottom:4px}
input,select{font:inherit;width:100%;border:1px solid #D1D5DB;border-radius:7px;padding:8px 10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--orange);outline-offset:0;border-color:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:14px 16px}
.filters label.f{min-width:150px;flex:0 1 auto}
.filters .count{margin-left:auto;color:var(--mid);font-size:13px;padding-bottom:8px}
.kpicard{background:var(--navy);color:#fff;border-radius:10px;padding:14px}
.kpicard .n{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#9FB3C8}
.kpicard .v{font-family:Oswald;font-size:30px;font-weight:700;margin-top:2px}
.kpicard .v small{color:#64748B;font-size:18px}
.kpicard .pct{color:var(--orange);font-size:11.5px;font-weight:700;margin-top:2px}
.kpicard .std{color:#64748B;font-size:10.5px;margin-top:3px}
.linebar{position:relative;height:9px;background:#E5E7EB;border-radius:99px;overflow:hidden;min-width:120px}
.linebar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.linebar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.banner{background:var(--navy);color:#fff;border-radius:10px;padding:20px;display:flex;gap:18px;align-items:flex-start}
.banner img{height:82px}
.banner .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--orange);font-weight:800}
.banner h2{font-family:Oswald;font-size:34px;margin:4px 0 0;letter-spacing:-.01em}
.banner .meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:10px;color:#C7D2E0;font-size:13px}
.banner .meta .dim2{color:#64748B}
.chartcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}
.chartcard h4{margin:0 0 4px;font-family:Oswald;font-size:15px}
.chartcard .stats{font-size:13px;float:right}
.chartcard .pts{margin-top:6px;font-size:11.5px;color:#4B5563;line-height:1.6}
.chartcard .pts .d{color:#9CA3AF}
.chartwrap{position:relative;height:190px}
.footnote{border-top:1px solid var(--border);padding-top:12px;font-size:13px;color:#4B5563;line-height:1.55}
.section-t{font-family:Oswald;font-size:18px;font-weight:700;margin:0 0 12px}
.stack>*+*{margin-top:20px}
.note{font-size:11.5px;color:#9CA3AF;margin-top:10px}
.toggle{display:inline-flex;border:1px solid #D1D5DB;border-radius:8px;padding:3px;gap:2px;font-size:11.5px;font-weight:800}
.toggle button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mid);font:inherit;font-weight:800}
.toggle button.on{background:var(--navy);color:#fff}
.warn{background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:12px 16px;font-size:13px}
/* kiosk */
.kiosk{min-height:100vh;background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.kiosk .top{display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto 22px;width:100%}
.kiosk .inner{max-width:640px;margin:0 auto;width:100%}
.kiosk .wide{max-width:960px;margin:0 auto;width:100%}
.kiosk h2{font-family:Oswald;font-size:30px;margin:0 0 16px}
.kbig{display:block;width:100%;border:0;border-radius:12px;padding:18px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;margin-bottom:12px}
.kbig.orange{background:var(--orange);color:#fff}.kbig.orange:hover{background:var(--orange2)}
.kbig.white{background:#fff;color:var(--navy)}.kbig.white:hover{background:#E5E7EB}
.kbig.dark{background:#0B3A63;color:#fff;font-weight:700;font-size:15px}.kbig.dark:hover{background:#12507F}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:380px;overflow-y:auto}
.namegrid button{background:#0B3A63;border:0;color:#fff;font:inherit;font-weight:700;font-size:13.5px;text-align:left;padding:12px 10px;border-radius:8px;cursor:pointer}
.namegrid button:hover{background:#12507F}
.kioskcard{background:#fff;color:var(--ink);border-radius:14px;padding:22px}
.kioskcard h2{color:var(--ink)}
.exitlink{background:none;border:0;color:#7A93AC;font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline}
.center{text-align:center}
.loading{display:flex;min-height:60vh;align-items:center;justify-content:center;color:var(--mid)}
/* print */
@media print{
  .print-hide,header.app,.kiosk .top{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card,.chartcard,.banner{border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  body.compact .charts-section{display:none!important}
  body.compact table{font-size:12px}
  .footnote{font-size:10pt;color:#374151}
  .kiosk{background:#fff;color:var(--ink);padding:0}
  @page{margin:.6in}
}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.banner{flex-direction:column}.banner h2{font-size:26px}}
</style>
</head>

/* ---------------- data layer: Supabase or localStorage ---------------- */
const useSupa = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const supa = useSupa ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const DB = {
  async load(){
    if (useSupa){
      const [a,t,e] = await Promise.all([
        supa.from("athletes").select("*").order("last_name"),
        supa.from("tests").select("*"),
        supa.from("exercises").select("*").order("sort")
      ]);
      if (a.error||t.error||e.error) throw (a.error||t.error||e.error);
      S.athletes = a.data; S.tests = t.data;
      if (!e.data.length){
        await supa.from("exercises").insert(DEFAULT_EXERCISES);
        S.exercises = DEFAULT_EXERCISES.slice();
      } else S.exercises = e.data;
    } else {
      S.athletes = JSON.parse(localStorage.getItem("nn-athletes")||"[]");
      S.tests = JSON.parse(localStorage.getItem("nn-tests")||"[]");
      S.exercises = JSON.parse(localStorage.getItem("nn-exercises")||"null") || DEFAULT_EXERCISES.slice();
    }
  },
  localSave(){
    if (useSupa) return;
    localStorage.setItem("nn-athletes", JSON.stringify(S.athletes));
    localStorage.setItem("nn-tests", JSON.stringify(S.tests));
    localStorage.setItem("nn-exercises", JSON.stringify(S.exercises));
  },
  async upsertAthlete(a){ if(useSupa){const{error}=await supa.from("athletes").upsert(a);if(error)throw error;} this.localSave(); },
  async deleteAthlete(id){ if(useSupa){await supa.from("tests").delete().eq("athlete_id",id);const{error}=await supa.from("athletes").delete().eq("id",id);if(error)throw error;} this.localSave(); },
  async insertTests(rows){ if(useSupa){const{error}=await supa.from("tests").insert(rows);if(error)throw error;} this.localSave(); },
  async deleteTest(id){ if(useSupa){const{error}=await supa.from("tests").delete().eq("id",id);if(error)throw error;} this.localSave(); },
  async upsertExercise(e){ if(useSupa){const{error}=await supa.from("exercises").upsert(e);if(error)throw error;} this.localSave(); },
  async deleteExercise(id){ if(useSupa){const{error}=await supa.from("exercises").delete().eq("id",id);if(error)throw error;} this.localSave(); }
};
function dbFail(e){ console.error(e); alert("Save failed — check your connection / Supabase setup.\n\n" + (e.message||e)); }

/* ---------------- derived helpers ---------------- */
const testsFor = (aid,exid) => S.tests.filter(t=>t.athlete_id===aid&&t.ex_id===exid);
const latestT = (aid,exid) => { const r=testsFor(aid,exid); return r.length? r.reduce((a,b)=>a.date>=b.date?a:b):null; };
const firstT  = (aid,exid) => { const r=testsFor(aid,exid); return r.length? r.reduce((a,b)=>a.date<=b.date?a:b):null; };
const bestT   = (aid,exid) => { const r=testsFor(aid,exid); return r.length? r.reduce((a,b)=>+a.value>=+b.value?a:b):null; };
const kpiFor = (ex,a) => { const raw = a.gender==="Female"? ex.kpi_f : ex.kpi_m; return raw==null||raw===""? null : +raw; };
function evalKPI(ex,a,v){
  if (v==null) return null;
  const k = kpiFor(ex,a), bw = +a.weight;
  if (ex.kpi_type==="ratio"){
    const ratio = bw>0? v/bw : null;
    if (k==null) return {ratio,target:null,pass:null};
    return {ratio, target:k*bw, pass: ratio!=null? ratio>=k : null};
  }
  if (k==null) return {ratio:null,target:null,pass:null};
  return {ratio:null,target:k,pass:v>=k};
}
const sportsList = () => { const s=new Set(); S.athletes.forEach(a=>(a.sports||"").split(",").map(x=>x.trim()).filter(Boolean).forEach(x=>s.add(x))); return [...s].sort(); };
const pillHTML = p => p===true? '<span class="pill p-over">OVER THE LINE</span>' : p===false? '<span class="pill p-below">BELOW</span>' : '<span class="pill p-none">no standard</span>';
const fmtNum = v => { const n=Math.round(v*10)/10; return (n===Math.trunc(n)? Math.trunc(n):n).toString(); };

/* ---------------- render root ---------------- */
function render(){
  S.chartRefs.forEach(c=>c.destroy()); S.chartRefs=[];
  document.body.classList.toggle("compact", S.printMode==="compact");
  const app = document.getElementById("app");
  if (!S.ready){ app.innerHTML = '<div class="loading">Loading the Huskies board…</div>'; return; }
  if (S.dbError){
    app.innerHTML = `<main><div class="warn"><b>Couldn't reach the database.</b> ${esc(S.dbError)}<br><br>If you just set up Supabase, confirm the URL/key in this file and that you ran setup.sql.</div></main>`;
    return;
  }
  if (S.view==="kiosk"){ app.innerHTML = kioskHTML(); mountCharts(); return; }
  app.innerHTML = headerHTML() + "<main>" + (
    S.view==="board" ? boardHTML() :
    S.view==="roster" ? rosterHTML() :
    S.view==="report" ? reportHTML(false) :
    setupHTML()
  ) + "</main>";
  mountCharts();
}
function headerHTML(){
  const tab=(id,l)=>`<button class="tab ${S.view===id?'on':''}" onclick="A.go('${id}')">${l}</button>`;
  return `<header class="app print-hide"><div class="hwrap">
    <img class="hlogo" src="${LOGO}" alt="Naperville North Huskies">
    <div class="htitle"><div class="t1 osw">NAPERVILLE NORTH</div><div class="t2">Strength &amp; Performance Board</div></div>
    <nav>${tab("board","Board")}${tab("roster","Athletes")}${tab("setup","Setup")}</nav>
    <button class="kioskbtn" onclick="A.launchKiosk()">LAUNCH KIOSK →</button>
  </div></header>`;
}

/* ---------------- board ---------------- */
function filteredAthletes(){
  return S.athletes.filter(a =>
    (S.f.gender==="All"||a.gender===S.f.gender) &&
    (S.f.sport==="All"||(a.sports||"").toLowerCase().includes(S.f.sport.toLowerCase())));
}
function boardHTML(){
  const F = filteredAthletes();
  const kpiEx = S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null);
  const showEx = S.f.ex==="All"? S.exercises : S.exercises.filter(e=>e.id===S.f.ex);
  const cards = kpiEx.map(ex=>{
    let ev=0,ps=0;
    F.forEach(a=>{const t=latestT(a.id,ex.id); if(!t)return; const r=evalKPI(ex,a,+t.value); if(r&&r.pass!==null){ev++; if(r.pass)ps++;}});
    return `<div class="kpicard"><div class="n">${esc(ex.name)}</div><div class="v">${ps}<small>/${ev}</small></div>
      <div class="pct">${ev?Math.round(ps/ev*100):0}% over the line</div>
      <div class="std">M ${ex.kpi_m!=null?ex.kpi_m+"×BW":"—"} · F ${ex.kpi_f!=null?ex.kpi_f+"×BW":"—"}</div></div>`;
  }).join("") || '<p class="mid">No KPI standards set yet — add them in Setup.</p>';

  const tables = showEx.map(ex=>{
    let rows = F.map(a=>{const t=latestT(a.id,ex.id); if(!t)return null; return {a,t,r:evalKPI(ex,a,+t.value)};}).filter(Boolean)
      .filter(x=>S.f.standing==="All"||(S.f.standing==="Over"?x.r?.pass===true:x.r?.pass===false))
      .sort((x,y)=>((y.r?.ratio??+y.t.value)-(x.r?.ratio??+x.t.value)));
    if(!rows.length) return "";
    const body = rows.map(({a,t,r})=>{
      let bar="";
      if (r?.target!=null){
        const pct = ex.kpi_type==="ratio"? (r.ratio/(kpiFor(ex,a)||1)) : (+t.value/r.target);
        const w = Math.min(pct,1.4)/1.4*100;
        bar = `<div class="linebar"><div class="fill" style="width:${w}%;background:${pct>=1?'#10B981':'var(--orange)'}"></div><div class="mark" style="left:${1/1.4*100}%"></div></div>`;
      }
      return `<tr class="click" onclick="A.openReport('${a.id}')">
        <td class="b">${esc(a.last_name)}, ${esc(a.first_name)}</td><td class="mid">${a.gender[0]}</td><td class="mid">${a.weight}</td>
        <td class="b">${t.value}</td><td>${r?.ratio!=null?r.ratio.toFixed(2)+"×":"—"}</td><td>${bar}</td><td>${pillHTML(r?.pass)}</td></tr>`;
    }).join("");
    return `<div class="card"><div class="cardhead">${esc(ex.name).toUpperCase()}
      <span class="sub">standard: M ${ex.kpi_m??"—"}${ex.kpi_type==="ratio"&&ex.kpi_m!=null?"×BW":""} · F ${ex.kpi_f??"—"}${ex.kpi_type==="ratio"&&ex.kpi_f!=null?"×BW":""}</span></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Athlete</th><th>G</th><th>BW</th><th>Latest (${ex.unit})</th><th>Rel. strength</th><th style="width:170px">The line</th><th>Standing</th></tr></thead><tbody>${body}</tbody></table></div></div>`;
  }).join("");

  const sportOpts = ["All",...sportsList()].map(s=>`<option ${S.f.sport===s?"selected":""}>${esc(s)}</option>`).join("");
  const exOpts = `<option value="All">All</option>` + S.exercises.map(e=>`<option value="${e.id}" ${S.f.ex===e.id?"selected":""}>${esc(e.name)}</option>`).join("");
  return `<div class="stack">
    <div class="card filters">
      <label class="f"><span>Sport</span><select onchange="A.setF('sport',this.value)">${sportOpts}</select></label>
      <label class="f"><span>Gender</span><select onchange="A.setF('gender',this.value)"><option ${S.f.gender==="All"?"selected":""}>All</option><option ${S.f.gender==="Male"?"selected":""}>Male</option><option ${S.f.gender==="Female"?"selected":""}>Female</option></select></label>
      <label class="f"><span>Exercise</span><select onchange="A.setF('ex',this.value)">${exOpts}</select></label>
      <label class="f"><span>Standing</span><select onchange="A.setF('standing',this.value)"><option ${S.f.standing==="All"?"selected":""}>All</option><option ${S.f.standing==="Over"?"selected":""}>Over</option><option ${S.f.standing==="Below"?"selected":""}>Below</option></select></label>
      <div class="count">${F.length} athletes in view</div>
    </div>
    <div class="grid5">${cards}</div>
    ${tables || (S.athletes.length? "" : `<div class="card" style="padding:24px" class="mid">No athletes yet. Hit <b>Launch Kiosk</b> and have your first athlete build their profile.</div>`)}
  </div>`;
}

function readProfileForm(){
  const g = id => document.getElementById(id).value.trim();
  const f = {first_name:g("pf-first"),last_name:g("pf-last"),gender:document.getElementById("pf-gender").value,
    grad_year:g("pf-grad"),height:g("pf-height")?+g("pf-height"):null,weight:+g("pf-weight"),sports:g("pf-sports")};
  if (!f.first_name||!f.last_name||!(f.weight>0)){ alert("Name and body weight are required — relative strength can't compute without body weight."); return null; }
  return f;
}

/* ---------------- report ---------------- */
function reportHTML(athleteView){
  const a = S.athletes.find(x=>x.id===S.reportId); if(!a) return "<p>Athlete not found.</p>";
  const tested = S.exercises.filter(e=>testsFor(a.id,e.id).length);
  if (!S.histEx) S.histEx = S.exercises[0]?.id;

  const tableRows = S.exercises.map(ex=>{
    const ft=firstT(a.id,ex.id), lt=latestT(a.id,ex.id), bt=bestT(a.id,ex.id);
    const r = lt? evalKPI(ex,a,+lt.value):null;
    const hasGain = ft&&lt&&ft.id!==lt.id;
    const gain = hasGain? +lt.value-+ft.value:null;
    const pct = hasGain&&+ft.value>0? Math.round(gain/+ft.value*100):null;
    const gcell = gain==null? '<span class="dim">—</span>' :
      `<span class="${gain>0?'gain-up':gain<0?'gain-dn':'mid'}">${gain>0?'+':''}${fmtNum(gain)}${pct!=null?` <small>(${gain>0?'+':''}${pct}%)</small>`:''}</span>`;
    return `<tr><td class="b">${esc(ex.name)}</td>
      <td class="mid">${ft?`${ft.value} <span class="dim" style="font-size:11px">(${ft.date.slice(2,7)})</span>`:"—"}</td>
      <td class="b">${lt?`${lt.value} ${ex.unit}`:'<span class="dim" style="font-weight:400">not tested</span>'}</td>
      <td>${gcell}</td><td class="mid">${bt?bt.value:"—"}</td>
      <td>${r?.ratio!=null?r.ratio.toFixed(2)+"× BW":"—"}</td>
      <td>${lt?pillHTML(r?.pass):""}</td></tr>`;
  }).join("");

  const charts = tested.map(ex=>{
    const data = testsFor(a.id,ex.id).sort((x,y)=>x.date.localeCompare(y.date));
    const latest = +data[data.length-1].value;
    const r = evalKPI(ex,a,latest);
    const pts = data.map((d,i)=>`${i?" → ":""}<span class="d">${d.date.slice(2)}:</span> <b>${d.value}</b>`).join("");
    return `<div class="chartcard">
      <div class="stats"><b>${latest} ${ex.unit}</b>${r?.ratio!=null?` <span class="mid">· ${r.ratio.toFixed(2)}× BW</span>`:""} ${pillHTML(r?.pass)}</div>
      <h4>${esc(ex.name).toUpperCase()}</h4>
      <div class="chartwrap"><canvas id="ch-${ex.id}" data-ex="${ex.id}" data-athlete="${a.id}"></canvas></div>
      <div class="pts">${pts}</div></div>`;
  }).join("");

  const stds = S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null)
    .map(e=>`${esc(e.name)} M ${e.kpi_m!=null?e.kpi_m+(e.kpi_type==="ratio"?"×BW":" "+e.unit):"—"} / F ${e.kpi_f!=null?e.kpi_f+(e.kpi_type==="ratio"?"×BW":" "+e.unit):"—"}`).join(" · ");

  const histRows = testsFor(a.id,S.histEx).sort((x,y)=>y.date.localeCompare(x.date)).map(t=>{
    const u = S.exercises.find(e=>e.id===S.histEx)?.unit||"";
    return `<li style="padding:8px 0;border-top:1px solid #F1F2F4;display:flex;justify-content:space-between"><span>${t.date} — <b>${t.value} ${u}</b></span><button class="btn-del" onclick="A.delTest('${t.id}')">delete entry</button></li>`;}).join("");

  return `<div class="stack">
    <div class="print-hide" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">
      <button class="btn-link" onclick="A.reportBack(${athleteView})">← Back</button>
      <div style="display:flex;gap:10px;align-items:center">
        ${athleteView?"":`<button class="btn btn-ghost" onclick="A.toggleEdit()">${S.editingProfile?"Close editor":"Edit profile"}</button>`}
        <div class="toggle">
          <button class="${S.printMode==='compact'?'on':''}" onclick="A.setPrint('compact')">One-sheet</button>
          <button class="${S.printMode==='full'?'on':''}" onclick="A.setPrint('full')">Full w/ charts</button>
        </div>
        <button class="btn btn-navy" onclick="window.print()">Print / save PDF</button>
      </div>
    </div>
    ${S.editingProfile&&!athleteView? `<div class="card print-hide" style="padding:20px">${profileFormHTML(a,`A.saveProfileEdit('${a.id}')`,"A.toggleEdit()")}</div>`:""}
    <div class="banner">
      <img src="${LOGO}" alt="Naperville North Huskies">
      <div>
        <div class="eyebrow">Naperville North Strength &amp; Performance · Athlete Report</div>
        <h2>${esc(a.first_name)} ${esc(a.last_name)}</h2>
        <div class="meta"><span>${a.gender}</span>${a.height?`<span>${a.height}" tall</span>`:""}<span>${a.weight} lb</span>${a.sports?`<span>${esc(a.sports)}</span>`:""}${a.grad_year?`<span>Class of ${esc(a.grad_year)}</span>`:""}<span class="dim2">Printed ${today()}</span></div>
      </div>
    </div>
    <div class="card"><div class="cardhead">CURRENT NUMBERS vs THE LINE</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Exercise</th><th>First test</th><th>Current</th><th>Gain</th><th>All-time best</th><th>Rel. strength</th><th>Standing</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>
    <div class="charts-section">
      <h3 class="section-t">PROGRESS BY LIFT — EVERY TEST DATE</h3>
      ${tested.length? `<div class="grid2">${charts}</div>` : `<div class="card" style="padding:22px" class="mid">No tests logged yet — numbers entered at the kiosk will show up here.</div>`}
      <div class="note">Dashed navy line = current team standard at this athlete's current body weight. Orange line = tested maxes by date.</div>
    </div>
    <div class="footnote">
      <p style="margin:0">Standing is graded against the current team standard at this athlete's current body weight. Gain compares the first recorded test to the most recent test. Rel. strength = max ÷ body weight.</p>
      <p style="margin:6px 0 0"><b>Team standards:</b> ${stds}</p>
    </div>
    ${athleteView?"":`<div class="card print-hide" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h3 class="section-t" style="margin:0">FIX AN ENTRY</h3>
        <select style="width:auto" onchange="A.setHistEx(this.value)">${S.exercises.map(e=>`<option value="${e.id}" ${S.histEx===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select>
      </div>
      <ul style="list-style:none;padding:0;margin:12px 0 0;font-size:13.5px">${histRows||'<li class="dim">Nothing logged for this exercise.</li>'}</ul>
    </div>`}
  </div>`;
}
function mountCharts(){
  document.querySelectorAll("canvas[data-ex]").forEach(cv=>{
    const a = S.athletes.find(x=>x.id===cv.dataset.athlete);
    const ex = S.exercises.find(e=>e.id===cv.dataset.ex);
    const data = testsFor(a.id,ex.id).sort((x,y)=>x.date.localeCompare(y.date));
    const r = evalKPI(ex,a,+data[data.length-1].value);
    const ds = [{label:ex.name,data:data.map(d=>+d.value),borderColor:"#FF4800",backgroundColor:"#002F55",pointRadius:4,pointBackgroundColor:"#002F55",borderWidth:3,tension:0}];
    if (r?.target!=null) ds.push({label:"The line",data:data.map(()=>r.target),borderColor:"#002F55",borderDash:[6,4],borderWidth:1.5,pointRadius:0});
    S.chartRefs.push(new Chart(cv,{type:"line",
      data:{labels:data.map(d=>d.date),datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{display:false},tooltip:{enabled:true}},
        scales:{x:{ticks:{font:{size:10}}},y:{ticks:{font:{size:10}}}}}}));
  });
}

/* ---------------- kiosk ---------------- */
function kioskHTML(){
  const k = S.kiosk;
  const me = S.athletes.find(x=>x.id===k.meId);
  const top = `<div class="top print-hide">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="${LOGO}" style="height:56px" alt="Naperville North Huskies">
      <div><div class="osw" style="font-size:20px;line-height:1">NAPERVILLE NORTH</div>
      <div style="font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--orange);text-transform:uppercase">Athlete Kiosk · Driven</div></div>
    </div>
    <button class="exitlink" onclick="A.exitKiosk()">coach: exit kiosk</button></div>`;

  let body="";
  if (k.stage==="pick"){
    const names = [...S.athletes].sort((a,b)=>a.last_name.localeCompare(b.last_name))
      .map(a=>`<button onclick="A.kPick('${a.id}')">${esc(a.last_name)}, ${esc(a.first_name)}</button>`).join("");
    body = `<div class="inner"><h2>Who's testing?</h2>
      <button class="kbig orange" onclick="A.kStage('new')">+ I'M NEW — CREATE MY PROFILE</button>
      <div class="namegrid">${names||'<p class="mid" style="grid-column:1/-1;color:#94A3B8">No athletes yet. Be the first.</p>'}</div></div>`;
  }
  else if (k.stage==="new"){
    body = `<div class="inner"><div class="kioskcard"><h2>Create your profile</h2>${profileFormHTML(null,"A.kCreateProfile()","A.kStage('pick')")}</div></div>`;
  }
  else if (k.stage==="home"&&me){
    body = `<div class="inner"><h2>${esc(me.first_name)} ${esc(me.last_name)}</h2>
      <p style="color:#9FB3C8;font-size:13.5px;margin:0 0 16px">Body weight on file: <b style="color:#fff">${me.weight} lb</b>. If that's changed, update it first — your relative strength depends on it.</p>
      <button class="kbig orange" onclick="A.kStage('test')">ENTER TODAY'S NUMBERS</button>
      <button class="kbig white" onclick="A.kMyReport()">SEE MY REPORT &amp; CHARTS</button>
      <button class="kbig dark" onclick="A.kStage('edit')">Update my height / weight / sport</button>
      <button class="exitlink" style="display:block;margin:8px auto" onclick="A.kStage('pick');A.kSetMe(null)">← Not me / switch athlete</button></div>`;
  }
  else if (k.stage==="edit"&&me){
    body = `<div class="inner"><div class="kioskcard"><h2>Update profile</h2>${profileFormHTML(me,`A.kSaveProfile('${me.id}')`,"A.kStage('home')")}</div></div>`;
  }
  else if (k.stage==="test"&&me){
    const fields = S.exercises.map(ex=>{
      const last = latestT(me.id,ex.id);
      return `<label class="f"><span>${esc(ex.name)} (${ex.unit})${last?` — last: ${last.value}`:""}</span><input type="number" inputmode="decimal" id="te-${ex.id}"></label>`;}).join("");
    body = `<div class="inner"><div class="kioskcard"><h2>Enter your maxes</h2>
      <p class="mid" style="margin-top:-8px">Leave anything you didn't test blank.</p>
      <label class="f" style="margin-bottom:12px"><span>Test date</span><input type="date" id="te-date" value="${today()}"></label>
      <div class="grid2">${fields}</div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-navy" onclick="A.kSubmitTests()">SUBMIT</button>
        <button class="btn btn-ghost" onclick="A.kStage('home')">Back</button></div></div></div>`;
  }
  else if (k.stage==="done"&&me){
    body = `<div class="inner center" style="padding-top:40px">
      <div style="font-size:56px">💪</div>
      <h2>Logged. Nice work, ${esc(me.first_name)}.</h2>
      <button class="kbig white" style="max-width:420px;margin:0 auto 12px" onclick="A.kMyReport()">SEE MY UPDATED REPORT</button>
      <button class="kbig orange" style="max-width:420px;margin:0 auto" onclick="A.kStage('pick');A.kSetMe(null)">NEXT ATHLETE</button></div>`;
  }
  else if (k.stage==="myreport"&&me){
    S.reportId = me.id;
    body = `<div class="wide"><div style="background:var(--bg);color:var(--ink);border-radius:14px;padding:18px">${reportHTML(true)}</div></div>`;
  }
  return `<div class="kiosk">${top}${body}</div>`;
}

    <td><input value="${esc(ex.name)}" onchange="A.updEx(${i},'name',this.value)"></td>

      <table style="margin-top:6px"><thead><tr><th>Exercise</th><th>Unit</th><th>Standard type</th><th>Male KPI</th><th>Female KPI</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="card" style="padding:18px">
      <h3 class="section-t">ADD A TEST EXERCISE</h3>
      <div class="grid2" style="grid-template-columns:2fr 1fr 1.4fr 1fr 1fr">
        <label class="f"><span>Name</span><input id="nx-name" placeholder="10yd Sprint"></label>
        <label class="f"><span>Unit</span><select id="nx-unit">${unitOpts("lb")}</select></label>
        <label class="f"><span>Standard type</span><select id="nx-type"><option value="ratio">× body weight</option><option value="absolute">absolute</option></select></label>
        <label class="f"><span>Male KPI (opt.)</span><input id="nx-m" type="number" step="0.05"></label>
        <label class="f"><span>Female KPI (opt.)</span><input id="nx-f" type="number" step="0.05"></label>
      </div>
      <button class="btn btn-navy" style="margin-top:14px" onclick="A.addEx()">Add exercise</button></div>
    <div class="warn print-hide"><b>Data location:</b> ${useSupa? "connected to Supabase — all devices share one live database." : "Supabase is <u>not configured</u>, so data saves only in this browser on this device. Fill in CONFIG at the top of index.html to go live."}</div>
  </div>`;
}

/* ---------------- actions ---------------- */
const A = {
  go(v){ S.view=v; S.editingProfile=false; render(); },
  setF(k,v){ S.f[k]=v; render(); },
  openReport(id){ S.reportId=id; S.histEx=null; S.view="report"; S.editingProfile=false; render(); window.scrollTo(0,0); },
  reportBack(athleteView){ if(athleteView){S.kiosk.stage="home"; render();} else A.go("board"); },
  setPrint(m){ S.printMode=m; render(); },
  setHistEx(v){ S.histEx=v; render(); },
  toggleEdit(){ S.editingProfile=!S.editingProfile; render(); },
  async saveProfileEdit(id){
    const f=readProfileForm(); if(!f)return;
    const a={...S.athletes.find(x=>x.id===id),...f};
    S.athletes=S.athletes.map(x=>x.id===id?a:x); S.editingProfile=false; render();
    try{ await DB.upsertAthlete(a); }catch(e){ dbFail(e); }
  },
  async delAthlete(id){
    const a=S.athletes.find(x=>x.id===id);
    if(!confirm(`Delete ${a.first_name} ${a.last_name} and all their tests? This can't be undone.`))return;
    S.athletes=S.athletes.filter(x=>x.id!==id); S.tests=S.tests.filter(t=>t.athlete_id!==id); render();
    try{ await DB.deleteAthlete(id); }catch(e){ dbFail(e); }
  },
  async delTest(id){
    if(!confirm("Delete this test entry? This can't be undone."))return;
    S.tests=S.tests.filter(t=>t.id!==id); render();
    try{ await DB.deleteTest(id); }catch(e){ dbFail(e); }
  },
  /* kiosk */
  launchKiosk(){ S.view="kiosk"; S.kiosk={stage:"pick",meId:null}; render(); },
  exitKiosk(){ S.view="board"; render(); },
  kStage(st){ S.kiosk.stage=st; render(); },
  kSetMe(id){ S.kiosk.meId=id; },
  kPick(id){ S.kiosk.meId=id; S.kiosk.stage="home"; render(); },
  kMyReport(){ S.printMode="compact"; S.kiosk.stage="myreport"; render(); window.scrollTo(0,0); },
  async kCreateProfile(){
    const f=readProfileForm(); if(!f)return;
    const a={...f,id:uid(),created_at:today()};
    S.athletes.push(a); S.kiosk.meId=a.id; S.kiosk.stage="home"; render();
    try{ await DB.upsertAthlete(a); }catch(e){ dbFail(e); }
  },
  async kSaveProfile(id){
    const f=readProfileForm(); if(!f)return;
    const a={...S.athletes.find(x=>x.id===id),...f};
    S.athletes=S.athletes.map(x=>x.id===id?a:x); S.kiosk.stage="home"; render();
    try{ await DB.upsertAthlete(a); }catch(e){ dbFail(e); }
  },
  async kSubmitTests(){
    const me=S.athletes.find(x=>x.id===S.kiosk.meId);
    const date=document.getElementById("te-date").value||today();
    const rows=[];
    S.exercises.forEach(ex=>{
      const v=document.getElementById("te-"+ex.id).value;
      if(v!==""&&!isNaN(+v)) rows.push({id:uid(),athlete_id:me.id,ex_id:ex.id,value:+v,date});
    });
    if(rows.length){ S.tests.push(...rows); try{ await DB.insertTests(rows); }catch(e){ dbFail(e); } }
    S.kiosk.stage="done"; render();
  },
  /* setup */
  async updEx(i,k,v){
    const ex={...S.exercises[i]};
    ex[k]=(k==="kpi_m"||k==="kpi_f")?(v===""?null:+v):v;
    S.exercises[i]=ex; render();
    try{ await DB.upsertExercise(ex); }catch(e){ dbFail(e); }
  },
  async delEx(id){
    const ex=S.exercises.find(e=>e.id===id);
    if(!confirm(`Remove ${ex.name}? Past test entries stay in the database but won't display.`))return;
    S.exercises=S.exercises.filter(e=>e.id!==id); render();
    try{ await DB.deleteExercise(id); }catch(e){ dbFail(e); }
  },
  async addEx(){
    const g=id=>document.getElementById(id).value;
    const name=g("nx-name").trim(); if(!name){alert("Give the exercise a name.");return;}
    const ex={id:uid(),name,unit:g("nx-unit"),kpi_type:g("nx-type"),
      kpi_m:g("nx-m")===""?null:+g("nx-m"),kpi_f:g("nx-f")===""?null:+g("nx-f"),
      sort:S.exercises.length+1};
    S.exercises.push(ex); render();
    try{ await DB.upsertExercise(ex); }catch(e){ dbFail(e); }
  }
};
window.A=A;

/* ---------------- boot ---------------- */
(async()=>{
  try{ await DB.load(); }catch(e){ console.error(e); S.dbError=e.message||String(e); }
  S.ready=true; render();
})();
</script>
</body>
</html>
