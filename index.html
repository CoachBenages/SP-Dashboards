  async kSubmitTests(){
    /* v26: ignore extra taps while the first save is still in flight (caused triple entries). */
    if(S.kiosk.submitting) return;
    const me=S.athletes.find(x=>x.id===S.kiosk.meId);
    const date=document.getElementById("te-date").value||today();
    /* v31: body weight is entered on test day, not copied from the profile */
    const bwEl=document.getElementById("te-bw"), bwRaw=bwEl?String(bwEl.value).trim():"";
    const bwIn=bwRaw===""?null:+bwRaw;
    const needBW=S.exercises.some(ex=>isRatio(ex)&&(document.getElementById("te-"+ex.id)||{}).value);
    if(bwIn!=null&&(isNaN(bwIn)||bwIn<60||bwIn>450)){ say("Body weight must be between 60 and 450 lb. Check the number and try again."); return; }
    if(needBW&&bwIn==null){ say("Enter your body weight today before you submit a lift. Step on the scale with a coach watching, then type the number in the orange box."); if(bwEl) bwEl.focus(); return; }
    const prevBW=+me.weight||null;
    if(bwIn!=null&&prevBW&&Math.abs(bwIn-prevBW)>10){
      const diff=Math.round(Math.abs(bwIn-prevBW)*10)/10;
      const ok=await ask(`You entered ${fmtNum(bwIn)} lb. That is ${fmtNum(diff)} lb ${bwIn>prevBW?"more":"less"} than your last weight (${fmtNum(prevBW)} lb).\n\nDid a coach weigh you today?`,{title:"Check your body weight",ok:"Yes — a coach weighed me",cancel:"Let me fix it"});
      if(!ok){ if(bwEl) bwEl.focus(); return; }
    }
    const bwUse=bwIn!=null?bwIn:prevBW;
    const rows=[];
    S.exercises.forEach(ex=>{
      const el=document.getElementById("te-"+ex.id); if(!el)return;
      const w=el.value; if(w===""||isNaN(+w))return;
      const reps=usesReps(ex)?(+document.getElementById("tr-"+ex.id).value||1):1;
      rows.push({id:uid(),athlete_id:me.id,ex_id:ex.id,weight:+w,reps,value:usesReps(ex)?est1RM(+w,reps):+w,date,bw:bwUse||null});  /* v31: body weight entered on test day */
    });
    const badFt=S.exercises.filter(ex=>isFtIn(ex)&&document.getElementById("tf-"+ex.id)&&(document.getElementById("tf-"+ex.id).value!==""||document.getElementById("ti-"+ex.id).value!=="")&&document.getElementById("te-"+ex.id).value==="");
    if(badFt.length){say(`Check ${badFt.map(e=>e.name).join(", ")} — inches must be 0 to 11.5 (a 6'7" jump is 6 ft, 7 in).`);return;}
    if(!rows.length){say("Nothing entered yet — add at least one number, or tap Not me.");return;}
    /* v19: only show the "saved" screen if the database actually took the rows.
       Before, a failed insert still showed DONE and the numbers vanished on the next sync. */
    S.kiosk.submitting=true;
    const sb=document.querySelector('button[onclick="A.kSubmitTests()"]'); if(sb){sb.disabled=true;sb.textContent="SAVING…";}
    try{ await DB.insertTests(rows); S.kiosk.submitting=false; }
    catch(e){
      S.kiosk.submitting=false; if(sb){sb.disabled=false;sb.textContent="SUBMIT";}
      console.error("kiosk test save failed", rows, e);
      const what=rows.map(r=>{const ex=S.exercises.find(x=>x.id===r.ex_id)||{};return `${ex.name||r.ex_id}: ${vTxt(ex,r.weight)}`;}).join(", ");
      say(`Your numbers did NOT save. Show this screen to your coach.\n\nTried to save: ${what}\n\nDatabase said: ${e.message||e}${e.details?"\n"+e.details:""}${e.hint?"\n"+e.hint:""}`,"Not saved");
      return;   /* stay on the entry screen so nothing typed is lost */
    }
    S.tests.push(...rows);
    /* v31: keep the profile weight in step with today's weigh-in so every tab agrees */
    if(bwIn!=null&&bwIn!==prevBW){
      const upd={...me,weight:bwIn};
      S.athletes=S.athletes.map(x=>x.id===me.id?upd:x);
      try{ await DB.upsertAthlete(upd); }
      catch(e){ S.athletes=S.athletes.map(x=>x.id===me.id?me:x); console.warn("profile weight update failed (tests were saved with the weight)",e); }
    }
    S.kiosk.savedCount=rows.length;
    S.kiosk.savedList=rows.map(r=>{
      const ex=S.exercises.find(e=>e.id===r.ex_id)||{};
      return `${ex.name||r.ex_id} ${isFtIn(ex)?fmtFtIn(r.value):fmtNum(r.value)+(ex.unit||"")}${+r.reps>1?` (${fmtNum(r.weight)}×${r.reps})`:""}`;
    }).join("  ·  ");
    S.kiosk.stage="done"; render(); startDoneCountdown();
  },

      line("tests.bw column (body weight saved with each test)", !bwc.error, bwc.error?"MISSING — run in Supabase SQL editor:  alter table tests add column if not exists bw numeric;":"");

      const ins=await supa.from("athletes").insert({id:tmp,first_name:"Diag",last_name:"Test",gender:"Male",weight:100}).select("id");
      line("create athlete", !ins.error && ins.data && ins.data.length, ins.error?ins.error.message:"");

      if(ins.data && ins.data.length){
        const upd=await supa.from("athletes").update({weight:101}).eq("id",tmp).select("id");
        line("update athlete", !upd.error && upd.data && upd.data.length,
          upd.error?upd.error.message:(upd.data&&upd.data.length?"":"0 rows changed — UPDATE policy missing"));

        const delr=await supa.from("athletes").delete().eq("id",tmp).select("id");
        const delOK = !delr.error && delr.data && delr.data.length;
        line("delete athlete", delOK,
          delr.error?delr.error.message:(delOK?"":"0 rows removed — DELETE policy missing"));
        if(!delOK) out.push("\n>> This is why athletes won't delete. Fix: run the permissions SQL Claude gave you (it does NOT erase data).");
      }
      const still=await supa.from("athletes").select("id").eq("id",tmp);
      if(still.data && still.data.length) out.push("\nNOTE: a leftover test record 'Diag Test' is in your roster — delete it once permissions are fixed.");
    }catch(e){ out.push("ERROR: "+(e.message||e)); }
    S.diag=out.join("\n"); render();
  },

  /* ---- backup ---- */
  exportAll(){
    const stamp=today();
    const payload={
      format:"nn-performance-board", version:1, exported:new Date().toISOString(),
      term:S.term, periods:S.periods, sports:S.sports, gradYears:S.gradYears,
      exercises:S.exercises, athletes:S.athletes, tests:S.tests
    };
    downloadBlob(`NN-Performance-Backup-${stamp}.json`, JSON.stringify(payload,null,2), "application/json");
    S.listMsg=`Backup downloaded — ${S.athletes.length} athletes, ${S.tests.length} tests.`;
    render(); setTimeout(()=>{S.listMsg="";render();},3000);
  },
  exportCSV(which){
    const stamp=today();
    if(which==="athletes") downloadBlob(`NN-Athletes-${stamp}.csv`, toCSV(S.athletes,ATH_COLS), "text/csv");
    else {
      const exName={}; S.exercises.forEach(e=>exName[e.id]=e.name);
      const rows=S.tests.map(t=>{
        const a=S.athletes.find(x=>x.id===t.athlete_id)||{};
        return {...t, athlete:`${a.last_name||""}, ${a.first_name||""}`, exercise:exName[t.ex_id]||t.ex_id};
      });
      downloadBlob(`NN-Tests-${stamp}.csv`, toCSV(rows,["id","athlete_id","athlete","ex_id","exercise","weight","reps","value","date","bw"]), "text/csv");
    }
  },
  async importBackup(){
    const el=document.getElementById("restore-file");
    const file=el&&el.files&&el.files[0];
    if(!file){ S.restoreMsg="Choose a backup file first."; S.restoreErr=true; render(); return; }
    S.restoreMsg="Reading file…"; S.restoreErr=false; render();
    let text;
    try{ text=await file.text(); }
    catch(e){ S.restoreMsg="Couldn't read that file."; S.restoreErr=true; render(); return; }

    let athletes=[], tests=[], lists=null;
    try{
      if(file.name.toLowerCase().endsWith(".json")){
        const d=JSON.parse(text);
        if(d.format!=="nn-performance-board") throw new Error("That JSON isn't a Performance Board backup.");
        athletes=d.athletes||[]; tests=d.tests||[];
        lists={term:d.term,periods:d.periods,sports:d.sports,gradYears:d.gradYears,exercises:d.exercises};
      } else {
        const rows=parseCSV(text);
        if(!rows.length) throw new Error("That CSV is empty.");
        if("first_name" in rows[0]) athletes=rows;
        else if("athlete_id" in rows[0]) tests=rows;
        else throw new Error("That CSV doesn't look like an athletes or tests export.");
      }
    }catch(e){ S.restoreMsg=e.message||"Couldn't understand that file."; S.restoreErr=true; render(); return; }

    /* normalise numbers coming back from CSV text */
    athletes=athletes.filter(a=>a.id&&a.last_name).map(a=>({
      id:a.id, first_name:a.first_name, last_name:a.last_name, gender:a.gender||"Male",
      height:a.height===""||a.height==null?null:+a.height, weight:+a.weight||0,
      periods:a.periods||"", sports:a.sports||"", grad_year:a.grad_year||"",
      confirmed_term:a.confirmed_term||"", created_at:a.created_at||today()
    }));
    tests=tests.filter(t=>t.id&&t.athlete_id).map(t=>({
      id:t.id, athlete_id:t.athlete_id, ex_id:t.ex_id,
      weight:+t.weight||0, reps:+t.reps||1, value:+t.value||0, date:t.date,
      bw:(t.bw===""||t.bw==null)?null:+t.bw
    }));

    const known=new Set(athletes.map(a=>a.id).concat(S.athletes.map(a=>a.id)));
    const orphans=tests.filter(t=>!known.has(t.athlete_id)).length;
    tests=tests.filter(t=>known.has(t.athlete_id));

    if(!athletes.length&&!tests.length){ S.restoreMsg="Nothing usable found in that file."; S.restoreErr=true; render(); return; }
    if(!await ask(`Restore ${athletes.length} athlete(s) and ${tests.length} test entr(ies)?\n\nExisting records with the same ID are updated; nothing is deleted.${orphans?`\n\n${orphans} test entr(ies) were skipped because their athlete isn't in this file or your roster.`:""}`,{title:"Restore backup",ok:"Restore"})) { S.restoreMsg=""; render(); return; }

    S.restoreMsg="Restoring…"; render();
    try{
      if(athletes.length) await DB.upsertAthletes(athletes);
      if(tests.length){
        if(useSupa){
          for(let i=0;i<tests.length;i+=200){
            const { error } = await supa.from("tests").upsert(tests.slice(i,i+200).map(x=>{ if(S.bwCol) return x; const {bw,...r}=x; return r; }));
            if(error) throw error;
          }
        }
      }
      if(lists){
        if(lists.periods)   { S.periods=lists.periods;   await DB.saveList("periods",S.periods); }
        if(lists.sports)    { S.sports=lists.sports;     await DB.saveList("sports",S.sports); }
        if(lists.gradYears) { S.gradYears=lists.gradYears;await DB.saveList("gradyears",S.gradYears); }
        if(lists.term)      { S.term=lists.term;         await DB.saveList("term",S.term); }
        if(lists.exercises&&lists.exercises.length){
          S.exercises=lists.exercises;
          if(useSupa){ const { error } = await supa.from("exercises").upsert(lists.exercises); if(error) throw error; }
        }
      }
      await DB.load();
      S.restoreMsg=`Restored ${athletes.length} athlete(s) and ${tests.length} test entr(ies).`;
      S.restoreErr=false; render();
    }catch(e){
      S.restoreMsg="Restore failed: "+(e.message||e);
      S.restoreErr=true; render();
    }
  },
  setLb(k,v){S.lb[k]=v;render();},
  setRoster(k,v){S.roster[k]=v;render(); if(k==="q"){const el=document.querySelector('.filters input');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}},
  setBulk(k,v){S.bulk[k]=v;S.bulk.picked=[];render();},
  bulkPick(id,on){ if(on){ if(!S.bulk.picked.includes(id))S.bulk.picked.push(id); } else S.bulk.picked=S.bulk.picked.filter(x=>x!==id); render(); },
  bulkAll(on){
    const src=S.bulk.from;
    const pool=S.athletes.filter(a=>src==="All"?true:src===UNASSIGNED?!listOf(a.periods).length:listOf(a.periods).includes(src));
    S.bulk.picked = on? pool.map(a=>a.id) : []; render();
  },
  async bulkMove(){
    const to=document.getElementById("bulk-to").value;
    if(!S.bulk.picked.length){say("Check at least one athlete first.");return;}
    const label = to===UNASSIGNED? "Unassigned (no class period)" : to;
    if(!await ask(`Move ${S.bulk.picked.length} athlete(s) to ${label}?\n\nThis replaces their current class period(s). Sports are not affected.`,{title:"Move athletes",ok:"Move"}))return;
    const changed=[];
    S.athletes=S.athletes.map(a=>{
      if(!S.bulk.picked.includes(a.id))return a;
      const n={...a, periods: to===UNASSIGNED? "" : to};
      changed.push(n); return n;
    });
    S.bulk.picked=[]; render();
    try{ await DB.upsertAthletes(changed); }catch(e){ dbFail(e); }
  },
  async renameListItem(kind,oldVal){
    const nv=(prompt(`Rename "${oldVal}" to:`, oldVal)||"").trim();
    if(!nv||nv===oldVal)return;
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    if(arr.some(x=>x.toLowerCase()===nv.toLowerCase())){say(`"${nv}" already exists on the list.`);return;}
    const field=kind==="period"?"periods":kind==="sport"?"sports":"grad_year";
    const changed=[];
    S.athletes=S.athletes.map(a=>{
      if(kind==="grad"){
        if(String(a.grad_year)!==String(oldVal))return a;
        const n={...a,grad_year:nv}; changed.push(n); return n;
      }
      const l=listOf(a[field]); if(!l.includes(oldVal))return a;
      const n={...a,[field]:l.map(x=>x===oldVal?nv:x).join(", ")}; changed.push(n); return n;
    });
    const i=arr.indexOf(oldVal); if(i>=0)arr[i]=nv;
    arr.sort((a,b)=>a.localeCompare(b));
    /* keep filters pointing at the renamed value */
    ["lb","roster"].forEach(g=>{ if(S[g].period===oldVal)S[g].period=nv; if(S[g].sport===oldVal)S[g].sport=nv; });
    if(S.f.period===oldVal)S.f.period=nv; if(S.f.sport===oldVal)S.f.sport=nv;
    if(S.bulk.from===oldVal)S.bulk.from=nv;
    if(S.cmp){ if(S.cmp.period===oldVal)S.cmp.period=nv; if(S.cmp.sport===oldVal)S.cmp.sport=nv; }
    render();
    try{
      await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);
      await DB.upsertAthletes(changed);
      if(changed.length) setTimeout(()=>say(`Renamed. ${changed.length} athlete profile(s) updated automatically.`),80);
    }catch(e){ dbFail(e); }
  },
  async addListItem(kind){
    const el=document.getElementById("new-"+kind); const v=el.value.trim(); if(!v)return;
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    if(arr.some(x=>x.toLowerCase()===v.toLowerCase())){say(`"${v}" is already on the list.`);return;}
    arr.push(v); arr.sort((a,b)=>a.localeCompare(b)); render();
    try{
      await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);
      S.listMsg=`Added "${v}".`; render(); setTimeout(()=>{S.listMsg="";render();},2500);
    }catch(e){
      const j=arr.indexOf(v); if(j>=0)arr.splice(j,1); render();
      say("Could not add that.\n\n"+(e.message||e));
    }
  },
  async removeListItem(kind,val){
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    const used=S.athletes.filter(a=>kind==="grad"?String(a.grad_year)===String(val):listOf(kind==="period"?a.periods:a.sports).includes(val)).length;
    if(!await ask(`Remove "${val}" from the ${kind} list?${used?`\n\n${used} athlete(s) are currently tagged with it — they keep the tag until you edit their profiles.`:""}`,{title:"Remove from list",ok:"Remove",danger:true}))return;
    const i=arr.indexOf(val); if(i>=0)arr.splice(i,1); render();
    try{
      await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);
      S.listMsg=`Removed "${val}".`; render(); setTimeout(()=>{S.listMsg="";render();},2500);
    }catch(e){
      arr.splice(i,0,val); render();          /* put it back — the database refused */
      say("Could not delete that.\n\n"+(e.message||e));
    }
  }
};

/* ---------- saved test events ---------- */
/* {id,name,sport,gender,from,to,v1,v2,note} — stored as JSON in settings.test_events */
S.testEvents = S.testEvents || [];
S.tr = null;
async function trLoadEvents(){
  if(useSupa){
    const { data } = await supa.from("settings").select("value").eq("key","test_events").maybeSingle();
    try{ S.testEvents = data && data.value ? JSON.parse(data.value) : []; }catch(e){ S.testEvents=[]; }
  } else {
    try{ S.testEvents = JSON.parse(localStorage.getItem("nn-test-events")||"[]"); }catch(e){ S.testEvents=[]; }
  }
}
async function trSaveEvents(list){
  if(useSupa) await DB.saveList("test_events", list);
  else localStorage.setItem("nn-test-events", JSON.stringify(list));
  S.testEvents = list;
}
const trEvSort = (a,b)=>String(a.to).localeCompare(String(b.to))||String(a.from).localeCompare(String(b.from));
const trByNow = ()=> (S.tr&&S.tr.by)||"sport";
const trEventsFor = (sport,gender)=>S.testEvents.filter(e=>(e.by||"sport")===trByNow()&&e.sport===sport&&e.gender===gender).slice().sort(trEvSort);

/* ---------- team + lifts ---------- */
const trTeam = (sport,gender)=>S.athletes.filter(a=>listOf(trByNow()==="period"?a.periods:a.sports).includes(sport)&&(gender==="All"||a.gender===gender));
const trGroupWord = ()=> trByNow()==="period"?"class":"roster";
const trLine = (ex,gender)=>{ const k=gender==="Female"?ex.kpi_f:ex.kpi_m; return k==null||k===""?null:+k; };
const trHasLine = (ex,gender)=> gender==="All" ? (trLine(ex,"Male")!=null||trLine(ex,"Female")!=null) : trLine(ex,gender)!=null;
const trName = a=>`${(a.last_name||"").trim()}, ${(a.first_name||"").trim()}`;
const tr2 = v=>(Math.round(v*100)/100).toFixed(2);
const trLineTxt = v=>{ const s=String(+v); return s.includes(".")?s:s+".0"; };
const trShort = ex=>({"Bench Press":"Bench","Back Squat":"Squat","Front Squat":"Front Squat","Trap Bar Deadlift":"Trap Bar"})[ex.name]||ex.name;
const trDate = iso=>{ const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${+m[2]}/${+m[3]}/${m[1].slice(2)}`:String(iso||""); };
const trRange = (f,t)=>f===t?trDate(f):`${trDate(f)}–${trDate(t)}`;
const trMedian = a=>{ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const trPct = (a,b)=>b?Math.round(a/b*100):0;
const trLb = v=>fmtNum(v);

/* Best entry per athlete per lift inside [from,to]; graded against the line using test-day body weight. */
function trBuild(sport,gender,from,to,liftIds){
  const team=trTeam(sport,gender), ids=new Set(team.map(a=>a.id));
  const inR=t=>{ const d=String(t.date); return d>=from&&d<=to; };
  const tt=S.tests.filter(t=>ids.has(t.athlete_id)&&inR(t));
  let lifts=S.exercises.filter(e=>isRatio(e)&&trHasLine(e,gender)).sort((a,b)=>(+a.sort||0)-(+b.sort||0));
  lifts = liftIds ? lifts.filter(e=>liftIds.includes(e.id)) : lifts.filter(e=>tt.some(t=>t.ex_id===e.id));
  const out={sport,gender,from,to,team,lifts,rows:{},stats:{}};
  for(const ex of lifts){
    const rows=[];
    for(const a of team){
      const line=trLine(ex,a.gender==="Female"?"Female":"Male"); if(line==null) continue;
      const r=tt.filter(t=>t.athlete_id===a.id&&t.ex_id===ex.id);
      if(!r.length) continue;
      const t=r.reduce((x,y)=>(+y.value>+x.value)||(+y.value===+x.value&&tOrder(y,x)>0)?y:x);
      const bwT=+t.bw>0?+t.bw:null, bw=bwT||(+a.weight>0?+a.weight:null);
      const row={id:a.id,a,name:trName(a),bw,bwProfile:!bwT,best:+t.value,w:+t.weight,reps:+t.reps||1,date:String(t.date),
        how:(+t.reps>1)?`${fmtNum(t.weight)}×${t.reps}`:"1RM",ratio:null,status:"below",reason:"",line};
      if(!bw){ row.status="flag"; row.reason="no body weight on file"; rows.push(row); continue; }
      row.ratio=row.best/bw;
      if(row.ratio < line*0.4){ row.status="flag"; row.reason=`${trLb(row.best)} lb at ${trLb(bw)} lb BW (${tr2(row.ratio)}×) is too low to be real`; }
      else if(row.best >= line*bw - 1e-9) row.status="over";
      else if(Math.round(row.ratio*100)/100 >= Math.round(line*0.9*100)/100) row.status="reach";
      rows.push(row);
    }
    rows.sort((x,y)=>byName(x.a,y.a));
    out.rows[ex.id]=rows;
    const v=rows.filter(r=>r.status!=="flag"), over=v.filter(r=>r.status==="over").length, reach=v.filter(r=>r.status==="reach").length;
    const lines=[...new Set(rows.map(r=>r.line))];
    const lm=trLine(ex,"Male"), lf=trLine(ex,"Female");
    const mixed=gender==="All"&&lines.length>1;
    const line=mixed?null:(lines[0]!=null?lines[0]:trLine(ex,gender==="All"?"Male":gender));
    const lineTxt=mixed?`${trLineTxt(lm)}× boys / ${trLineTxt(lf)}× girls`:`${trLineTxt(line)}×`;
    out.stats[ex.id]={line,mixed,lineTxt,lm,lf,n:v.length,over,reach,below:v.length-over-reach,pct:trPct(over,v.length),
      med:trMedian(v.map(r=>mixed?r.ratio/r.line:r.ratio)),avg:v.length?v.reduce((s,r)=>s+r.best,0)/v.length:0};
  }
  return out;
}
/* Each athlete's first test day on record for a lift (best entry that day), before `before`. */
function trFirstOnRecord(aid,exid,before){
  const r=S.tests.filter(t=>t.athlete_id===aid&&t.ex_id===exid&&String(t.date)<before);
  if(!r.length) return null;
  const d=r.map(t=>String(t.date)).reduce((x,y)=>y<x?y:x);
  const t=r.filter(x=>String(x.date)===d).reduce((x,y)=>(+y.value>+x.value)?y:x);
  const a=S.athletes.find(x=>x.id===aid);
  const bw=+t.bw>0?+t.bw:(a&&+a.weight>0?+a.weight:null);
  return {best:+t.value,bw,date:d,ratio:bw?(+t.value)/bw:null};
}

/* ---------- state + defaults ---------- */
function trLatestDate(sport,gender){
  const ids=new Set(trTeam(sport,gender).map(a=>a.id));
  const ok=new Set(S.exercises.filter(e=>isRatio(e)&&trHasLine(e,gender)).map(e=>e.id));
  let d=null; for(const t of S.tests){ if(ids.has(t.athlete_id)&&ok.has(t.ex_id)){ const x=String(t.date); if(!d||x>d) d=x; } }
  return d;
}
function trGenderFor(sport){
  if(trByNow()==="period") return "All";
  let m=0,f=0; for(const a of S.athletes){ if(listOf(a.sports).includes(sport)){ if(a.gender==="Female") f++; else m++; } }
  if(/^G /.test(sport)) return "Female"; if(/^B /.test(sport)) return "Male";
  return f>m?"Female":"Male";
}
function trPickSport(sport){
  const gender=trGenderFor(sport);
  const ev=trEventsFor(sport,gender);
  const by=trByNow();
  if(ev.length){ const e=ev[ev.length-1]; return {by,sport,gender,eventId:e.id,from:e.from,to:e.to,cmp:"prev"}; }
  const d=trLatestDate(sport,gender)||today();
  return {by,sport,gender,eventId:"",from:d,to:d,cmp:"prev"};
}
function trInit(){
  if(S.tr) return;
  const sp=S.sports.includes("Football")?"Football":(S.sports[0]||"");
  S.tr=trPickSport(sp);
}
const trCurEvent = ()=>S.tr.eventId?S.testEvents.find(e=>e.id===S.tr.eventId)||null:null;

/* ---------- comparison ---------- */
/* Returns {label, short, mode, prevBuild|null}. mode: none | event | career */
function trCompare(cur){
  const evs=trEventsFor(cur.sport,cur.gender).filter(e=>e.id!==S.tr.eventId && String(e.to)<cur.from);
  const c=S.tr.cmp;
  if(c==="career") return {mode:"career",label:"each athlete's first test on record",short:"first test on record"};
  let e=null;
  if(c==="prev") e=evs.length?evs[evs.length-1]:null;
  else e=evs.find(x=>x.id===c)||null;
  if(!e) return {mode:"none",label:"",short:""};
  return {mode:"event",ev:e,label:`${e.name} (${trRange(e.from,e.to)})`,short:e.name,
    build:trBuild(cur.sport,cur.gender,e.from,e.to,cur.lifts.map(x=>x.id))};
}
/* Comparison record for one athlete+lift, or null */
function trPrevRow(cmp,exid,row,cur){
  if(cmp.mode==="event"){ const r=(cmp.build.rows[exid]||[]).find(x=>x.id===row.id); return r&&r.status!=="flag"?{best:r.best,ratio:r.ratio,status:r.status}:null; }
  if(cmp.mode==="career"){
    const f=trFirstOnRecord(row.id,exid,cur.from); if(!f||!f.bw) return null;
    const line=row.line;
    return {best:f.best,ratio:f.ratio,status:f.best>=line*f.bw-1e-9?"over":"below",date:f.date};
  }
  return null;
}

/* ---------- auto flags ---------- */
function trFlags(cur){
  const F=[];
  for(const ex of cur.lifts){
    for(const r of cur.rows[ex.id].filter(x=>x.status==="flag"))
      F.push(`<b>${esc(r.name)}, ${esc(ex.name.toLowerCase())}:</b> ${esc(r.reason)}. Left out of the team numbers and marked Verify in the roster. Fix or delete the entry in the dashboard.`);
  }
  const bp=cur.rows.bp, sq=cur.rows.bsq;
  if(bp&&sq){
    const m=new Map(bp.filter(r=>r.status!=="flag").map(r=>[r.id,r]));
    const low=sq.filter(r=>r.status!=="flag"&&m.has(r.id)&&r.best<1.22*m.get(r.id).best).sort((x,y)=>byName(x.a,y.a));
    if(low.length) F.push(`<b>Squat barely above bench</b> (squat less than 1.22× bench): ${low.map(r=>`${esc(r.a.last_name)} (${trLb(r.best)} vs ${trLb(m.get(r.id).best)})`).join(", ")}. Retest with a depth standard. These athletes are probably closer to the line than this test shows.`);
  }
  if(cur.lifts.length>1){
    const parts=[];
    for(const ex of cur.lifts){
      const others=cur.lifts.filter(o=>o.id!==ex.id);
      const only=cur.rows[ex.id].filter(r=>others.every(o=>!cur.rows[o.id].some(x=>x.id===r.id)));
      if(only.length) parts.push(`${esc(trShort(ex))} only: ${only.map(r=>esc(r.a.last_name)).join(", ")}`);
    }
    if(parts.length) F.push(`<b>Tested on one lift only.</b> ${parts.join(". ")}. They show as Not tested for the lift they missed.`);
  }
  const tested=new Set(); cur.lifts.forEach(ex=>cur.rows[ex.id].forEach(r=>tested.add(r.id)));
  const dnt=cur.team.filter(a=>!tested.has(a.id)).sort(byName);
  if(dnt.length) F.push(`<b>${dnt.length} on the ${esc(cur.sport)} ${trGroupWord()} did not test</b> in this window: ${dnt.map(a=>esc(trName(a))).join("; ")}.`);
  const prof=[]; cur.lifts.forEach(ex=>cur.rows[ex.id].forEach(r=>{ if(r.bwProfile&&r.bw&&!prof.includes(r.name)) prof.push(r.name); }));
  if(prof.length) F.push(`<b>No test-day body weight for ${prof.length} athlete${prof.length>1?"s":""}</b>; the profile weight was used instead: ${prof.sort().map(esc).join("; ")}.`);
  const jumps=[]; const seen=new Set();
  cur.lifts.forEach(ex=>cur.rows[ex.id].forEach(r=>{ if(seen.has(r.id)||r.bwProfile||!r.bw) return; seen.add(r.id);
    const prior=S.tests.filter(t=>t.athlete_id===r.id&&+t.bw>0&&String(t.date)<cur.from).sort(tOrder);
    if(prior.length){ const pb=+prior[prior.length-1].bw, d=Math.round((r.bw-pb)*10)/10; if(Math.abs(d)>=10) jumps.push(`${esc(r.name)} (${trLb(pb)} → ${trLb(r.bw)}, ${d>0?"+":""}${trLb(d)})`); } }));
  if(jumps.length) F.push(`<b>Body weight changed 10+ lb since the last weigh-in:</b> ${jumps.join("; ")}. Real growth or a typo — confirm on the scale.`);
  const bws=[]; cur.lifts.forEach(ex=>cur.rows[ex.id].forEach(r=>{ if(r.bw) bws.push(r.bw); }));
  const round=bws.filter(b=>b%5===0).length;
  if(bws.length>=10 && round/bws.length>0.5) F.push(`<b>Body weights look rounded:</b> ${round} of ${bws.length} graded entries end in 0 or 5. Athletes near the line can flip status on a few pounds, so weigh everyone on test day.`);
  const names=new Set(); cur.lifts.forEach(ex=>cur.rows[ex.id].forEach(r=>{ const a=r.a; if(/^[a-z]/.test(a.first_name||"")||/^[a-z]/.test(a.last_name||"")) names.add(trName(a)); }));
  if(names.size) F.push(`<b>Names to clean up</b> (lower-case): ${[...names].sort().map(esc).join("; ")}. Fix them on the Athletes tab.`);
  const ids=new Set(S.athletes.filter(a=>!listOf(trByNow()==="period"?a.periods:a.sports).length&&(cur.gender==="All"||a.gender===cur.gender)).map(a=>a.id));
  const liftSet=new Set(cur.lifts.map(e=>e.id));
  const untagged=new Set(S.tests.filter(t=>ids.has(t.athlete_id)&&liftSet.has(t.ex_id)&&String(t.date)>=cur.from&&String(t.date)<=cur.to).map(t=>t.athlete_id));
  if(untagged.size) F.push(`<b>${untagged.size} ${cur.gender==="All"?"":cur.gender==="Female"?"female ":"male "}athlete${untagged.size>1?"s":""} tested in this window with no ${trByNow()==="period"?"class period":"sport"} tagged</b>, so they are not in any ${trByNow()==="period"?"class":"team"} report: ${S.athletes.filter(a=>untagged.has(a.id)).sort(byName).map(a=>esc(trName(a))).join("; ")}.`);
  return F;
}

/* ---------- SVG charts ---------- */
function trHist(ex,st,rows){
  const v0=rows.filter(r=>r.status!=="flag"); if(!v0.length) return "";
  const v=st.mixed?v0.map(r=>({...r,ratio:r.ratio/r.line})):v0;
  const line=st.mixed?1:st.line, rs=v.map(r=>r.ratio), span=Math.max(...rs)-Math.min(...rs);
  const step=span>1.2?0.10:0.05;
  const idx=r=>Math.floor((r-line)/step+1e-9);
  const lo=Math.min(...v.map(r=>idx(r.ratio))), hi=Math.max(...v.map(r=>idx(r.ratio)),0);
  const bins=[]; for(let i=lo;i<=hi;i++) bins.push({i,b:line+i*step,n:v.filter(r=>idx(r.ratio)===i).length});
  const W=1000,H=300,x0=40,x1=W-10,y0=36,yb=H-34,bw=(x1-x0)/bins.length,mx=Math.max(1,...bins.map(d=>d.n));
  const y=n=>yb-n/mx*(yb-y0); const every=bins.length>16?2:1; let s="";
  bins.forEach((d,k)=>{ const x=x0+k*bw, over=d.i>=0;
    if(d.n) s+=`<rect x="${x+2}" y="${y(d.n)}" width="${Math.max(1,bw-4)}" height="${yb-y(d.n)}" fill="${over?"#002F55":"#B9C2CD"}"><title>${st.mixed?Math.round(d.b*100)+"% of line":d.b.toFixed(2)+"×"}: ${d.n}</title></rect><text class="tr-vl" x="${x+bw/2}" y="${y(d.n)-5}" text-anchor="middle">${d.n}</text>`;
    if((d.i%every)===0) s+=`<text class="tr-ax" x="${x}" y="${yb+16}" text-anchor="middle">${st.mixed?Math.round(d.b*100)+"%":d.b.toFixed(2)+"×"}</text>`; });
  const li=bins.findIndex(d=>d.i===0), xl=x0+li*bw;
  s+=`<line x1="${x0}" x2="${x1}" y1="${yb}" y2="${yb}" stroke="#D6DDE6"/><line x1="${xl}" x2="${xl}" y1="${y0-14}" y2="${yb}" stroke="#FF4800" stroke-width="3" stroke-dasharray="7 5"/><text class="tr-ref" x="${xl+8}" y="${y0-2}">THE LINE · ${st.mixed?"100% OF EACH ATHLETE'S LINE":trLineTxt(line)+"× BW"}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ex.name)} ratio distribution">${s}</svg>`;
}
function trGrowthSVG(pts,lifts){
  const W=560,H=250,x0=44,x1=W-90,y0=24,yb=H-34,n=Math.max(pts.length,4);
  const x=i=>x0+(x1-x0)*(n===1?0:i/(n-1)), y=v=>yb-v/100*(yb-y0); let s="";
  [0,25,50,75,100].forEach(v=>{ s+=`<line x1="${x0}" x2="${x1}" y1="${y(v)}" y2="${y(v)}" stroke="#E7EBF0"/><text class="tr-ax" x="${x0-6}" y="${y(v)+3}" text-anchor="end">${v}%</text>`; });
  for(let i=0;i<n;i++){ const p=pts[i]; s+=`<text class="tr-ax" x="${x(i)}" y="${yb+16}" text-anchor="middle">${p?esc(trDate(p.d)):"Test "+(i+1)}</text>`; }
  const labY=[];
  lifts.forEach((ex,k)=>{ const c=TR_COLORS[k%TR_COLORS.length], q=pts.map((p,i)=>({i,v:p.v[ex.id]})).filter(o=>o.v!=null);
    if(q.length>1) s+=`<polyline fill="none" stroke="${c}" stroke-width="3" points="${q.map(o=>`${x(o.i)},${y(o.v)}`).join(" ")}"/>`;
    q.forEach(o=>{ s+=`<circle cx="${x(o.i)}" cy="${y(o.v)}" r="6" fill="${c}"><title>${esc(trShort(ex))} ${esc(trDate(pts[o.i].d))}: ${o.v}%</title></circle>`; });
    if(q.length){ const l=q[q.length-1]; let ly=y(l.v)+4; while(labY.some(z=>Math.abs(z-ly)<12)) ly+=12; labY.push(ly);
      s+=`<text class="tr-vl" x="${x(l.i)+10}" y="${ly}" style="fill:${c}">${esc(trShort(ex))} ${l.v}%</text>`; } });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Percent over the line by test date">${s}</svg>`;
}

/* ---------- the report itself (pure HTML string, also used for the download) ---------- */
function trReportHTML(){
  const T=S.tr, ev=trCurEvent();
  const cur=trBuild(T.sport,T.gender,T.from,T.to);
  if(!cur.lifts.length) return null;
  const evName=ev?ev.name:"Unsaved test";
  const cmp=trCompare(cur);
  const L=cur.lifts, ST=cur.stats, R=cur.rows;
  const sexWord=T.gender==="All"?"":T.gender==="Female"?"female":"male";
  const lineList=L.map(ex=>`${ST[ex.id].lineTxt} bodyweight for ${ex.name.toLowerCase()}`);
  const joinAnd=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+(a.length>2?",":"")+" and "+a[a.length-1];
  const liftNames=joinAnd(L.map(ex=>ex.name.toLowerCase()));
  const lede=`${evName}: ${liftNames}, graded against the program's ${sexWord?sexWord+" ":""}strength line${L.length>1?"s":""} of ${joinAnd(lineList)}${T.gender==="All"?" (each athlete is graded against the line for their own gender)":""}. Each saved test adds a point to the growth tracker.`;

  /* honest read */
  const byId=k=>new Map(R[k].filter(r=>r.status!=="flag").map(r=>[r.id,r]));
  const maps=Object.fromEntries(L.map(ex=>[ex.id,byId(ex.id)]));
  const allOver=L.length>1?[...maps[L[0].id].values()].filter(r=>r.status==="over"&&L.every(ex=>maps[ex.id].get(r.id)&&maps[ex.id].get(r.id).status==="over")).length:null;
  const t1=`<b>${L.map(ex=>`<span class="tr-mono">${ST[ex.id].over}</span> of <span class="tr-mono">${ST[ex.id].n}</span> ${ex.id==="bp"&&ST[ex.id].line===1?"bench their bodyweight":`are over the ${esc(trShort(ex).toLowerCase())} line (${ST[ex.id].lineTxt})`}`).join(". ")}.</b>${allOver!=null?` <span class="tr-mono">${allOver}</span> ${allOver===1?"is":"are"} over the line on ${L.length===2?"both lifts":"every lift"}.`:""}`;
  const t2=`<b>The fastest wins are close.</b> ${joinAnd(L.map(ex=>`<span class="tr-mono">${ST[ex.id].reach}</span> on ${esc(trShort(ex).toLowerCase())}`))} ${L.reduce((s,ex)=>s+ST[ex.id].reach,0)===1?"is":"are"} within 10% of the line. Each one has a next-test target on the pages that follow.`;
  /* heaviest quarter */
  const bwOf=new Map(); L.forEach(ex=>R[ex.id].forEach(r=>{ if(r.bw&&r.status!=="flag") bwOf.set(r.id,r.bw); }));
  const bwSorted=[...bwOf.values()].sort((a,b)=>b-a);
  let t3="";
  if(bwSorted.length>=12){
    const cut=bwSorted[Math.floor(bwSorted.length/4)-1];
    const heavy=new Set([...bwOf.entries()].filter(([,b])=>b>=cut).map(([id])=>id));
    const parts=L.map(ex=>{ const h=R[ex.id].filter(r=>r.status!=="flag"&&heavy.has(r.id)); return {ex,n:h.length,o:h.filter(r=>r.status==="over").length,p:trPct(h.filter(r=>r.status==="over").length,h.length)}; });
    const teamP=L.map(ex=>ST[ex.id].pct);
    const lagging=parts.some((p,i)=>p.n&&p.p<teamP[i]);
    t3=`<b>${lagging?"The heaviest athletes have the furthest to go.":"Size is not holding this group back."}</b> Of the ${heavy.size} athletes at ${trLb(cut)} lb or more, ${joinAnd(parts.filter(p=>p.n).map(p=>`<span class="tr-mono">${p.o}</span> of <span class="tr-mono">${p.n}</span> are over the ${esc(trShort(p.ex).toLowerCase())} line`))}.${lagging?" For this group, track pounds gained as well as the ratio.":""}`;
  }
  const worst=Math.min(...L.map(ex=>ST[ex.id].pct)), best=Math.max(...L.map(ex=>ST[ex.id].pct));
  const reachTot=L.reduce((s,ex)=>s+ST[ex.id].reach,0), nTot=L.reduce((s,ex)=>s+ST[ex.id].n,0);
  const auto = worst>=60?["Strong team.","Keep climbing."] : (best>=25&&reachTot>=nTot*0.15)?["Strong top.","Fill the middle."] : ["Build the base.","Every rep counts."];
  const v1=(ev&&ev.v1)||T.v1||auto[0], v2=(ev&&ev.v2)||T.v2||auto[1];

  const seg=(n,c,t)=>n?`<div style="flex:${n};background:${c}" title="${t}">${n}</div>`:"";
  const cards=L.map(ex=>{ const s=ST[ex.id]; return `<div class="tr-lc"><h3>${esc(ex.name)}<small>LINE ${esc(s.lineTxt.toUpperCase())} BW</small></h3>
    <div class="tr-split">${seg(s.over,"#002F55","Over")}${seg(s.reach,"#FF4800","Within reach")}${seg(s.below,"#B9C2CD","Below")}</div>
    <div class="tr-legend"><span><i class="tr-dot" style="background:#002F55"></i>Over <b>${s.over}</b></span><span><i class="tr-dot" style="background:#FF4800"></i>Within 10% <b>${s.reach}</b></span><span><i class="tr-dot" style="background:#B9C2CD"></i>Below <b>${s.below}</b></span></div>
    <div class="tr-kpis"><div><span class="lb">Over the line</span><b>${s.pct}%</b><span class="s">${s.over} of ${s.n}</span></div><div><span class="lb">${s.mixed?"Median % of line":"Median ratio"}</span><b>${s.mixed?Math.round(s.med*100)+"%":tr2(s.med)+"×"}</b><span class="s">${s.mixed?"line = 100%":"line "+esc(s.lineTxt)}</span></div><div><span class="lb">Average best</span><b>${Math.round(s.avg)}</b><span class="s">${esc(ex.unit)}</span></div></div></div>`; }).join("");

  /* lift pages */
  const target=(r,line)=>{ const need=line*r.bw; if(r.reps<=1) return `${Math.ceil(need/5)*5}×1`; return `${Math.ceil(need*34/36/5)*5}×3`; };
  const liftSecs=L.map(ex=>{ const s=ST[ex.id], rows=R[ex.id];
    const reach=rows.filter(r=>r.status==="reach"), over=rows.filter(r=>r.status==="over"), fl=rows.filter(r=>r.status==="flag");
    const est=rows.filter(r=>r.status!=="flag"&&r.reps>1).length, sing=rows.filter(r=>r.status!=="flag"&&r.reps<=1).length;
    const note=`The line is ${esc(s.lineTxt)} bodyweight. ${est} of ${s.n} maxes are estimated from a multi-rep set; ${sing===1?"the other 1 is a tested single":`the other ${sing} are tested singles`}.${fl.length?` ${fl.length} entr${fl.length>1?"ies are":"y is"} left out until verified (see Coach Notes).`:""}`;
    return `<section class="tr-sec tr-pb"><div class="tr-head"><span class="tr-eye">${esc(ex.name)} · line ${esc(s.lineTxt)} bodyweight</span><h2>${esc(trShort(ex))} <span>${s.pct}% over</span></h2><p>${note}</p></div>
    <div class="tr-chart"><h3>${s.over} of ${s.n} over the line · ${s.reach} within 10%</h3><div class="tr-sub">${s.mixed?`Athletes per band of best ${esc(trShort(ex).toLowerCase())} as a % of their own line (boys ${trLineTxt(s.lm)}×, girls ${trLineTxt(s.lf)}× BW)`:`Athletes per band of best ${esc(trShort(ex).toLowerCase())} ÷ bodyweight`}. Bands start at the line. Navy = over the line.</div>${trHist(ex,s,rows)}</div>
    <div class="tr-two"><div class="tr-panel hot"><h3>Within reach</h3><div class="tr-sub">Within 10% of the line, A–Z. Target = the 3-rep load that estimates at the line (tested-single athletes get a single).</div>
    ${reach.length?`<table class="tr-mini"><thead><tr><th>Athlete</th><th>BW</th><th>Best</th><th>Gap</th><th>Next target</th></tr></thead><tbody>${reach.map(r=>`<tr><td class="n">${esc(r.name)}</td><td class="m">${trLb(r.bw)}</td><td class="m">${trLb(r.best)}</td><td class="m">${trLb(Math.round((r.line*r.bw-r.best)*10)/10)}</td><td class="t">${target(r,r.line)}</td></tr>`).join("")}</tbody></table>`:`<p class="tr-empty">No one within 10% this test.</p>`}</div>
    <div class="tr-panel"><h3>Over the line</h3><div class="tr-sub">A–Z, with ratio.</div><div class="tr-names">${over.length?over.map(r=>`<span>${esc(r.name)}<i>${tr2(r.ratio)}×</i></span>`).join(""):`<p class="tr-empty">No one over the line this test.</p>`}</div></div></div></section>`; }).join("");

  /* growth */
  const evs=trEventsFor(T.sport,T.gender).filter(e=>e.id!==T.eventId&&String(e.to)<T.from).slice(-9);
  const pts=evs.map(e=>{ const b=trBuild(T.sport,T.gender,e.from,e.to,L.map(x=>x.id)); return {d:e.to,name:e.name,v:Object.fromEntries(L.map(ex=>[ex.id,b.stats[ex.id]&&b.stats[ex.id].n?b.stats[ex.id].pct:null]))}; });
  pts.push({d:T.to,name:evName,v:Object.fromEntries(L.map(ex=>[ex.id,ST[ex.id].pct]))});
  let gTitle, gSub, side="", movers="", compared="";
  if(cmp.mode==="none"){
    gTitle=`Baseline set ${trDate(T.to)}: ${L.map(ex=>`${trShort(ex).toLowerCase()} ${ST[ex.id].pct}%`).join(", ")}`;
    gSub=pts.length>1?"No earlier saved test to compare against with this setting.":`This is the first saved test for this ${T.by==="period"?"class":"team"}, so it sets the baseline. Every test after this adds a point and fills the change columns in the roster.`;
    side=`<div class="tr-base"><span class="tr-eye">${esc(evName)}</span><b class="big">Baseline locked</b><p>From the next saved test on, this page shows:</p><ul><li>Team % over the line for each test date</li><li>Who crossed the line since the comparison test</li><li>Biggest gains in pounds, by lift</li><li>A change column for every athlete in the roster</li></ul></div>`;
  } else {
    if(cmp.mode==="event"){
      const P=cmp.build;
      gTitle=L.map(ex=>`${trShort(ex)} ${P.stats[ex.id]&&P.stats[ex.id].n?P.stats[ex.id].pct+"% → ":""}${ST[ex.id].pct}%`).join(" · ");
      gSub=`Change from ${cmp.label} to ${evName} (${trRange(T.from,T.to)}). Each saved test adds a point.`;
    } else {
      gTitle=`${evName}: ${L.map(ex=>`${trShort(ex).toLowerCase()} ${ST[ex.id].pct}%`).join(", ")}`;
      gSub=`Change for each athlete from their first test on record to ${evName}. This is the long view: every rep since they walked in.`;
    }
    let cnt=[];
    L.forEach((ex,k)=>{
      const both=R[ex.id].filter(r=>r.status!=="flag").map(r=>({r,p:trPrevRow(cmp,ex.id,r,cur)})).filter(o=>o.p);
      cnt.push(`${trShort(ex).toLowerCase()} ${both.length} of ${ST[ex.id].n}`);
      const crossed=both.filter(o=>o.r.status==="over"&&o.p.status!=="over").map(o=>o.r.name);
      side+=`<div class="tr-panel${k===0?" hot":""}" style="margin-bottom:10px"><h3>Crossed the line · ${esc(trShort(ex))}</h3><div class="tr-names">${crossed.length?crossed.map(n=>`<span>${esc(n)}</span>`).join(""):`<p class="tr-empty">None since ${esc(cmp.short)}.</p>`}</div></div>`;
      const gains=both.map(o=>({n:o.r.name,g:Math.round((o.r.best-o.p.best)*10)/10})).filter(g=>g.g>0).sort((a,b)=>b.g-a.g).slice(0,8);
      movers+=`<h3 class="tr-h3">Biggest gains · ${esc(trShort(ex))}</h3><div class="tr-movers">${gains.length?gains.map(g=>`<div class="tr-mv"><b>${esc(g.n)}</b><span>+${trLb(g.g)} ${esc(ex.unit)}</span></div>`).join(""):`<div class="tr-mv">No gains recorded</div>`}</div>`;
    });
    compared=`Compared: ${cnt.join(", ")} tested both times.`;
    gSub+=` ${compared}`;
  }
  const growth=`<section class="tr-sec tr-pb"><div class="tr-head"><span class="tr-eye">Every test, same athletes</span><h2>Growth <span>Tracker</span></h2><p>${esc(gSub)}</p></div>
    <div class="tr-growth"><div class="tr-chart"><h3>${esc(gTitle)}</h3><div class="tr-sub">% of tested athletes over the line, by saved test</div>${trGrowthSVG(pts,L)}</div><div>${side}</div></div>${movers}</section>`;

  /* roster */
  const names=new Map(); L.forEach(ex=>R[ex.id].forEach(r=>names.set(r.id,r)));
  const lbl={over:"Over",reach:"Within 10%",below:"Below",flag:"Verify"};
  const cell=(ex,id)=>{ const r=R[ex.id].find(x=>x.id===id);
    if(!r) return `<td class="num l tr-na">—</td><td class="num tr-na">—</td><td><span class="tr-chip below">Not tested</span></td><td class="num tr-na">—</td>`;
    let ch;
    if(cmp.mode==="none") ch='<span class="tr-na">baseline</span>';
    else { const p=r.status==="flag"?null:trPrevRow(cmp,ex.id,r,cur);
      if(!p) ch=`<span class="tr-na">${cmp.mode==="career"?"first test":"—"}</span>`;
      else { const d=Math.round((r.best-p.best)*10)/10; ch=`<span class="${d>0?"tr-up":d<0?"tr-dn":"tr-na"}">${d>0?"+":""}${trLb(d)} ${esc(ex.unit)}</span>`; } }
    return `<td class="num l">${trLb(r.best)}<small>${esc(r.how)}</small></td><td class="num">${r.ratio!=null?tr2(r.ratio)+"×":"—"}</td><td><span class="tr-chip ${r.status}">${lbl[r.status]}</span></td><td class="num">${ch}</td>`; };
  const rosterRows=[...names.values()].sort((x,y)=>byName(x.a,y.a)).map(r0=>{
    const bwset=[...new Set(L.map(ex=>{ const r=R[ex.id].find(x=>x.id===r0.id); return r&&r.bw?trLb(r.bw):null; }).filter(Boolean))];
    const allO=L.length>1&&L.every(ex=>{ const r=R[ex.id].find(x=>x.id===r0.id); return r&&r.status==="over"; });
    return `<tr><td class="nm">${esc(r0.name)}</td><td class="num">${bwset.join("/")||"—"}${r0.bwProfile?"<small>~</small>":""}</td>${L.map(ex=>cell(ex,r0.id)).join("")}${L.length>1?`<td>${allO?`<span class="tr-chip both">${L.length===2?"Both":"All"}</span>`:""}</td>`:""}</tr>`; }).join("");
  const chgHead=cmp.mode==="none"?"Change":cmp.mode==="career"?"Since first":`Vs ${esc(cmp.short)}`;
  const roster=`<section class="tr-sec tr-pb"><div class="tr-head"><span class="tr-eye">Every athlete · A–Z</span><h2>Full <span>Roster</span></h2><p>${names.size} athletes tested ${T.from===T.to?"on":"from"} ${esc(trRange(T.from,T.to))}. Best = estimated 1RM from the rep set shown (or a tested 1RM). Change = ${cmp.mode==="none"?"pounds gained since the last test (starts with the next saved test)":`pounds gained vs ${esc(cmp.label)}`}.${[...names.values()].some(r=>r.bwProfile)?" ~ = profile body weight used (no test-day weight).":""}</p></div>
    <div class="tr-tbl"><table class="tr-ros"><thead><tr><th></th><th></th>${L.map(ex=>`<th class="grp" colspan="4">${esc(trShort(ex))} · line ${esc(ST[ex.id].lineTxt)} BW</th>`).join("")}${L.length>1?"<th></th>":""}</tr>
    <tr><th>Athlete</th><th>BW</th>${L.map(()=>`<th>Best (lb)</th><th>Ratio</th><th>Status</th><th>${chgHead}</th>`).join("")}${L.length>1?`<th>${L.length===2?"Both lines":"All lines"}</th>`:""}</tr></thead><tbody>${rosterRows}</tbody></table></div></section>`;

  /* notes */
  const flags=trFlags(cur);
  const method=[
    "Best = the best entry in the test window. Multi-rep sets are converted to an estimated 1RM with the Brzycki formula (weight × 36 ÷ (37 − reps)); tested singles are used as entered.",
    "Ratio = best ÷ body weight on test day (the profile weight is used only when no test-day weight was entered). Over = best at or above the line × body weight.",
    `Within 10% = ratio at or above ${L.map(ex=>{const st=ST[ex.id]; return st.mixed?`${tr2(st.lm*0.9)}× (boys) / ${tr2(st.lf*0.9)}× (girls) for ${esc(trShort(ex).toLowerCase())}`:`${tr2(st.line*0.9)}× for ${esc(trShort(ex).toLowerCase())}`;}).join(", ")}. Next target = the 3-rep load (or single) that estimates at the line, rounded up to the next 5 lb.`,
    `Lines come from the dashboard's Setup tab${sexWord?` (${sexWord})`:""}: ${L.map(ex=>`${esc(ex.name)} ${esc(ST[ex.id].lineTxt)} BW`).join(", ")}.${T.gender==="All"?" Each athlete is graded against the line for their own gender.":""}`,
    cmp.mode==="career"?"Change = this test's best minus the athlete's first test on record for the same lift. Athletes testing for the first time show \"first test\".":
      cmp.mode==="event"?`Change = this test's best minus the best in ${esc(cmp.label)}, for the same athlete and lift. Athletes who missed that test show —.`:
      "Change starts with the next saved test.",
    "Entries flagged Verify are left out of team numbers and change. All athlete lists are sorted A–Z by last name."
  ];
  const notes=`<section class="tr-sec tr-pb"><div class="tr-head"><span class="tr-eye">For coaches</span><h2>Coach <span>Notes</span></h2><p>How the numbers were built, and what to fix before the next test.</p></div>
    <div class="tr-det"><h4>Data flags this test (${flags.length})</h4>${flags.length?`<ul>${flags.map(f=>`<li>${f}</li>`).join("")}</ul>`:`<ul><li>No data problems found.</li></ul>`}</div>
    ${ev&&ev.note?`<div class="tr-det"><h4>Coach's note</h4><ul><li>${esc(ev.note)}</li></ul></div>`:""}
    <div class="tr-det"><h4>How this report is scored</h4><ul>${method.map(m=>`<li>${m}</li>`).join("")}</ul></div></section>`;

  const html=`<div class="tr-doc">
  <header class="tr-mast"><div class="tr-mast-in">
    <div class="tr-mast-top"><div class="tr-brand"><img alt="Naperville North Huskies" src="${LOGO}"><div class="tr-wm">Huskies Strength &amp; Performance<div class="tr-pil"><span>Train Smart.</span><span>Compete with Purpose.</span><span>Lead Strong.</span></div></div></div>
    <span class="tr-eye">NNHS ${T.by==="period"?"Class · ":""}${esc(T.sport)} · ${esc(evName)} · ${esc(trRange(T.from,T.to))}</span></div>
    <h1>Over the <span>Line</span></h1><p class="tr-lede">${esc(lede)}</p></div></header>
  <div class="tr-wrap">
    <section class="tr-sec"><div class="tr-truth"><div class="tr-copy"><span class="tr-eye">The honest read</span>
      <div class="tr-verdict">${esc(v1)}<br><em>${esc(v2)}</em></div><p>${t1}</p><p>${t2}</p>${t3?`<p>${t3}</p>`:""}</div><div>${cards}</div></div></section>
    ${liftSecs}${growth}${roster}${notes}
    <footer class="tr-foot"><b>BUILT IN THE VILLE</b><span>Train Smart. Compete with Purpose. Lead Strong.</span></footer>
  </div></div>`;
  return {html,cur,ev,evName,auto,v1,v2};
}

/* ---------- the tab (controls + report) ---------- */
function testReportHTML(){
  trInit();
  const T=S.tr, ev=trCurEvent();
  const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel?"selected":""}>${esc(l)}</option>`;
  const evs=trEventsFor(T.sport,T.gender);
  const team=trTeam(T.sport,T.gender);
  const rep=team.length?trReportHTML():null;
  const prevEvs=evs.filter(e=>e.id!==T.eventId&&String(e.to)<T.from);
  const lastPrev=prevEvs.length?prevEvs[prevEvs.length-1]:null;
  const bad=T.from>T.to;
  const ctl=`<div class="card print-hide" style="margin-bottom:22px"><div class="cardhead">TEST REPORT <span class="sub">Over the Line report for a team's coaching staff</span></div>
  <div class="tr-ctl">
    <div class="row">
      <label class="f" style="min-width:140px"><span class="lab">Report for</span><select onchange="A.trBy(this.value)">${opt("sport","A sport",T.by!=="period")}${opt("period","A class period",T.by==="period")}</select></label>
      <label class="f"><span class="lab">${T.by==="period"?"Class period":"Sport"}</span><select onchange="A.trSport(this.value)">${(T.by==="period"?S.periods:S.sports).map(s=>opt(s,s,s===T.sport)).join("")}</select></label>
      <label class="f" style="min-width:120px"><span class="lab">Gender</span><select onchange="A.trSet('gender',this.value)">${opt("All","All (mixed)",T.gender==="All")}${opt("Male","Male",T.gender==="Male")}${opt("Female","Female",T.gender==="Female")}</select></label>
      <label class="f grow"><span class="lab">Test</span><select onchange="A.trEvent(this.value)">${opt("","New / unsaved test (pick dates)",!T.eventId)}${evs.slice().reverse().map(e=>opt(e.id,`${e.name} · ${trRange(e.from,e.to)}`,e.id===T.eventId)).join("")}</select></label>
      <label class="f grow"><span class="lab">Compare to</span><select onchange="A.trSet('cmp',this.value)">
        ${opt("prev",`Previous test${lastPrev?` (${lastPrev.name})`:" (none saved yet)"}`,T.cmp==="prev")}
        ${opt("career","Career baseline (each athlete's first test)",T.cmp==="career")}
        ${prevEvs.slice().reverse().map(e=>opt(e.id,`${e.name} · ${trRange(e.from,e.to)}`,e.id===T.cmp)).join("")}</select></label>
    </div>
    <div class="row">
      <label class="f"><span class="lab">From</span><input type="date" value="${esc(T.from)}" onchange="A.trDates('from',this.value)"></label>
      <label class="f"><span class="lab">To</span><input type="date" value="${esc(T.to)}" onchange="A.trDates('to',this.value)"></label>
      <label class="f grow"><span class="lab">Test name</span><input id="tr-name" value="${esc(ev?ev.name:"Test "+(evs.length+1))}" placeholder="Test 2"></label>
      ${ev?`<button class="btn btn-navy" onclick="A.trSaveEvent()">SAVE CHANGES</button><button class="btn btn-ghost" onclick="A.trDelEvent()">DELETE TEST</button>`
          :`<button class="btn btn-navy" onclick="A.trSaveEvent()">SAVE AS TEST</button>`}
    </div>
    <div class="row">
      <label class="f grow"><span class="lab">Headline line 1</span><input id="tr-v1" value="${esc(ev?ev.v1||"":T.v1||"")}" placeholder="${esc(rep?rep.auto[0]:"Strong top.")}" onchange="A.trHeadline()"></label>
      <label class="f grow"><span class="lab">Headline line 2 (orange)</span><input id="tr-v2" value="${esc(ev?ev.v2||"":T.v2||"")}" placeholder="${esc(rep?rep.auto[1]:"Fill the middle.")}" onchange="A.trHeadline()"></label>
      <label class="f grow"><span class="lab">Coach's note (optional, prints in Coach Notes)</span><input id="tr-note" value="${esc(ev?ev.note||"":T.note||"")}" onchange="A.trHeadline()"></label>
    </div>
    <div class="row">
      <button class="btn btn-orange" onclick="A.trPrint()">PRINT / SAVE PDF</button>
      <button class="btn btn-ghost" onclick="A.trDownload()">DOWNLOAD REPORT FILE</button>
    </div>
    ${bad?`<div class="warn">"From" is after "To" — swap the dates.</div>`:""}
    <div class="hint">Lines come from Setup${T.gender==="All"?" — each athlete is graded against the line for their own gender":` (${esc(T.gender.toLowerCase())})`}. Save each test once so the growth tracker can plot it. Blank headline = the suggested text shown in grey. ${ev?"":"<b>This test is not saved yet</b> — it will not show up in later growth trackers until you save it."}${window.self!==window.top?" <b>Inside the website, PRINT downloads the report file</b> — open it and print from there.":""}</div>
  </div></div>`;
  let body;
  if(!team.length) body=`<div class="alert">No ${T.gender==="All"?"":esc(T.gender.toLowerCase())+" "}athletes are tagged with ${esc(T.sport)}. Tag athletes on the Athletes tab, or pick another ${T.by==="period"?"class period":"sport"} or gender.</div>`;
  else if(!rep) body=`<div class="alert">No ${esc(T.sport)}${T.gender==="All"?"":` (${esc(T.gender.toLowerCase())})`} athlete has a graded lift between ${esc(trDate(T.from))} and ${esc(trDate(T.to))}. A lift is graded when it is a ×BW lift with a line set in Setup.${trLatestDate(T.sport,T.gender)?` Most recent test date for this ${T.by==="period"?"class":"team"}: <b>${esc(trDate(trLatestDate(T.sport,T.gender)))}</b>.`:""}</div>`;
  else body=rep.html;
  return ctl+body;
}

/* ---------- actions ---------- */
Object.assign(A,{
  trSport(v){ S.tr=trPickSport(v); render(); },
  trBy(v){ const prev=S.tr; S.tr={...prev,by:v};
    const list=v==="period"?S.periods:S.sports;
    const pick=v==="sport"?(list.includes("Football")?"Football":list[0]):(list.find(p=>trLatestDate(p,"All"))||list[0]);
    S.tr=trPickSport(pick||""); render(); },
  trSet(k,v){ S.tr[k]=v; if(k==="gender"){ const ev=trEventsFor(S.tr.sport,v);
      if(ev.length){ const e=ev[ev.length-1]; Object.assign(S.tr,{eventId:e.id,from:e.from,to:e.to}); }
      else { const d=trLatestDate(S.tr.sport,v)||today(); Object.assign(S.tr,{eventId:"",from:d,to:d}); } S.tr.cmp="prev"; }
    render(); },
  trEvent(id){ const e=S.testEvents.find(x=>x.id===id);
    if(e) Object.assign(S.tr,{eventId:e.id,from:e.from,to:e.to}); else S.tr.eventId="";
    if(S.tr.cmp!=="prev"&&S.tr.cmp!=="career") S.tr.cmp="prev"; render(); },
  trDates(k,v){ if(!v) return; S.tr[k]=v; if(k==="from"&&S.tr.to<v) S.tr.to=v; render(); },
  trHeadline(){ const g=id=>(document.getElementById(id)||{}).value||""; const ev=trCurEvent();
    const v1=g("tr-v1").trim(), v2=g("tr-v2").trim(), note=g("tr-note").trim();
    if(ev){ const list=S.testEvents.map(e=>e.id===ev.id?{...e,v1,v2,note}:e);
      trSaveEvents(list).then(()=>render()).catch(e=>say("Couldn't save the headline.\n\n"+(e.message||e))); }
    else { Object.assign(S.tr,{v1,v2,note}); render(); } },
  async trSaveEvent(){
    const T=S.tr, name=((document.getElementById("tr-name")||{}).value||"").trim();
    if(!name){ say("Give the test a name, like \"Test 2\" or \"Winter Max\"."); return; }
    if(T.from>T.to){ say("\"From\" is after \"To\" — swap the dates first."); return; }
    const g=id=>((document.getElementById(id)||{}).value||"").trim();
    const ev=trCurEvent();
    const clash=trEventsFor(T.sport,T.gender).find(e=>e.id!==(ev&&ev.id)&&!(e.to<T.from||e.from>T.to));
    if(clash && !(await ask(`These dates overlap "${clash.name}" (${trRange(clash.from,clash.to)}). Overlapping tests count the same entries twice in the growth tracker.\n\nSave anyway?`,{title:"Dates overlap",ok:"Save anyway"}))) return;
    let list;
    if(ev) list=S.testEvents.map(e=>e.id===ev.id?{...e,name,from:T.from,to:T.to,v1:g("tr-v1"),v2:g("tr-v2"),note:g("tr-note")}:e);
    else { const ne={id:uid(),name,by:T.by||"sport",sport:T.sport,gender:T.gender,from:T.from,to:T.to,v1:g("tr-v1"),v2:g("tr-v2"),note:g("tr-note")};
      list=S.testEvents.concat([ne]); T.eventId=ne.id; }
    try{ await trSaveEvents(list); render(); }
    catch(e){ if(!ev) T.eventId=""; say("Couldn't save the test.\n\n"+(e.message||e)); }
  },
  async trDelEvent(){ const ev=trCurEvent(); if(!ev) return;
    if(!(await ask(`Delete the saved test "${ev.name}" (${trRange(ev.from,ev.to)})?\n\nNo athlete numbers are deleted — only the saved test, so it drops off the growth tracker.`,{title:"Delete saved test",ok:"Delete",danger:true}))) return;
    try{ await trSaveEvents(S.testEvents.filter(e=>e.id!==ev.id)); S.tr.eventId=""; if(S.tr.cmp===ev.id) S.tr.cmp="prev"; render(); }
    catch(e){ say("Couldn't delete it.\n\n"+(e.message||e)); } },
  trFileHTML(){
    const r=trReportHTML(); if(!r) return null;
    const title=`${S.tr.sport} ${r.evName} ${S.tr.to} Over the Line`;
    return {name:`NNHS_${S.tr.by==="period"?"Class_":""}${safeName(S.tr.sport)}_${safeName(r.evName)}_${S.tr.to}.html`,
      text:`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(title)}</title><link rel="stylesheet" href="${TR_FONTS}"><style>body{margin:0;background:#F2F4F7}.tr-doc{max-width:1040px;margin:0 auto}.tr-printbar{position:sticky;top:0;z-index:5;background:#0B1E30;color:#fff;padding:10px 16px;font:600 14px system-ui;display:flex;gap:12px;align-items:center;justify-content:center}.tr-printbar button{font:800 13px system-ui;background:#FF4800;color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer}@media print{.tr-printbar{display:none}.tr-doc{max-width:none}}${TR_CSS}</style></head><body><div class="tr-printbar">Huskies Strength &amp; Performance · ${esc(title)} <button onclick="window.print()">PRINT / SAVE PDF</button></div>${r.html}</body></html>`};
  },
  trDownload(){ const f=A.trFileHTML(); if(!f){ say("Nothing to download — no graded lifts in this window."); return; } downloadBlob(f.name,f.text,"text/html;charset=utf-8"); },
  trPrint(){ if(!trReportHTML()){ say("Nothing to print — no graded lifts in this window."); return; }
    if(window.self!==window.top){ A.trDownload(); say("The report file is downloading. Open it and press PRINT / SAVE PDF at the top — printing from inside the website prints the whole page around the dashboard."); return; }
    window.print(); }
});


/* ---------------- boot + live sync ---------------- */
async function boot(){
  if(S.ready) return render();
  try{await DB.load();}catch(e){console.error(e);S.dbError=e.message||String(e);}
  S.ready=true; render();
  if(useSupa){
    /* push-based updates */
    supa.channel("board-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"athletes"},()=>DB.sync())
      .on("postgres_changes",{event:"*",schema:"public",table:"tests"},()=>DB.sync())
      .subscribe();
    /* safety net if realtime isn't enabled on the project */
    setInterval(()=>{ if(S.auth && !inForm()) DB.sync(); }, 8000);
    window.addEventListener("focus",()=>{ if(S.auth && !inForm()) DB.sync(); });
  }
}
(async()=>{
  if(useSupa){
    try{
      const { data } = await supa.auth.getSession();
      if(data && data.session && data.session.user){
        authSet(data.session.user.email);
      } else {
        authClear();
      }
    }catch(e){ authClear(); }
  } else {
    S.auth=authGet();
  }
  if(S.auth) boot(); else render();
})();
</script>
