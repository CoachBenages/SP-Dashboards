<style>
:root{--navy:#002F55;--navy2:#0A4472;--orange:#FF4800;--orange2:#FF6A2E;--bg:#F3F4F6;--card:#fff;--border:#E5E7EB;--mid:#6B7280;--ink:#111827;--green:#047857;--greenbg:#D1FAE5;--greentx:#065F46;--red:#DC2626;--redbg:#FEE2E2;--redtx:#B91C1C;--graybg:#E5E7EB;--graytx:#6B7280}

body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
.osw{font-family:Oswald,Inter,sans-serif;font-weight:700}
header.app{background:var(--navy);color:#fff}
.hrow1{max-width:1180px;margin:0 auto;padding:14px 18px 10px;display:flex;align-items:center;gap:16px}
.hrow2{max-width:1180px;margin:0 auto;padding:0 18px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hlogo{height:58px;flex:0 0 auto}
.htitle{line-height:1.12;flex:1 1 auto;min-width:0}
.htitle .t1{font-size:25px;letter-spacing:-.015em}
.htitle .t2{font-size:12px;font-weight:700;letter-spacing:.13em;color:var(--orange);text-transform:uppercase;margin-top:2px}
.bstamp{color:#5B7A99;letter-spacing:.06em;margin-left:6px;font-size:11px}
.hright{display:flex;align-items:center;gap:14px;flex:0 0 auto;margin-left:auto}
.hemail{font-size:12.5px;color:#B7C7D8}
.hsignout{background:#0B3A63;color:#fff;border:1px solid #1B4E7A;border-radius:7px;padding:8px 16px;font:inherit;font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer}
.hsignout:hover{background:#12507F}
nav{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:none;border:0;color:#B7C7D8;font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.07em;font-size:13.5px;padding:10px 18px;border-radius:7px;cursor:pointer}

.kioskbtn{margin-left:auto;background:#fff;color:var(--navy);border:0;font:inherit;font-weight:900;font-size:14px;padding:11px 20px;border-radius:7px;cursor:pointer;letter-spacing:.03em}

.synced{font-size:11.5px;color:#7A93AC;letter-spacing:.03em}
@media (max-width:820px){
  .hrow1{flex-wrap:wrap;gap:10px}

  .htitle .t1{font-size:21px}
}
main{max-width:1180px;margin:0 auto;padding:28px 18px 56px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(0,47,85,.05)}
.cardhead{padding:14px 20px;background:#EEF2F6;border-bottom:2px solid var(--navy);font-family:Oswald;font-weight:700;font-size:19px;letter-spacing:.03em;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px 12px 0 0}
.cardhead .sub{font-family:Inter;font-size:12px;color:var(--mid);font-weight:600;letter-spacing:0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mid);padding:11px 10px;font-weight:800}
th:first-child,td:first-child{padding-left:20px}
td{padding:12px 10px;border-top:1px solid #EDF0F3;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#FFF3EC}
.b{font-weight:800}.mid{color:var(--mid)}.dim{color:#9CA3AF}
.tiny{font-size:11.5px;color:#9CA3AF;display:block;font-weight:400;margin-top:1px}
.stalef{color:var(--orange)!important;font-weight:800!important}
.pill{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.p-over{background:var(--greenbg);color:var(--greentx)}
.p-below{background:var(--redbg);color:var(--redtx)}
.p-none{background:var(--graybg);color:var(--graytx);font-weight:700}
.p-est{background:#FFF3EC;color:#9A3412;font-weight:700;font-size:10px}
.gain-up{color:var(--green);font-weight:800}.gain-dn{color:var(--red);font-weight:800}
.btn{font:inherit;border-radius:8px;padding:11px 20px;font-weight:800;font-size:14px;letter-spacing:.02em;cursor:pointer;border:1px solid transparent}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange2)}
.btn-ghost{background:#fff;border-color:#D1D5DB;color:var(--ink)}.btn-ghost:hover{background:#F3F4F6}
.btn-link{background:none;border:0;color:var(--mid);cursor:pointer;font:inherit;font-size:13px;padding:0}.btn-link:hover{color:var(--ink)}
.btn-del{background:none;border:0;color:#EF4444;font-size:12.5px;cursor:pointer;font-weight:700}.btn-del:hover{color:#B91C1C}
label.f{display:block}
label.f span.lab{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--mid);margin-bottom:6px}
input,select{font:inherit;font-size:15px;width:100%;border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;background:#fff}
input:focus,select:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:end;padding:18px 20px}
.filters label.f{min-width:140px}
.filters .count{margin-left:auto;color:var(--mid);font-size:13.5px;font-weight:600;padding-bottom:10px}
.kpicard{background:var(--navy);color:#fff;border-radius:12px;padding:18px 18px 16px;border-bottom:4px solid var(--orange)}
.kpicard .n{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#9FB3C8;font-weight:700}
.kpicard .v{font-family:Oswald;font-size:42px;font-weight:700;margin-top:4px;line-height:1}
.kpicard .v small{color:#64748B;font-size:23px}
.kpicard .pct{color:var(--orange);font-size:12.5px;font-weight:800;margin-top:6px;letter-spacing:.03em}
.kpicard .std{color:#7A93AC;font-size:11px;margin-top:5px}
.linebar{position:relative;height:11px;background:#E5E7EB;border-radius:99px;overflow:hidden;min-width:120px}
.linebar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.linebar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.banner{background:var(--navy);color:#fff;border-radius:12px;padding:26px;display:flex;gap:22px;align-items:flex-start;border-bottom:5px solid var(--orange)}
.banner img{height:92px}
.banner .eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--orange);font-weight:800}
.banner h2{font-family:Oswald;font-size:42px;margin:6px 0 0;letter-spacing:-.01em;line-height:1.02}
.banner .meta{display:flex;flex-wrap:wrap;gap:5px 24px;margin-top:14px;color:#C7D2E0;font-size:14px}
.banner .meta .dim2{color:#64748B}
.chartcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.chartcard h4{margin:0 0 6px;font-family:Oswald;font-size:17px;letter-spacing:.03em;color:var(--navy)}
.chartcard .stats{font-size:13px;float:right}
.chartcard .pts{margin-top:10px;font-size:12.5px;color:#4B5563;line-height:1.7}
.chartcard .pts .d{color:#9CA3AF}
.chartwrap{position:relative;height:210px}
.footnote{border-top:2px solid var(--border);padding-top:14px;font-size:13.5px;color:#4B5563;line-height:1.6}
.section-t{font-family:Oswald;font-size:22px;font-weight:700;letter-spacing:.02em;color:var(--navy);margin:0 0 14px}
.stack>*+*{margin-top:24px}
.note{font-size:12.5px;color:#8A94A3;margin-top:12px;line-height:1.5}
.toggle{display:inline-flex;border:1px solid #CBD5E1;border-radius:9px;padding:4px;gap:3px;font-size:12.5px;font-weight:800}
.toggle button{border:0;background:none;padding:8px 15px;border-radius:6px;cursor:pointer;color:var(--mid);font:inherit;font-weight:800}
.toggle button.on{background:var(--navy);color:#fff}
.pillars{background:#0B2035;color:var(--orange);text-align:center;font-family:Oswald,Inter,sans-serif;font-weight:700;letter-spacing:.14em;font-size:14.5px;padding:13px 12px;text-transform:uppercase}
.pillars span{white-space:nowrap;margin:0 16px;display:inline-block}
.pillars.light{background:#fff;border-top:2px solid var(--orange);border-radius:0 0 10px 10px}
.lbgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lbcol{padding:0}
.lbcol h5{margin:0;padding:11px 18px;font-family:Oswald;font-size:14px;letter-spacing:.11em;color:#fff;background:#0B3A63}
.lbcol.f h5{background:var(--orange)}
.lbrow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid #EDF0F3;cursor:pointer}
.lbrow:hover{background:#FFF3EC}
.rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:0 0 auto;color:#fff;background:#9CA3AF}
.rank.r1{background:#D4A017}.rank.r2{background:#8E9BA8}.rank.r3{background:#A4713C}
.lbname{font-weight:800;flex:1;font-size:15px}
.lbname small{display:block;font-weight:500;color:var(--mid);font-size:11.5px;margin-top:2px}
.lbval{font-weight:900;font-family:Oswald;font-size:23px;text-align:right;line-height:1.05}
.lbval small{display:block;font-family:Inter;font-weight:600;font-size:11px;color:var(--mid);margin-top:2px}
.lbempty{padding:14px;color:#9CA3AF;font-size:12.5px;border-top:1px solid #F1F2F4}
.picklist{max-height:300px;overflow-y:auto;border:1px solid #D1D5DB;border-radius:8px;padding:6px;background:#fff}
.picklist label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.picklist label:hover{background:#F3F4F6}
.picklist input{width:auto}
.sendcard{background:var(--navy);border-radius:12px;overflow:hidden}

.mdl-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}

.warn{background:#FFF7ED;border:1px solid #FDBA74;border-left:5px solid var(--orange);border-radius:10px;padding:14px 18px;font-size:13.5px;line-height:1.55}
.alert{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px}
/* chips (multi-select) */
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:210px;overflow-y:auto;border:1px solid #CBD5E1;border-radius:10px;padding:12px;background:#fff}
.chip{border:1px solid #CBD5E1;background:#fff;border-radius:99px;padding:9px 16px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:#374151}

.chipnote{font-size:11px;color:var(--mid);margin-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{background:#E8EDF3;color:var(--navy);border-radius:6px;padding:5px 9px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
/* kiosk */
.kiosk{min-height:100vh;background:var(--navy);color:#fff;padding:22px 16px}
.kiosk .top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 22px;width:100%}
.kiosk .inner{max-width:680px;margin:0 auto;width:100%}
.kiosk .wide{max-width:1000px;margin:0 auto;width:100%}
.kiosk h2{font-family:Oswald;font-size:36px;margin:0 0 18px;letter-spacing:-.01em}
.kbig{display:block;width:100%;border:0;border-radius:12px;padding:22px;font:inherit;font-weight:900;font-size:19px;letter-spacing:.03em;cursor:pointer;margin-bottom:14px}
.kbig.orange{background:var(--orange);color:#fff}.kbig.orange:hover{background:var(--orange2)}
.kbig.white{background:#fff;color:var(--navy)}.kbig.white:hover{background:#E5E7EB}
.kbig.dark{background:#0B3A63;color:#fff;font-weight:700;font-size:15px}.kbig.dark:hover{background:#12507F}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.searchrow input{flex:2;min-width:200px;font-size:16px;padding:14px}
.searchrow select{flex:1;min-width:150px;font-size:15px;padding:14px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:400px;overflow-y:auto}
.namegrid button{background:#0B3A63;border:0;color:#fff;font:inherit;font-weight:700;font-size:15px;text-align:left;padding:15px 14px;border-radius:9px;cursor:pointer}
.namegrid button:hover{background:#12507F}
.namegrid button .sub{display:block;font-weight:400;font-size:12px;color:#9FB3C8;margin-top:3px}
.kioskcard{background:#fff;color:var(--ink);border-radius:16px;padding:28px}
.kioskcard h2{color:var(--ink)}
.exitlink{background:none;border:0;color:#7A93AC;font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline}
.center{text-align:center}
.loading{display:flex;min-height:60vh;align-items:center;justify-content:center;color:var(--mid)}
.liftrow{border:1px solid var(--border);border-radius:10px;padding:14px;background:#fff}
.liftrow .nm{font-weight:800;font-size:14px;margin-bottom:8px}
.liftrow .inrow{display:flex;gap:8px;align-items:center}
.liftrow .inrow input{flex:1.3}
.liftrow .inrow select{flex:1}
.est{font-size:12.5px;font-weight:800;color:var(--navy);margin-top:8px;min-height:18px}
.est .o{color:var(--orange)}
.dupbox{background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:14px;margin-bottom:14px}
.dupbox b{display:block;margin-bottom:6px}
.dupbox button{margin:4px 6px 0 0}
@media print{
  .print-hide,header.app,.kiosk .top{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card,.chartcard,.banner{border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  body.compact .charts-section{display:none!important}
  body.compact table{font-size:12px}
  .footnote{font-size:10pt;color:#374151}
  .kiosk{background:#fff;color:var(--ink);padding:0}
  @page{margin:.6in}
}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.banner{flex-direction:column}.banner h2{font-size:26px}}
</style>
</head>

/* Brzycki estimated 1RM: w * 36 / (37 - reps). reps 1 returns the lifted weight. */
const est1RM = (w,r) => { r=+r||1; if(r<=1) return +w; return Math.round(+w*36/(37-Math.min(r,5))*10)/10; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
/* v20: local date, not UTC — after 7pm Central the old version stamped tomorrow's date. */
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const today = () => isoOf(new Date());
const daysAgoISO = n => { const d=new Date(); d.setDate(d.getDate()-n); return isoOf(d); };
const mondayISO = () => { const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return isoOf(d); };
/* v20: dates are stored YYYY-MM-DD (keeps sorting correct) but shown month-day-year. */
const fmtDate = (iso,full) => { const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return String(iso||""); return `${m[2]}/${m[3]}/${full?m[1]:m[1].slice(2)}`; };
/* v27: whole days between a stored test date and today (local calendar days) */
const daysSince = iso => { const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m) return null;
  const t=new Date(); const a=new Date(+m[1],+m[2]-1,+m[3]); const b=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  return Math.round((b-a)/86400000); };
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const listOf = v => (v||"").split(",").map(x=>x.trim()).filter(Boolean);
const inToFtIn = n => { n=+n||0; return {ft:Math.floor(n/12), inch:Math.round(n%12)}; };
const fmtHeight = n => { if(!n) return ""; const h=inToFtIn(n); return `${h.ft}'${h.inch}"`; };
const fmtNum = v => { const n=Math.round(v*10)/10; return (n===Math.trunc(n)?Math.trunc(n):n).toString(); };

/* v19: Supabase returns at most 1000 rows per request. Page through so no rows are silently dropped. */
/* v24: the old loop stopped when a page came back short of 1000. If the project's
   "Max rows" setting is lower than 1000, page 1 is "short" and everything after it
   was silently dropped. Now it asks for the exact total and keeps going until it has it. */
async function fetchAll(table){
  const out=[]; let total=null;
  for(let guard=0; guard<500; guard++){
    const from=out.length;
    const { data, error, count } = await supa.from(table).select("*",{count:"exact"}).order("id").range(from, from+999);
    if(error) return { data:null, error };
    if(total==null) total=count;
    out.push(...data);
    if(!data.length || (total!=null && out.length>=total)) break;
  }
  if(total!=null && out.length<total) console.warn(`${table}: loaded ${out.length} of ${total} rows`);
  return { data:out, error:null };
}

      if (!row("periods")) await supa.from("settings").upsert({key:"periods",value:JSON.stringify(S.periods)});
      if (!row("sports"))  await supa.from("settings").upsert({key:"sports", value:JSON.stringify(S.sports)});
      S.gradYears = row("gradyears") ? JSON.parse(row("gradyears").value) : DEFAULT_GRADYEARS.slice();
      if (!row("gradyears")) await supa.from("settings").upsert({key:"gradyears",value:JSON.stringify(S.gradYears)});
      S.term = row("term") ? JSON.parse(row("term").value) : DEFAULT_TERM;
      if (!row("term")) await supa.from("settings").upsert({key:"term",value:JSON.stringify(S.term)});
      /* v27: stale threshold — only written when a coach changes it */
      { let v=DEFAULT_STALE; try{ if(row("stale_days")) v=+JSON.parse(row("stale_days").value); }catch(err){}
        S.staleDays = STALE_OPTIONS.includes(v) ? v : DEFAULT_STALE; }
      /* v31: saved test events for the Test Report tab */
      try{ S.testEvents = row("test_events") ? JSON.parse(row("test_events").value) : []; }catch(err){ S.testEvents=[]; }
    } else {
      S.athletes=JSON.parse(localStorage.getItem("nn-athletes")||"[]");
      S.tests=JSON.parse(localStorage.getItem("nn-tests")||"[]");
      S.exercises=JSON.parse(localStorage.getItem("nn-exercises")||"null")||DEFAULT_EXERCISES.slice();
      S.periods=JSON.parse(localStorage.getItem("nn-periods")||"null")||DEFAULT_PERIODS.slice();
      S.sports=JSON.parse(localStorage.getItem("nn-sports")||"null")||DEFAULT_SPORTS.slice();
      S.gradYears=JSON.parse(localStorage.getItem("nn-gradyears")||"null")||DEFAULT_GRADYEARS.slice();
      S.term=JSON.parse(localStorage.getItem("nn-term")||"null")||DEFAULT_TERM;
      { const v=+JSON.parse(localStorage.getItem("nn-stale")||"null"); S.staleDays=STALE_OPTIONS.includes(v)?v:DEFAULT_STALE; }
      try{ S.testEvents=JSON.parse(localStorage.getItem("nn-test-events")||"[]"); }catch(err){ S.testEvents=[]; }
    }
    S.lastSync = new Date();
  },
  localSave(){
    if (useSupa) return;
    localStorage.setItem("nn-athletes",JSON.stringify(S.athletes));
    localStorage.setItem("nn-tests",JSON.stringify(S.tests));
    localStorage.setItem("nn-exercises",JSON.stringify(S.exercises));
    localStorage.setItem("nn-periods",JSON.stringify(S.periods));
    localStorage.setItem("nn-sports",JSON.stringify(S.sports));
    localStorage.setItem("nn-gradyears",JSON.stringify(S.gradYears));
    localStorage.setItem("nn-term",JSON.stringify(S.term));
    localStorage.setItem("nn-stale",JSON.stringify(S.staleDays));
  },
  async upsertAthletes(arr){ if(!arr.length)return; if(useSupa){const{error}=await supa.from("athletes").upsert(arr);if(error)throw error;} this.localSave(); },
  async upsertAthlete(a){ if(useSupa){const{error}=await supa.from("athletes").upsert(a);if(error)throw error;} this.localSave(); },
  async deleteAthlete(id){
    if(useSupa){
      const t=await supa.from("tests").delete().eq("athlete_id",id).select("id");
      if(t.error) throw t.error;
      const a=await supa.from("athletes").delete().eq("id",id).select("id");
      if(a.error) throw a.error;
      /* Supabase returns NO error when a policy blocks a delete — it just removes 0 rows. */
      if(!a.data || !a.data.length) throw new Error("BLOCKED: the database removed 0 rows. The DELETE policy on 'athletes' is missing. Run the permissions fix in Setup → Check database permissions.");
    }
    this.localSave();
  },
  async insertTests(rows){ if(useSupa){
      const strip=r=>{const {bw,...x}=r; return x;};
      let res=await supa.from("tests").insert(S.bwCol?rows:rows.map(strip)).select("id");
      /* v28: if the bw column hasn't been added yet, save without it rather than lose the athlete's numbers */
      if(res.error && S.bwCol && /bw/i.test(res.error.message||"")){ S.bwCol=false; res=await supa.from("tests").insert(rows.map(strip)).select("id"); }
      const {data,error}=res; if(error)throw error;if(!data||data.length!==rows.length)throw new Error(`BLOCKED: the database accepted ${data?data.length:0} of ${rows.length} rows. Check the INSERT policy on 'tests'.`);} this.localSave(); },
  async deleteTest(id){
    if(useSupa){
      const { data, error } = await supa.from("tests").delete().eq("id",id).select("id");
      if(error) throw error;
      if(!data || !data.length) throw new Error("BLOCKED: the database removed 0 rows. The DELETE policy on 'tests' is missing.");
    }
    this.localSave();
  },
  async upsertExercise(e){ if(useSupa){const{error}=await supa.from("exercises").upsert(e);if(error)throw error;} this.localSave(); },
  async deleteExercise(id){
    if(useSupa){
      const { data, error } = await supa.from("exercises").delete().eq("id",id).select("id");
      if(error) throw error;
      if(!data || !data.length) throw new Error("BLOCKED: the database removed 0 rows. The DELETE policy on 'exercises' is missing.");
    }
    this.localSave();
  },
  async saveList(key,arr){
    if(useSupa){
      const payload={key,value:JSON.stringify(arr)};
      let { error } = await supa.from("settings").upsert(payload,{onConflict:"key"});
      if(error){
        /* Older projects may not have the settings row yet — try a plain insert. */
        const ins = await supa.from("settings").insert(payload);
        if(ins.error) throw new Error(`Couldn't save the ${key} list. ${error.message}`);
      }
      /* Read it back so a silent failure can't look like success. */
      const check = await supa.from("settings").select("value").eq("key",key).maybeSingle();
      if(check.error) throw new Error(`Saved, but couldn't verify the ${key} list: ${check.error.message}`);
      if(!check.data) throw new Error(`The ${key} list didn't save. Your Supabase 'settings' table may be missing or blocked by its policies — re-run setup.sql.`);
      if(check.data.value!==payload.value) throw new Error(`The ${key} list didn't update in the database. Check the settings table policies in Supabase.`);
    }
    this.localSave();
  },
  /* Pull fresh rows without disturbing anything the user is typing. */
  async sync(){
    if (!useSupa || S.syncing) return;
    S.syncing = true;
    try{
      const [a,t] = await Promise.all([fetchAll("athletes"), fetchAll("tests")]);
      if (!a.error && !t.error){
        const changed = a.data.length!==S.athletes.length || t.data.length!==S.tests.length;
        S.athletes=a.data; S.tests=t.data; S.lastSync=new Date();
        if (changed && !inForm()) render(); else updateSyncLabel();
      }
    }catch(e){ console.warn("sync failed",e); }
    S.syncing=false;
  }
};
function dbFail(e){ console.error(e); say("Save failed — the change may not have reached the database.\n\n"+(e.message||e)+"\n\nIf deletes keep failing, your Supabase delete policies are likely missing (re-run setup.sql)."); }
function updateSyncLabel(){

/* ---------------- derived ---------------- */
const testsFor=(aid,exid)=>S.tests.filter(t=>t.athlete_id===aid&&t.ex_id===exid);
/* v24: same-date ties broken by entry order (ids are time-based), so a second entry on the same day becomes "Current" instead of being hidden. */
const tOrder=(x,y)=>String(x.date).localeCompare(String(y.date))||String(x.id).localeCompare(String(y.id));
/* v26: a test day counts its BEST attempt, not whichever was typed last.
   Two jumps or a 3-rep set then a single on the same day -> the better one is that day's number. */
const bestOfDay=(aid,exid,pickDate)=>{const r=testsFor(aid,exid);if(!r.length)return null;
  const d=r.map(t=>String(t.date)).reduce((x,y)=>pickDate(y,x)?y:x);
  const ex=S.exercises.find(e=>e.id===exid);
  return r.filter(t=>String(t.date)===d).reduce((a,b)=>better(ex,b.value,a.value)||(+b.value===+a.value&&tOrder(b,a)>0)?b:a);};
const latestT=(aid,exid)=>bestOfDay(aid,exid,(y,x)=>y>x);
const firstT =(aid,exid)=>bestOfDay(aid,exid,(y,x)=>y<x);
/* v20: timed tests (sec) are lower-is-better. ×BW only applies to weight lifted (lb/kg). */
const lowerBetter = ex => !!ex && ex.unit==="sec";
const isRatio = ex => !!ex && ex.kpi_type==="ratio" && (ex.unit==="lb"||ex.unit==="kg");
const better = (ex,x,y) => lowerBetter(ex) ? +x < +y : +x > +y;
const bestT  =(aid,exid)=>{const r=testsFor(aid,exid);if(!r.length)return null;const ex=S.exercises.find(e=>e.id===exid);return r.reduce((a,b)=>better(ex,b.value,a.value)?b:a);};

/* ---------------- v27: test-date window ---------------- */
const winActive = () => !!(S.f.from || S.f.to);
const inWin = t => { const d=String(t.date); return (!S.f.from || d>=S.f.from) && (!S.f.to || d<=S.f.to); };
/* Best entry inside the window (ties -> later entry). */
const bestInWin=(aid,exid)=>{const r=testsFor(aid,exid).filter(inWin);if(!r.length)return null;
  const ex=S.exercises.find(e=>e.id===exid);
  return r.reduce((a,b)=>better(ex,b.value,a.value)||(+b.value===+a.value&&tOrder(b,a)>0)?b:a);};
/* What the Board shows: best in window when one is set, otherwise the latest test day. */
const pickT=(aid,exid)=>winActive()?bestInWin(aid,exid):latestT(aid,exid);
/* Most recent test date for an athlete — one lift, or any lift when exid is omitted. */
const lastDate=(aid,exid)=>{const r=S.tests.filter(t=>t.athlete_id===aid&&(!exid||t.ex_id===exid));
  return r.length?r.map(t=>String(t.date)).reduce((x,y)=>y>x?y:x):null;};
const testedInWin=(aid,exid)=>S.tests.some(t=>t.athlete_id===aid&&(!exid||t.ex_id===exid)&&inWin(t));
const isStale = iso => { const n=daysSince(iso); return n!=null && n>S.staleDays; };
const dateSpan = (iso,pre) => `<span class="${isStale(iso)?"stalef":""}">${pre||""}${fmtDate(iso)}</span>`;
const rangeTxt = () => S.f.from&&S.f.to ? (S.f.from===S.f.to?fmtDate(S.f.from,true):`${fmtDate(S.f.from,true)} – ${fmtDate(S.f.to,true)}`)
  : S.f.from ? `since ${fmtDate(S.f.from,true)}` : S.f.to ? `through ${fmtDate(S.f.to,true)}` : "all time";
const byName=(a,b)=>(a.last_name||"").localeCompare(b.last_name||"")||(a.first_name||"").localeCompare(b.first_name||"");

const kpiFor=(ex,a)=>{const raw=a.gender==="Female"?ex.kpi_f:ex.kpi_m;return raw==null||raw===""?null:+raw;};
function evalKPI(ex,a,v){
  if(v==null)return null;
  const k=kpiFor(ex,a),bw=+a.weight;
  if(isRatio(ex)){
    const ratio=bw>0?v/bw:null;
    if(k==null)return{ratio,target:null,pass:null};
    return{ratio,target:k*bw,pass:ratio!=null?ratio>=k:null};
  }
  if(k==null)return{ratio:null,target:null,pass:null};
  return{ratio:null,target:k,pass:lowerBetter(ex)?v<=k:v>=k};
}
/* v20: "ft-in" unit — athletes enter feet + inches, stored as total inches so sorting, grading and old data all still work. */
const isFtIn = ex => !!ex && ex.unit==="ft-in";
const usesReps = ex => !!ex && ex.reps_ok && !isFtIn(ex);
const fmtFtIn = v => { let n=+v; const neg=n<0; n=Math.abs(n); let f=Math.floor(n/12), i=Math.round((n-f*12)*2)/2; if(i>=12){f++;i=0;} return `${neg?"-":""}${f}'${fmtNum(i)}"`; };
const vTxt = (ex,v) => isFtIn(ex) ? fmtFtIn(v) : fmtNum(v);                 /* number only */
const vU   = (ex,v) => isFtIn(ex) ? fmtFtIn(v) : `${fmtNum(v)} ${ex.unit}`;  /* number + unit */
const gTxt = (ex,g) => isFtIn(ex) ? `${fmtNum(g)}"` : fmtNum(g);            /* gains stay in inches: +5" */
const unitLbl = ex => isFtIn(ex) ? "ft-in" : ex.unit;
const stdTxt=(ex,k)=>k==null?"—":isRatio(ex)?`${k}×BW`:vU(ex,k);
const confirmed = a => String(a.confirmed_term||"") === String(S.term);
const pillHTML=p=>p===true?'<span class="pill p-over">OVER THE LINE</span>':p===false?'<span class="pill p-below">BELOW</span>':'<span class="pill p-none">no standard</span>';
/* v23: "the line" in the athlete's own units, and how far over / how much to go */
const lineTarget=(ex,a)=>{const k=kpiFor(ex,a); if(k==null) return null;
  if(isRatio(ex)){ const bw=+a.weight; return bw>0?k*bw:null; } return k; };
const lineTxt=(ex,a)=>{const t=lineTarget(ex,a); return t==null?null:vU(ex,t);};
const gapTo=(ex,a,v)=>{const t=lineTarget(ex,a); if(t==null||v==null) return null;
  return Math.round((lowerBetter(ex)? t-(+v) : (+v)-t)*10)/10; };   /* + = over the line */
const gapTxt=(ex,g)=>{ if(g==null) return "NO STANDARD"; if(g===0) return "ON THE LINE";
  const amt=isFtIn(ex)?gTxt(ex,Math.abs(g)):`${fmtNum(Math.abs(g))} ${ex.unit}`;
  return g>0?`+${amt} OVER`:`${amt} TO GO`; };
const gapPillHTML=(ex,g)=>`<span class="pill ${g==null?'p-none':g>=0?'p-over':'p-below'}">${gapTxt(ex,g)}</span>`;
/* "365×3" note when the number came from a multi-rep set */
const repNote=t=>(t&&+t.reps>1)?`${fmtNum(t.weight)}×${t.reps}`:"";


/* ---------------- backup: export / import ---------------- */
function csvCell(v){
  if(v==null) return "";
  const t=String(v);
  return /[",\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function toCSV(rows, cols){
  return [cols.join(",")].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(","))).join("\n");
}
function downloadBlob(name, text, type){
  const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(u); },400);
}
const ATH_COLS=["id","first_name","last_name","gender","height","weight","periods","sports","grad_year","confirmed_term","created_at"];
const TEST_COLS=["id","athlete_id","ex_id","weight","reps","value","date","bw"];

/* Split a CSV line, respecting quoted fields. */
function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    } else if(ch==='"') q=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c!=="")).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=r[i]!==undefined?r[i]:""); return o;
  });
}


/* ---------------- dialogs that work inside an iframe ----------------
   Chrome blocks window.confirm/alert in embedded frames (Google Sites),
   so they silently return without showing anything. These replace them. */
function ensureModalRoot(){
  let el=document.getElementById("nn-modal");
  if(!el){ el=document.createElement("div"); el.id="nn-modal"; document.body.appendChild(el); }
  return el;
}
function ask(message, opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const root=ensureModalRoot();
    root.innerHTML=`
      <div class="mdl-back">
        <div class="mdl">
          <div class="mdl-h">${esc(opts.title||"Please confirm")}</div>
          <div class="mdl-b">${esc(message).replace(/\n/g,"<br>")}</div>
          <div class="mdl-f">
            <button class="btn btn-ghost" id="mdl-no">${esc(opts.cancel||"Cancel")}</button>
            <button class="btn ${opts.danger?"btn-danger":"btn-navy"}" id="mdl-yes">${esc(opts.ok||"Yes, continue")}</button>
          </div>
        </div>
      </div>`;
    const done=v=>{ root.innerHTML=""; resolve(v); };
    document.getElementById("mdl-yes").onclick=()=>done(true);
    document.getElementById("mdl-no").onclick=()=>done(false);
    root.querySelector(".mdl-back").onclick=e=>{ if(e.target===root.querySelector(".mdl-back")) done(false); };
    setTimeout(()=>{ const b=document.getElementById("mdl-yes"); if(b)b.focus(); },30);
  });
}
function say(message, title){
  return new Promise(resolve=>{
    const root=ensureModalRoot();
    root.innerHTML=`
      <div class="mdl-back">
        <div class="mdl">
          <div class="mdl-h">${esc(title||"Heads up")}</div>
          <div class="mdl-b">${esc(message).replace(/\n/g,"<br>")}</div>
          <div class="mdl-f"><button class="btn btn-navy" id="mdl-ok">OK</button></div>
        </div>
      </div>`;
    const done=()=>{ root.innerHTML=""; resolve(true); };
    document.getElementById("mdl-ok").onclick=done;
    setTimeout(()=>{ const b=document.getElementById("mdl-ok"); if(b)b.focus(); },30);
  });
}

  if(idleTimer) clearTimeout(idleTimer);

    if(S.view!=="kiosk"||S.kiosk.stage==="pick") return;
    /* v24: never wipe numbers that are typed but not submitted — athletes enter a lift, go test the next one, then come back. */

    ${tables||(S.athletes.length?"":`<div class="card" style="padding:24px;color:var(--mid)">No athletes yet. Hit <b>Launch Kiosk</b> and have your first athlete build a profile.</div>`)}

/* ---------------- leaderboard ---------------- */
/* Each athlete's BEST qualifying entry for the lift. "source" lets you
   exclude rep-estimated numbers so a true single isn't beaten by a formula. */
function lbEntries(ex, gender){
  const pool=S.athletes.filter(a=>{
    if(a.gender!==gender)return false;
    if(S.lb.period!=="All"){
      if(S.lb.period===UNASSIGNED){ if(listOf(a.periods).length)return false; }
      else if(!listOf(a.periods).includes(S.lb.period))return false;
    }
    if(S.lb.sport!=="All"&&!listOf(a.sports).includes(S.lb.sport))return false;
    return true;
  });
  const rows=[];
  pool.forEach(a=>{
    let ts=testsFor(a.id,ex.id);
    if(S.lb.source==="true") ts=ts.filter(t=>+t.reps<=1);
    if(!ts.length)return;
    const best=ts.reduce((x,y)=>better(ex,y.value,x.value)?y:x);
    const useRel = S.lb.metric==="relative" && isRatio(ex) && +a.weight>0;
    const metric = useRel ? (+best.value/+a.weight) : +best.value;
    rows.push({a,t:best,metric,useRel});
  });
  return rows.sort((x,y)=>lowerBetter(ex)?x.metric-y.metric:y.metric-x.metric).slice(0,3);
}
function lbColumn(ex,gender){
  const rows=lbEntries(ex,gender);
  const body=rows.length?rows.map((r,i)=>`
    <div class="lbrow" onclick="A.openReport('${r.a.id}')">
      <div class="rank r${i+1}">${i+1}</div>
      <div class="lbname">${esc(r.a.last_name)}, ${esc(r.a.first_name)}
        <small>${r.a.weight} lb${r.a.grad_year?` · '${String(r.a.grad_year).slice(2)}`:""}${repNote(r.t)?` · ${repNote(r.t)} est.`:" · true 1RM"}</small></div>
      <div class="lbval">${r.useRel?r.metric.toFixed(2)+"×":vTxt(ex,r.metric)}
        <small>${r.useRel?`${fmtNum(r.t.value)} ${ex.unit}`:(isRatio(ex)&&+r.a.weight>0?`${(+r.t.value/+r.a.weight).toFixed(2)}× BW`:isFtIn(ex)?`${fmtNum(r.metric)} in`:ex.unit)}</small></div>
    </div>`).join(""):`<div class="lbempty">No qualifying entries yet.</div>`;
  return `<div class="lbcol ${gender==="Female"?"f":""}"><h5>${gender==="Female"?"GIRLS":"BOYS"} — TOP 3</h5>${body}</div>`;
}

/* ---------------- v28: compare a group across two date ranges ----------------
   Only athletes who tested a lift in BOTH ranges count toward that lift's team
   numbers, so kids who skipped one test can't make the team look better or worse. */
const cmpDefaults=()=>({period:"All",sport:"All",gender:"All",ex:"All",
  aFrom:daysAgoISO(59),aTo:daysAgoISO(30),bFrom:daysAgoISO(29),bTo:today(),
  rank:"raw"});  /* v29: "raw" = lb/in gained, "pct" = % gained */
const inRange=(t,f,to)=>{const d=String(t.date);return (!f||d>=f)&&(!to||d<=to);};
const bestIn=(aid,ex,f,to)=>{const r=testsFor(aid,ex.id).filter(t=>inRange(t,f,to));if(!r.length)return null;
  return r.reduce((a,b)=>better(ex,b.value,a.value)||(+b.value===+a.value&&tOrder(b,a)>0)?b:a);};
/* Body weight on the day of the test; older entries (before v28) fall back to current weight. */
const bwAt=(t,a)=>{const v=+t.bw;return v>0?{v,approx:false}:{v:+a.weight,approx:true};};
const rngTxt=(f,to,full)=>f&&to?(f===to?fmtDate(f,full):`${fmtDate(f,full)} – ${fmtDate(to,full)}`):f?`since ${fmtDate(f,full)}`:to?`through ${fmtDate(to,full)}`:"all time";
const signedV=(ex,v)=>{const n=Math.round(v*10)/10; const s=n>0?"+":n<0?"-":"";
  return isFtIn(ex)?`${s}${fmtNum(Math.abs(n))}"`:`${s}${fmtNum(Math.abs(n))} ${ex.unit}`;};
const cmpGroupLabel=()=>{const c=S.cmp;const g=[c.period,c.sport,c.gender].filter(x=>x!=="All");return g.length?g.join(" · "):"All athletes";};
function cmpPool(){
  const c=S.cmp;
  return S.athletes.filter(a=>(c.gender==="All"||a.gender===c.gender)
    &&(c.period==="All"||(c.period===UNASSIGNED?!listOf(a.periods).length:listOf(a.periods).includes(c.period)))
    &&(c.sport==="All"||listOf(a.sports).includes(c.sport)));
}
function cmpLift(ex,pool){
  const c=S.cmp, rows=[]; let onlyA=0, onlyB=0;
  const rel=isRatio(ex), lb=lowerBetter(ex);
  pool.forEach(a=>{
    const ta=bestIn(a.id,ex,c.aFrom,c.aTo), tb=bestIn(a.id,ex,c.bFrom,c.bTo);
    if(ta&&tb){
      const A=+ta.value, B=+tb.value, d=Math.round((B-A)*10)/10, imp=lb?-d:d;
      const pct=A>0?imp/A*100:null;                         /* + = improved */
      const ba=bwAt(ta,a), bb=bwAt(tb,a), k=kpiFor(ex,a);
      const relA=rel&&ba.v>0?A/ba.v:null, relB=rel&&bb.v>0?B/bb.v:null;
      const tgt=bw=>k==null?null:rel?(bw>0?k*bw:null):k;
      const over=(v,t)=>t==null?null:(lb?v<=t:v>=t);
      rows.push({a,ta,tb,A,B,d,imp,pct,relA,relB,overA:over(A,tgt(ba.v)),overB:over(B,tgt(bb.v)),approx:rel&&(ba.approx||bb.approx)});
    } else if(ta) onlyA++; else if(tb) onlyB++;
  });
  const key=x=>S.cmp.rank==="pct"?(x.pct==null?-1e9:x.pct):x.imp;
  rows.sort((x,y)=>key(y)-key(x)||y.imp-x.imp||byName(x.a,y.a));
  const avg=f=>{const v=rows.map(f).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
  const ws=rows.filter(r=>r.overA!=null&&r.overB!=null);
  return {ex,rows,n:rows.length,onlyA,onlyB,avgA:avg(r=>r.A),avgB:avg(r=>r.B),avgD:avg(r=>r.d),avgImp:avg(r=>r.imp),avgPct:avg(r=>r.pct),
    improved:rows.filter(r=>r.imp>0).length,relA:avg(r=>r.relA),relB:avg(r=>r.relB),
    std:ws.length,overA:ws.filter(r=>r.overA).length,overB:ws.filter(r=>r.overB).length,
    newOver:ws.filter(r=>!r.overA&&r.overB).length,approx:rows.some(r=>r.approx)};
}
const cmpResults=()=>{const pool=cmpPool();const lifts=S.cmp.ex==="All"?S.exercises:S.exercises.filter(e=>e.id===S.cmp.ex);
  return {pool,R:lifts.map(ex=>cmpLift(ex,pool))};};
const ovPill=x=>x==null?'<span class="dim">—</span>':x?'<span class="pill p-over" style="font-size:9.5px;padding:3px 7px">OVER</span>':'<span class="pill p-below" style="font-size:9.5px;padding:3px 7px">BELOW</span>';
function compareHTML(){
  if(!S.cmp) S.cmp=cmpDefaults();
  const c=S.cmp, {pool,R}=cmpResults();
  const opts=(arr,cur,extra)=>["All",...(extra||[]),...arr].map(x=>`<option ${cur===x?"selected":""}>${esc(x)}</option>`).join("");
  const dIn=k=>`<input type="date" value="${esc(c[k])}" max="${today()}" onchange="A.setCmp('${k}',this.value)">`;
  const badA=c.aFrom&&c.aTo&&c.aFrom>c.aTo, badB=c.bFrom&&c.bTo&&c.bFrom>c.bTo;
  const overlap=!badA&&!badB&&c.aFrom&&c.aTo&&c.bFrom&&c.bTo&&c.aFrom<=c.bTo&&c.bFrom<=c.aTo;
  const filters=`<div class="card filters">
      <label class="f"><span class="lab">Class period</span><select onchange="A.setCmp('period',this.value)">${opts(S.periods,c.period,[UNASSIGNED])}</select></label>
      <label class="f"><span class="lab">Sport</span><select onchange="A.setCmp('sport',this.value)">${opts(S.sports,c.sport)}</select></label>
      <label class="f"><span class="lab">Gender</span><select onchange="A.setCmp('gender',this.value)"><option ${c.gender==="All"?"selected":""}>All</option><option ${c.gender==="Male"?"selected":""}>Male</option><option ${c.gender==="Female"?"selected":""}>Female</option></select></label>
      <label class="f"><span class="lab">Exercise</span><select onchange="A.setCmp('ex',this.value)"><option value="All">All</option>${S.exercises.map(e=>`<option value="${e.id}" ${c.ex===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select></label>
      <label class="f" style="min-width:320px"><span class="lab">Range A — before</span><div style="display:flex;gap:6px;align-items:center">${dIn("aFrom")}<span class="mid">to</span>${dIn("aTo")}</div></label>
      <label class="f" style="min-width:320px"><span class="lab">Range B — after</span><div style="display:flex;gap:6px;align-items:center">${dIn("bFrom")}<span class="mid">to</span>${dIn("bTo")}</div></label>
      <div class="count">${pool.length} athletes in ${esc(cmpGroupLabel())}</div>
      <button class="btn btn-orange print-hide" style="align-self:flex-end;margin-bottom:6px" onclick="A.comparePDF()">DOWNLOAD COMPARISON PDF</button>
    </div>`;
  const warns=[
    badA||badB?`<div class="alert"><b>${badA?"Range A":"Range B"} has "from" after "to".</b> Swap the dates.</div>`:"",
    overlap?`<div class="warn">The two ranges overlap. A test inside the overlap can count for both A and B, which hides real change. Pick ranges that don't overlap.</div>`:"",
    S.bwCol?"":`<div class="warn"><b>Body weight isn't being saved with each test yet.</b> Relative strength below uses each athlete's <i>current</i> weight. One-time fix — Supabase → SQL editor → run:<br><code style="font-size:12.5px">alter table tests add column if not exists bw numeric;</code><br>Then reload this page. Nothing existing is changed.</div>`
  ].join("");
  const live=R.filter(r=>r.n);
  if(!live.length) return `<div class="stack">${filters}${warns}<div class="card" style="padding:24px;color:var(--mid)">No athlete in <b>${esc(cmpGroupLabel())}</b> tested the same lift in both Range A (${esc(rngTxt(c.aFrom,c.aTo,true))}) and Range B (${esc(rngTxt(c.bFrom,c.bTo,true))}). Widen a range or change the group.</div></div>`;

  const cards=live.map(r=>{const ex=r.ex, pct=Math.round(r.improved/r.n*100);
    return `<div class="kpicard"><div class="n">${esc(ex.name)}</div>
      <div class="v" style="font-size:36px">${signedV(ex,r.avgD)}</div>
      <div class="pct">${r.improved}/${r.n} improved (${pct}%)${r.avgPct!=null?` · ${r.avgPct>=0?"+":""}${r.avgPct.toFixed(1)}% avg`:""}</div>
      <div class="std">avg ${vTxt(ex,r.avgA)} → ${vTxt(ex,r.avgB)}${r.std?` · over the line ${r.overA} → ${r.overB}`:""}</div></div>`;}).join("");

/* ---------------- roster ---------------- */
function rosterMatches(){
  const q=S.roster.q.trim().toLowerCase();
  let out=S.athletes.filter(a=>{
    if(S.roster.gender!=="All"&&a.gender!==S.roster.gender)return false;
    if(S.roster.period!=="All"){
      if(S.roster.period===UNASSIGNED){ if(listOf(a.periods).length)return false; }
      else if(!listOf(a.periods).includes(S.roster.period))return false;
    }
    if(S.roster.sport!=="All"&&!listOf(a.sports).includes(S.roster.sport))return false;
    if(S.roster.confirm==="Confirmed"&&!confirmed(a))return false;
    if(S.roster.confirm==="Not confirmed"&&confirmed(a))return false;
    if(S.roster.tested==="Yes"&&!testedInWin(a.id))return false;
    if(S.roster.tested==="No"&&testedInWin(a.id))return false;
    if(q&&!(a.last_name.toLowerCase().includes(q)||a.first_name.toLowerCase().includes(q)))return false;
    return true;
  });
  const cnt=a=>S.tests.filter(t=>t.athlete_id===a.id&&inWin(t)).length;
  const S_=S.roster.sort;
  out.sort((a,b)=>
    S_==="weight"? (+b.weight)-(+a.weight) :
    S_==="tests" ? cnt(b)-cnt(a) :
    S_==="untested"? cnt(a)-cnt(b) :
    S_==="last"? String(lastDate(a.id)||"").localeCompare(String(lastDate(b.id)||"")) :
    a.last_name.localeCompare(b.last_name));
  return out;
}

/* Nothing shows until they type 2+ letters or pick a group.
   A wall of 500 names is unusable and is itself a small privacy leak. */
function matchAthletes(){
  const q=S.kiosk.search.trim().toLowerCase(), g=S.kiosk.group;
  if(q.length<2 && g==="All") return null;   // null = show the prompt, not an empty list
  const out=S.athletes.filter(a=>{
    if(g!=="All"&&!listOf(a.periods).includes(g)&&!listOf(a.sports).includes(g))return false;
    if(q.length<2)return true;
    return a.last_name.toLowerCase().startsWith(q)||a.first_name.toLowerCase().startsWith(q)
      ||`${a.first_name} ${a.last_name}`.toLowerCase().includes(q);
  }).sort((a,b)=>a.last_name.localeCompare(b.last_name));
  return out;
}

  }
  else if(k.stage==="edit"&&me){
    body=`<div class="inner"><div class="kioskcard"><h2>Update profile</h2>${profileFormHTML(me,`A.kSaveProfile('${me.id}')`,"A.kStage('home')")}</div></div>`;

      const last=latestT(me.id,ex.id);

        <input type="number" inputmode="decimal" min="0" max="11.5" step="0.5" id="ti-${ex.id}" placeholder="in" oninput="A.ftInSync('${ex.id}')"><span class="mid" style="font-weight:800">in</span>
        <input type="hidden" id="te-${ex.id}"></div>
        <div class="est" id="tv-${ex.id}"></div></div>`;
      const repSel=ex.reps_ok?`<select id="tr-${ex.id}" onchange="A.calcEst('${ex.id}')">${[1,2,3,4,5].map(r=>`<option value="${r}">${r} rep${r>1?"s":""}</option>`).join("")}</select>`:"";
      return `<div class="liftrow"><div class="nm">${esc(ex.name)} <span class="mid" style="font-weight:400">(${ex.unit})${lastTxt}</span></div>

    body=`<div class="inner"><div class="kioskcard">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">
        <div><h2 style="margin-bottom:2px">${esc(me.first_name)} ${esc(me.last_name)}</h2>
          <div class="mid" style="font-size:12.5px">${me.height?`${fmtHeight(me.height)} · `:""}last weigh-in ${me.weight} lb — enter today's weight below</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px" onclick="A.kMyReport()">My report</button>
          <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px" onclick="A.kStage('edit')">Profile</button>
          <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px" onclick="A.kBackToPick()">Not me</button>
        </div>
      </div>
      <p class="mid" style="margin:10px 0 0">Enter the weight you lifted and how many reps you got. Leave blank anything you didn't test.</p>
      <label class="f" style="margin-bottom:14px"><span class="lab">Test date</span><input type="date" id="te-date" value="${today()}"></label>
      <div class="liftrow" style="margin-bottom:14px;border:2px solid var(--orange)"><div class="nm">Body weight today (lb) <span class="mid" style="font-weight:400">— required for any lift · last: ${me.weight?fmtNum(me.weight)+" lb":"none on file"}</span></div>
        <div class="inrow"><input type="number" inputmode="decimal" min="60" max="450" step="0.5" id="te-bw" placeholder="weigh in, then type it here"></div>
        <div class="est">Step on the scale with a coach watching. Your strength line is based on this number.</div></div>

  else if(k.stage==="done"&&me){

      <p style="color:#9FB3C8;margin:0 0 8px">${saved} number${saved===1?"":"s"} saved.</p>

  else if(k.stage==="myreport"&&me){

/* ---------------- report ---------------- */
function reportHTML(athleteView){
  const a=S.athletes.find(x=>x.id===S.reportId); if(!a)return "<p>Athlete not found.</p>";
  const tested=S.exercises.filter(e=>testsFor(a.id,e.id).length);
  if(!S.histEx)S.histEx=S.exercises[0]?.id;

  const tableRows=S.exercises.map(ex=>{
    const ft=firstT(a.id,ex.id),lt=latestT(a.id,ex.id),bt=bestT(a.id,ex.id);
    const r=lt?evalKPI(ex,a,+lt.value):null;
    const hasGain=ft&&lt&&ft.id!==lt.id;
    const gain=hasGain?+lt.value-+ft.value:null;
    const pct=hasGain&&+ft.value>0?Math.round(gain/+ft.value*100):null;
    const gcell=gain==null?'<span class="dim">—</span>':
      `<span class="${(lowerBetter(ex)?-gain:gain)>0?'gain-up':gain!==0?'gain-dn':'mid'}">${gain>0?'+':''}${gTxt(ex,gain)}${pct!=null?` <small>(${gain>0?'+':''}${pct}%)</small>`:''}</span>`;
    return `<tr><td class="b">${esc(ex.name)}</td>
      <td class="mid">${ft?`${vTxt(ex,ft.value)} <span class="dim" style="font-size:11px">(${fmtDate(ft.date)})</span>${repNote(ft)?`<span class="tiny">${repNote(ft)} est.</span>`:""}`:"—"}</td>
      <td class="b">${lt?`${vU(ex,lt.value)}<span class="tiny">${repNote(lt)?`${repNote(lt)} est. · `:""}${dateSpan(lt.date,"tested ")}</span>`:'<span class="dim" style="font-weight:400">not tested</span>'}</td>
      <td>${gcell}</td><td class="mid">${bt?vTxt(ex,bt.value):"—"}</td>
      <td>${r?.ratio!=null?r.ratio.toFixed(2)+"× BW":"—"}</td>
      <td class="b">${lineTxt(ex,a)?`${lineTxt(ex,a)}${isRatio(ex)?`<span class="tiny">${kpiFor(ex,a)}× BW</span>`:""}`:'<span class="dim" style="font-weight:400">—</span>'}</td>
      <td>${lt?gapPillHTML(ex,gapTo(ex,a,lt.value)):""}</td></tr>`;
  }).join("");

  const charts=tested.map(ex=>{
    const data=testsFor(a.id,ex.id).sort(tOrder);
    const last=data[data.length-1];
    const r=evalKPI(ex,a,+last.value);
    const pts=data.map((d,i)=>`${i?" → ":""}<span class="d">${fmtDate(d.date)}:</span> <b>${vTxt(ex,d.value)}</b>${repNote(d)?` <span class="d">(${repNote(d)})</span>`:""}`).join("");
    return `<div class="chartcard">
      <div class="stats"><b>${vU(ex,last.value)}</b>${r?.ratio!=null?` <span class="mid">· ${r.ratio.toFixed(2)}× BW</span>`:""} ${pillHTML(r?.pass)}</div>
      <h4>${esc(ex.name).toUpperCase()}</h4>
      <div class="chartwrap"><canvas id="ch-${ex.id}" data-ex="${ex.id}" data-athlete="${a.id}"></canvas></div>
      <div class="pts">${pts}${data.length===1?' <span class="d">· first test on file — the line fills in as they retest</span>':""}</div></div>`;
  }).join("");

  const stds=S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null)
    .map(e=>`${esc(e.name)} M ${stdTxt(e,e.kpi_m)} / F ${stdTxt(e,e.kpi_f)}`).join(" · ");

  const hist=testsFor(a.id,S.histEx).sort((x,y)=>tOrder(y,x)).map(t=>{
    const hx=S.exercises.find(e=>e.id===S.histEx)||{unit:""};
    return `<li style="padding:8px 0;border-top:1px solid #F1F2F4;display:flex;justify-content:space-between;align-items:center">
      <span>${fmtDate(t.date,true)} — <b>${vU(hx,t.value)}</b>${repNote(t)?` <span class="mid">(${repNote(t)} → est.)</span>`:""}</span>
      <button class="btn-del" onclick="A.delTest('${t.id}')">delete entry</button></li>`;}).join("");

  const groups=[...listOf(a.periods),...listOf(a.sports)];
  return `<div class="stack">
    <div class="print-hide" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">
      <button class="btn-link" onclick="A.reportBack(${athleteView})">← Back</button>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${athleteView?"":`<button class="btn btn-ghost" onclick="A.toggleEdit()">${S.editingProfile?"Close editor":"Edit profile"}</button>`}
        <div class="toggle" title="Controls what you see and what goes in the PDF"><button class="${S.printMode==='compact'?'on':''}" onclick="A.setPrint('compact')">One-sheet</button>
        <button class="${S.printMode==='full'?'on':''}" onclick="A.setPrint('full')">With charts</button></div>
        <button class="btn btn-orange" onclick="A.downloadPDF('${a.id}')">DOWNLOAD PDF</button>
      </div></div>
    ${S.editingProfile&&!athleteView?`<div class="card print-hide" style="padding:20px">${profileFormHTML(a,`A.saveProfileEdit('${a.id}')`,"A.toggleEdit()")}</div>`:""}
    <div class="banner"><img src="${LOGO}" alt="Naperville North Huskies">
      <div><div class="eyebrow">Naperville North Strength &amp; Performance · Athlete Report</div>
      <h2>${esc(a.first_name)} ${esc(a.last_name)}</h2>
      <div class="meta"><span>${a.gender}</span>${a.height?`<span>${fmtHeight(a.height)}</span>`:""}<span>${a.weight} lb</span>${groups.length?`<span>${esc(groups.join(" · "))}</span>`:""}${a.grad_year?`<span>Class of ${esc(a.grad_year)}</span>`:""}<span class="dim2">Printed ${fmtDate(today(),true)}</span></div></div></div>
    <div class="card"><div class="cardhead">CURRENT NUMBERS vs THE LINE</div>
      <div style="overflow-x:auto"><table><thead><tr><th>Exercise</th><th>First test</th><th>Current</th><th>Gain</th><th>Best</th><th>Rel. strength</th><th>The line</th><th>Standing</th></tr></thead><tbody>${tableRows}</tbody></table></div></div>
    <div class="charts-section" ${S.printMode==="compact"?'style="display:none"':''}><h3 class="section-t">PROGRESS BY LIFT — EVERY TEST DATE</h3>
      ${tested.length?`<div class="grid2">${charts}</div>`:`<div class="card" style="padding:22px;color:var(--mid)">No tests logged yet.</div>`}
      <div class="note">Dashed navy line = current team standard at this athlete's current body weight. Orange line = tested maxes by date.</div></div>
    <div class="footnote">
      <p style="margin:0">The line is the team standard converted to this athlete's current body weight. Standing shows how far over the line they are, or how much they have to go. Gain compares the first test day to the most recent test day (best attempt of each day). Rel. strength = max ÷ body weight.</p>
      <p style="margin:6px 0 0">The date under each Current number is the last day that lift was tested. <b style="color:var(--orange)">Orange</b> means it's more than ${S.staleDays} days old — time to retest.</p>
      <p style="margin:6px 0 0">Numbers marked <b>est.</b> are estimated one-rep maxes calculated from a multi-rep set using the Brzycki formula (1RM = weight × 36 ÷ (37 − reps)); the set that produced them is shown beside the number.</p>
      <p style="margin:6px 0 0"><b>Team standards:</b> ${stds}</p></div>
    <div class="pillars light" style="border-radius:10px;border:1px solid var(--border);border-top:3px solid var(--orange)">${PILLARS.map(p=>`<span>${p}</span>`).join("")}</div>
    ${athleteView?"":`<div class="sendcard print-hide">
      <div class="h">SEND ATHLETE REPORT</div>
      <div class="body">
        <div class="grid2">
          <label class="f"><span class="lab">Athlete / parent email</span><input id="em-to" type="email" placeholder="name@email.com" value="${esc(S.emailTo||"")}"></label>
          <label class="f"><span class="lab">From (coach)</span><input id="em-from" value="${esc(S.emailFrom||"Huskies Strength & Performance")}"></label>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-orange" onclick="A.downloadPDF('${a.id}')">DOWNLOAD PDF REPORT</button>
          <button class="btn btn-navy" onclick="A.emailDraft('${a.id}')">OPEN EMAIL DRAFT</button>
        </div>
        <p class="how"><b>How it works:</b> "Download PDF Report" saves a branded PDF — one page on <b>One-sheet</b>, or with every growth chart on <b>With charts</b> (toggle above). "Open Email Draft" opens your mail app with the summary already written — attach the downloaded PDF before you send. A web page can't attach a file to an email by itself; that last click is yours.</p>
      </div></div>
    <div class="card print-hide" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h3 class="section-t" style="margin:0">EDIT / DELETE ENTRIES</h3>
        <select style="width:auto" onchange="A.setHistEx(this.value)">${S.exercises.map(e=>`<option value="${e.id}" ${S.histEx===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>
      <ul style="list-style:none;padding:0;margin:12px 0 0;font-size:13.5px">${hist||'<li class="dim">Nothing logged for this exercise.</li>'}</ul></div>`}
  </div>`;
}
function mountCharts(){
  document.querySelectorAll("canvas[data-ex]").forEach(cv=>{
    const a=S.athletes.find(x=>x.id===cv.dataset.athlete);
    const ex=S.exercises.find(e=>e.id===cv.dataset.ex);
    if(!a||!ex)return;
    const data=testsFor(a.id,ex.id).sort(tOrder);
    if(!data.length)return;
    const r=evalKPI(ex,a,+data[data.length-1].value);
    const ds=[{label:ex.name,data:data.map(d=>+d.value),borderColor:"#FF4800",pointRadius:4,pointBackgroundColor:"#002F55",borderWidth:3,tension:0}];
    if(r?.target!=null)ds.push({label:"The line",data:data.map(()=>r.target),borderColor:"#002F55",borderDash:[6,4],borderWidth:1.5,pointRadius:0});
    /* One data point on a tight axis reads like a broken graph — pad it. */
    const vals=data.map(d=>+d.value).concat(r?.target!=null?[r.target]:[]);
    const lo=Math.min(...vals), hi=Math.max(...vals);
    const pad=Math.max((hi-lo)*0.25, hi*0.12, 5);
    S.chartRefs.push(new Chart(cv,{type:"line",data:{labels:data.map(d=>fmtDate(d.date)),datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${vU(ex,ctx.parsed.y)}`,afterLabel:ctx=>{const d=data[ctx.dataIndex];return repNote(d)?`from ${repNote(d)}`:"";}}}},
      scales:{x:{ticks:{font:{size:10}}},
        y:{ticks:{font:{size:10},callback:v=>isFtIn(ex)?fmtFtIn(v):v},suggestedMin:Math.max(0,lo-pad),suggestedMax:hi+pad}}}}));
  });
}

function listEditor(kind,arr){
  const title=kind==="period"?"CLASS PERIODS":kind==="sport"?"SPORTS":"GRAD YEARS";

  return `<div class="card" style="padding:18px">
    <h3 class="section-t">${title} (${arr.length})</h3>
    <div class="tagrow" style="gap:6px">${arr.map(x=>`<span class="tag" style="padding:5px 8px;font-size:12px">${esc(x)} <span class="dim" style="font-weight:400">${used(x)}</span>
      <button class="btn-link" style="font-size:11px;color:var(--navy);font-weight:700" onclick="A.renameListItem('${kind}','${esc(x).replace(/'/g,"\\'")}')">rename</button>
      <button class="btn-del" style="font-size:11px;padding:2px 6px;border-radius:4px;background:#FEE2E2" onclick="A.removeListItem('${kind}','${esc(x).replace(/'/g,"\\'")}')">delete</button></span>`).join("")}</div>
    ${S.listMsg?`<div style="margin-top:10px;font-size:12.5px;font-weight:700;color:var(--green)">${esc(S.listMsg)}</div>`:""}
    <div style="display:flex;gap:8px;margin-top:12px;max-width:420px">
      <input id="new-${kind}" placeholder="${ph}">
      <button class="btn btn-navy" onclick="A.addListItem('${kind}')">Add</button></div>
    <p class="note">${kind==="period"?"<b>Rename carries over:</b> renaming \"P2 Benages\" to \"P4 Benages\" updates every athlete already tagged with it — use this at semester change instead of editing profiles one by one. ":""}The number beside each tag is how many athletes currently use it. Removing a tag doesn't strip it from those athletes.</p></div>`;
}
function bulkHTML(){
  const src=S.bulk.from;
  const pool=S.athletes.filter(a=>{
    if(src==="All")return true;
    if(src===UNASSIGNED)return !listOf(a.periods).length;
    return listOf(a.periods).includes(src);
  }).sort((a,b)=>a.last_name.localeCompare(b.last_name));
  const opts=arr=>arr.map(x=>`<option ${S.bulk.from===x?"selected":""}>${esc(x)}</option>`).join("");
  const rows=pool.map(a=>`<label><input type="checkbox" ${S.bulk.picked.includes(a.id)?"checked":""} onchange="A.bulkPick('${a.id}',this.checked)">
    <span>${esc(a.last_name)}, ${esc(a.first_name)} <span class="dim" style="font-size:11px">${esc(a.periods||"unassigned")}</span></span></label>`).join("")
    ||'<p class="mid" style="padding:10px">Nobody in that group.</p>';
  return `<div class="card" style="padding:18px">
    <h3 class="section-t">SEMESTER ROLLOVER — MOVE ATHLETES IN BULK</h3>
    <p class="note" style="margin:0 0 12px">Pick a group, check the athletes, then send them to a new period — or park them in Unassigned until schedules come out. This <b>replaces</b> their class period(s); sports are untouched.</p>
    <div class="grid2" style="grid-template-columns:1fr 1fr;align-items:end">
      <label class="f"><span class="lab">Show athletes in</span><select onchange="A.setBulk('from',this.value)">${opts(["All",UNASSIGNED,...S.periods])}</select></label>
      <label class="f"><span class="lab">Move checked athletes to</span><select id="bulk-to"><option value="${UNASSIGNED}">${UNASSIGNED} (park them)</option>${S.periods.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("")}</select></label>
    </div>

      <button class="btn btn-ghost" onclick="A.bulkAll(true)">Select all shown</button>
      <button class="btn btn-ghost" onclick="A.bulkAll(false)">Clear</button>

function setupHTML(){
  const unitOpts=u=>["lb","kg","in","ft-in","cm","sec","W"].map(x=>`<option value="${x}" ${u===x?"selected":""}>${x==="ft-in"?"ft + in":x}</option>`).join("");
  const ftHint=(ex,k)=>isFtIn(ex)&&k!=null?`<span class="tiny">= ${fmtFtIn(k)}</span>`:"";
  const rows=S.exercises.map((ex,i)=>`<tr>
    <td><input value="${esc(ex.name)}" onchange="A.updEx(${i},'name',this.value)"></td>
    <td style="width:85px"><select onchange="A.updEx(${i},'unit',this.value)">${unitOpts(ex.unit)}</select></td>
    <td style="width:140px"><select onchange="A.updEx(${i},'kpi_type',this.value)"><option value="ratio" ${ex.kpi_type==="ratio"?"selected":""}>× body weight</option><option value="absolute" ${ex.kpi_type==="absolute"?"selected":""}>absolute</option></select></td>
    <td style="width:95px"><input type="number" step="0.05" value="${ex.kpi_m??""}" placeholder="—" onchange="A.updEx(${i},'kpi_m',this.value)">${ftHint(ex,ex.kpi_m)}</td>
    <td style="width:95px"><input type="number" step="0.05" value="${ex.kpi_f??""}" placeholder="—" onchange="A.updEx(${i},'kpi_f',this.value)">${ftHint(ex,ex.kpi_f)}</td>
    <td style="width:80px;text-align:center"><input type="checkbox" style="width:auto" ${ex.reps_ok?"checked":""} onchange="A.updEx(${i},'reps_ok',this.checked)"></td>
    <td><button class="btn-del" onclick="A.delEx('${ex.id}')">remove</button></td></tr>`).join("");
  const staleN=S.athletes.filter(a=>{const d=lastDate(a.id);return d&&isStale(d);}).length;
  const neverN=S.athletes.filter(a=>!lastDate(a.id)).length;
  return `<div class="stack">
    <div class="card"><div class="cardhead">EXERCISES &amp; KPI STANDARDS</div>
      <p style="padding:12px 16px 0;margin:0;font-size:11.5px;color:var(--mid)">Ratio standards are multiples of body weight (1.7 = 1.7× BW). Absolute standards are raw numbers in the exercise's unit. <b>ft + in</b> exercises: athletes enter feet and inches at the kiosk; enter the standard here in total inches (94 = 7'10") — the converted value shows under the box. Leave a standard blank until you're ready. <b>Reps?</b> checked = athletes enter weight × reps and the app estimates a 1RM; unchecked = they enter the number directly (jumps).</p>

/* ---------------- PDF generation (jsPDF) ---------------- */
const NAVY_RGB=[0,47,85], ORANGE_RGB=[255,72,0], MIDG=[107,114,128], INKG=[17,24,39], GREENG=[4,120,87], REDG=[220,38,38];
function safeName(str){ return String(str).replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,""); }

/* v22: page geometry shared by single + batch PDFs */
const PDF_W=612, PDF_H=792, PDF_M=44;

/* Draw text, shrinking the font until it fits maxW (never below 5.5pt). */
function fitText(d, txt, x, y, maxW, size){
  let s=size; d.setFontSize(s);
  while(s>5.5 && d.getTextWidth(txt)>maxW){ s-=0.25; d.setFontSize(s); }
  d.text(txt, x, y);
  return s;
}

function buildPDF(a){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:"pt", format:"letter"});
  drawReportPage(d, a, S.printMode==="full");
  drawPillarFooters(d);
  return d;
}

/* v22: one combined PDF, one athlete per page (one-sheet summary, no charts) */
function buildBatchPDF(list){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:"pt", format:"letter"});
  list.forEach((a,i)=>{ if(i>0) d.addPage(); drawReportPage(d, a, false); });
  drawPillarFooters(d);
  return d;
}

function drawPillarFooters(d){
  const W=PDF_W, H=PDF_H, M=PDF_M;
  const pages=d.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    d.setPage(p);
    d.setFillColor(11,32,53); d.rect(M,H-M-26,W-2*M,26,"F");
    d.setTextColor(...ORANGE_RGB); d.setFont("helvetica","bold"); d.setFontSize(9.5);
    d.text(PILLARS.join("    "), W/2, H-M-9, {align:"center"});
  }
}

function drawReportPage(d, a, withCharts){
  const W=PDF_W, H=PDF_H, M=PDF_M;
  let y;

  /* banner */
  const bh=104;
  d.setFillColor(...NAVY_RGB); d.roundedRect(M,M,W-2*M,bh,6,6,"F");
  try{ d.addImage(LOGO,"PNG",M+14,M+(bh-84)/2,96,84); }catch(e){}
  const tx=M+14+96+16;
  d.setTextColor(...ORANGE_RGB); d.setFont("helvetica","bold"); d.setFontSize(7.5);
  d.text("NAPERVILLE NORTH STRENGTH & PERFORMANCE  ·  ATHLETE REPORT", tx, M+26);
  d.setTextColor(255,255,255);
  fitText(d, `${a.first_name} ${a.last_name}`, tx, M+56, W-M-14-tx, 26);  /* v22: long names shrink to fit */
  d.setTextColor(199,210,224); d.setFont("helvetica","normal"); d.setFontSize(9);
  const groups=[...listOf(a.periods),...listOf(a.sports)];
  const meta=[a.gender, a.height?fmtHeight(a.height):null, `${a.weight} lb`,
    groups.length?groups.join(" · "):null, a.grad_year?`Class of ${a.grad_year}`:null, `Printed ${fmtDate(today(),true)}`]
    .filter(Boolean).join("   ·   ");
  d.text(d.splitTextToSize(meta, W-2*M-96-40), tx, M+76);
  y = M+bh+26;

  /* table */
  d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(12);
  d.text("CURRENT NUMBERS vs THE LINE", M, y); y+=12;
  /* v22: column widths sum exactly to the printable width (W-2M = 524pt) so
     STANDING can never run off the page. Old layout started STANDING at 524pt
     in, leaving no room for the pill. */
  const widths=[98, 76, 62, 70, 44, 50, 52, 72];   /* v23: + THE LINE column */
  const cols=[]; widths.reduce((x,w)=>{cols.push(x);return x+w;}, M);
  const PAD=6, cw=i=>widths[i]-PAD*2;
  const heads=["EXERCISE","FIRST TEST","CURRENT","GAIN","BEST","REL. STR.","THE LINE","STANDING"];
  d.setFillColor(243,244,246); d.rect(M,y,W-2*M,22,"F");
  d.setTextColor(...MIDG); d.setFont("helvetica","bold");
  heads.forEach((h,i)=>fitText(d, h, cols[i]+PAD, y+14, cw(i), 6.8));
  y+=22;
  const rowH=30;
  S.exercises.forEach(ex=>{
    const ft=firstT(a.id,ex.id), lt=latestT(a.id,ex.id), bt=bestT(a.id,ex.id);
    d.setDrawColor(229,231,235); d.setLineWidth(.6); d.line(M,y,W-M,y);
    const base=y+18;
    d.setTextColor(...INKG); d.setFont("helvetica","bold"); d.setFontSize(9);
    fitText(d, String(ex.name), cols[0]+PAD, base, cw(0), 9);
    /* THE LINE — shown even when untested so the athlete knows the target */
    { const lt0=lineTxt(ex,a);
      d.setFont("helvetica","bold"); d.setTextColor(...(lt0?NAVY_RGB:MIDG));
      fitText(d, lt0||"—", cols[6]+PAD, base, cw(6), 9);
      if(lt0&&isRatio(ex)){ d.setFont("helvetica","normal"); d.setTextColor(...MIDG);
        fitText(d, `${kpiFor(ex,a)}x BW`, cols[6]+PAD, base+9, cw(6), 6.8); } }
    if(lt){
      const r=evalKPI(ex,a,+lt.value);
      d.setFont("helvetica","normal"); d.setTextColor(...MIDG); d.setFontSize(8.5);
      fitText(d, ft?`${vTxt(ex,ft.value)} (${fmtDate(ft.date)})`:"—", cols[1]+PAD, base, cw(1), 8.5);
      d.setFont("helvetica","bold"); d.setTextColor(...INKG); d.setFontSize(9.5);
      fitText(d, vU(ex,lt.value), cols[2]+PAD, base, cw(2), 9.5);
      /* v27: last-tested date under Current (orange + bold when stale); est. set shares the line */
      { const st=isStale(lt.date);
        d.setFont("helvetica",st?"bold":"normal"); d.setTextColor(...(st?ORANGE_RGB:MIDG));
        fitText(d, `${repNote(lt)?repNote(lt)+" est. · ":"tested "}${fmtDate(lt.date)}`, cols[2]+PAD, base+9, cw(2), 6.8); }
      const hasGain=ft&&lt&&ft.id!==lt.id;
      if(hasGain){
        const g=+lt.value-+ft.value, pct=+ft.value>0?Math.round(g/+ft.value*100):null;
        d.setFont("helvetica","bold"); d.setFontSize(9.5);
        {const gd=lowerBetter(ex)?-g:g; d.setTextColor(...(gd>0?GREENG:gd<0?REDG:MIDG));}
        fitText(d, `${g>0?"+":""}${gTxt(ex,g)}${pct!=null?` (${g>0?"+":""}${pct}%)`:""}`, cols[3]+PAD, base, cw(3), 9.5);
      } else { d.setTextColor(...MIDG); d.setFont("helvetica","normal"); d.text("—", cols[3]+PAD, base); }
      d.setFont("helvetica","normal"); d.setTextColor(...MIDG); d.setFontSize(8.5);
      fitText(d, bt?vTxt(ex,bt.value):"—", cols[4]+PAD, base, cw(4), 8.5);
      d.setTextColor(...INKG);
      fitText(d, r?.ratio!=null?`${r.ratio.toFixed(2)}x BW`:"—", cols[5]+PAD, base, cw(5), 8.5);
      /* standing pill */
      const gp=gapTo(ex,a,lt.value), txt=gapTxt(ex,gp);
      const bg=gp==null?[229,231,235]:gp>=0?[209,250,229]:[254,226,226];
      const fg=gp==null?[107,114,128]:gp>=0?[6,95,70]:[185,28,28];
      d.setFont("helvetica","bold");
      let fs=6.8; d.setFontSize(fs);
      while(fs>5.5 && d.getTextWidth(txt)+10>cw(7)){ fs-=0.25; d.setFontSize(fs); }
      const pw=d.getTextWidth(txt)+10;
      d.setFillColor(...bg); d.roundedRect(cols[7]+PAD, base-8, pw, 12, 5,5,"F");
      d.setTextColor(...fg); d.text(txt, cols[7]+PAD+5, base);
    } else {
      d.setFont("helvetica","normal"); d.setTextColor(156,163,175); d.setFontSize(8.5);
      d.text("not tested", cols[2]+PAD, base);
    }
    y+=rowH;
  });
  d.setDrawColor(229,231,235); d.line(M,y,W-M,y);

  /* footnotes */
  y+=24;
  d.setTextColor(55,65,81); d.setFont("helvetica","normal"); d.setFontSize(8.6);
  const fn1=`The line is the team standard converted to this athlete's current body weight. Standing shows how far over the line they are, or how much they have to go. Gain compares the first test day to the most recent test day (best attempt of each day). Rel. Str. = max divided by body weight. The date under Current is the last day that lift was tested; orange means more than ${S.staleDays} days ago.`;
  d.splitTextToSize(fn1, W-2*M).forEach(l=>{ d.text(l,M,y); y+=11; });
  y+=3;
  const fn2="Numbers marked est. are estimated one-rep maxes from a multi-rep set (Brzycki: 1RM = weight x 36 / (37 - reps)); the set that produced them is shown beneath the number.";
  d.splitTextToSize(fn2, W-2*M).forEach(l=>{ d.text(l,M,y); y+=11; });
  y+=3;
  const stds=S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null)
    .map(e=>`${e.name} M ${e.kpi_m!=null?(isRatio(e)?e.kpi_m+"xBW":vU(e,e.kpi_m)):"—"} / F ${e.kpi_f!=null?(isRatio(e)?e.kpi_f+"xBW":vU(e,e.kpi_f)):"—"}`).join(" · ");
  d.setFont("helvetica","bold"); d.text("Team standards:", M, y);
  const sw=d.getTextWidth("Team standards: ")+2;
  d.setFont("helvetica","normal");
  d.splitTextToSize(stds, W-2*M-sw).forEach((l,i)=>{ d.text(l, M+(i===0?sw:0), y); if(i===0)y+=11; else y+=11; });

  /* charts pages (Full mode only) */
  if (withCharts && S.chartRefs.length){
    const per=2, cw=(W-2*M-16)/2, chh=150;
    let cx=M, cy=0, count=0;
    d.addPage();
    d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(13);
    d.text("PROGRESS BY LIFT — EVERY TEST DATE", M, M+14);
    cy=M+34;
    S.chartRefs.forEach(ch=>{
      let img; try{ img=ch.canvas.toDataURL("image/png",1.0); }catch(e){ return; }
      if (cy+chh+30 > H-M){ d.addPage(); cy=M+10; cx=M; count=0; }
      const exName = ch.data.datasets[0].label||"";
      d.setTextColor(...INKG); d.setFont("helvetica","bold"); d.setFontSize(9);
      d.text(String(exName).toUpperCase(), cx, cy);
      d.addImage(img,"PNG",cx,cy+6,cw,chh);
      count++;
      if (count%per===0){ cx=M; cy+=chh+34; } else { cx=M+cw+16; }
    });
  }

}

/* v28: comparison PDF — team summary, then every athlete per lift */
function buildComparePDF(live){
  const { jsPDF } = window.jspdf;
  const d=new jsPDF({unit:"pt",format:"letter"});
  const W=PDF_W,H=PDF_H,M=PDF_M,c=S.cmp,BOT=H-M-40,PAD=5;
  const colsOf=w=>{const cols=[];w.reduce((x,v)=>{cols.push(x);return x+v;},M);return cols;};
  const head=(w,heads,y)=>{const cols=colsOf(w);d.setFillColor(243,244,246);d.rect(M,y,W-2*M,18,"F");
    d.setTextColor(...MIDG);d.setFont("helvetica","bold");heads.forEach((h,i)=>fitText(d,h,cols[i]+PAD,y+12,w[i]-PAD*2,6.8));return cols;};
  const cell=(t,cols,w,i,y,o)=>{o=o||{};d.setFont("helvetica",o.bold?"bold":"normal");d.setTextColor(...(o.color||INKG));
    fitText(d,String(t),cols[i]+PAD,y,w[i]-PAD*2,o.size||8.5);};
  const rule=y=>{d.setDrawColor(229,231,235);d.setLineWidth(.6);d.line(M,y,W-M,y);};
  const impColor=v=>v>0?GREENG:v<0?REDG:MIDG;
  const ov=x=>x==null?"—":x?"OVER":"BELOW";

  /* banner */
  const bh=80; d.setFillColor(...NAVY_RGB); d.roundedRect(M,M,W-2*M,bh,6,6,"F");
  try{ d.addImage(LOGO,"PNG",M+12,M+10,68,60); }catch(e){}
  const tx=M+12+68+14;
  d.setTextColor(...ORANGE_RGB); d.setFont("helvetica","bold"); d.setFontSize(7.5);
  d.text("NAPERVILLE NORTH STRENGTH & PERFORMANCE  ·  TEAM COMPARISON", tx, M+22);
  d.setTextColor(255,255,255); fitText(d, cmpGroupLabel(), tx, M+47, W-M-12-tx, 21);
  d.setTextColor(199,210,224); d.setFont("helvetica","normal");
  fitText(d, `Range A: ${rngTxt(c.aFrom,c.aTo,true)}     Range B: ${rngTxt(c.bFrom,c.bTo,true)}     Printed ${fmtDate(today(),true)}`, tx, M+66, W-M-12-tx, 9);
  let y=M+bh+26;

  /* team summary */
  d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(12);
  d.text("TEAM CHANGE — ATHLETES WHO TESTED IN BOTH RANGES", M, y); y+=10;
  const w1=[100,46,60,60,74,50,70,64];
  let cols=head(w1,["LIFT","ATHLETES","AVG A","AVG B","AVG CHANGE","IMPROVED","REL. STR A>B","OVER LINE A>B"],y); y+=18;
  live.forEach(r=>{const ex=r.ex; rule(y); const b=y+13;
    cell(ex.name,cols,w1,0,b,{bold:true,size:9});
    cell(r.n,cols,w1,1,b);
    cell(vU(ex,r.avgA),cols,w1,2,b,{color:MIDG});
    cell(vU(ex,r.avgB),cols,w1,3,b,{bold:true});
    cell(`${signedV(ex,r.avgD)}${r.avgPct!=null?` (${r.avgPct>=0?"+":""}${r.avgPct.toFixed(1)}%)`:""}`,cols,w1,4,b,{bold:true,color:impColor(r.avgImp)});
    cell(`${r.improved}/${r.n}`,cols,w1,5,b);
    cell(r.relA!=null?`${r.relA.toFixed(2)}x > ${r.relB.toFixed(2)}x${r.approx?" ~":""}`:"—",cols,w1,6,b);
    cell(r.std?`${r.overA}/${r.std} > ${r.overB}/${r.std}${r.newOver?`  +${r.newOver} new`:""}`:"no standard",cols,w1,7,b);
    y+=19; });
  rule(y); y+=14;
  const excl=live.filter(r=>r.onlyA||r.onlyB).map(r=>`${r.ex.name} ${r.onlyA} A only / ${r.onlyB} B only`).join(" · ");
  d.setFont("helvetica","normal"); d.setTextColor(...MIDG); d.setFontSize(8);
  d.splitTextToSize(`Not counted (tested in only one range): ${excl||"none"}`, W-2*M).forEach(l=>{d.text(l,M,y);y+=10;});
  y+=14;

  /* every athlete, per lift */
  const w2=[22,134,72,72,90,82,52];
  const h2=["#","ATHLETE","RANGE A","RANGE B","CHANGE","REL. STR","LINE A>B"];
  const rankLbl=c.rank==="pct"?"RANKED BY % GAINED":"RANKED BY RAW GAIN";
  live.forEach(r=>{const ex=r.ex;
    if(y+18+18+20*2>BOT){ d.addPage(); y=M+14; }
    d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(11);
    d.text(`${ex.name.toUpperCase()} — EVERY ATHLETE (${r.n})`, M, y);
    d.setFont("helvetica","normal"); d.setFontSize(7.5); d.setTextColor(...MIDG); d.text(rankLbl, W-M, y, {align:"right"}); y+=8;
    cols=head(w2,h2,y); y+=18;
    r.rows.forEach((x,i)=>{
      if(y+19>BOT){ d.addPage(); y=M+14;
        d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(9);
        d.text(`${ex.name.toUpperCase()} (continued)`, M, y); y+=6; cols=head(w2,h2,y); y+=18; }

      cell(i+1,cols,w2,0,b,{color:MIDG});
      cell(`${x.a.last_name}, ${x.a.first_name}`,cols,w2,1,b,{bold:true});
      cell(`${vTxt(ex,x.A)}${repNote(x.ta)?"*":""}  ${fmtDate(x.ta.date)}`,cols,w2,2,b,{color:MIDG});
      cell(`${vTxt(ex,x.B)}${repNote(x.tb)?"*":""}  ${fmtDate(x.tb.date)}`,cols,w2,3,b,{bold:true});
      cell(`${signedV(ex,x.d)}${x.pct!=null?` (${x.pct>=0?"+":""}${x.pct.toFixed(1)}%)`:""}`,cols,w2,4,b,{bold:true,color:impColor(x.imp)});
      cell(x.relA!=null?`${x.relA.toFixed(2)}x > ${x.relB.toFixed(2)}x${x.approx?" ~":""}`:"—",cols,w2,5,b);
      cell(`${ov(x.overA)} > ${ov(x.overB)}`,cols,w2,6,b,{bold:x.overA===false&&x.overB===true,color:x.overB==null?MIDG:x.overB?GREENG:REDG,size:7.5});
      y+=19; });
    rule(y); y+=24;
  });

  /* footnote */
  if(y+50>BOT){ d.addPage(); y=M+14; }
  d.setFont("helvetica","normal"); d.setTextColor(55,65,81); d.setFontSize(8.2);
  ["Each athlete's best entry inside each range is used. Team numbers count only athletes who tested that lift in both ranges.",
   "* = estimated max from a multi-rep set (Brzycki). Relative strength and the line use body weight on the day of the test; ~ means at least one test was logged before body weight was saved per entry, so current weight was used."]
   .forEach(t=>d.splitTextToSize(t,W-2*M).forEach(l=>{d.text(l,M,y);y+=10;}));
  drawPillarFooters(d);
  return d;
}

    if(!w||isNaN(+w)){out.innerHTML="";return;}
    if(!usesReps(ex)){out.innerHTML=`<span class="o">${vU(ex,+w)}</span> will be recorded`;return;}
    const r=+document.getElementById("tr-"+exId).value||1;
    const e=est1RM(+w,r);
    out.innerHTML=r<=1?`Recorded as a true 1RM: <span class="o">${fmtNum(e)} ${ex.unit}</span>`
      :`${fmtNum(+w)} × ${r} → estimated 1RM <span class="o">${fmtNum(e)} ${ex.unit}</span>`;
