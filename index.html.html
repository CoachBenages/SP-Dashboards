<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naperville North Strength &amp; Performance Board</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#002F55;--navy2:#0A4472;--orange:#FF4800;--orange2:#FF6A2E;--bg:#F3F4F6;--card:#fff;--border:#E5E7EB;--mid:#6B7280;--ink:#111827;--green:#047857;--greenbg:#D1FAE5;--greentx:#065F46;--red:#DC2626;--redbg:#FEE2E2;--redtx:#B91C1C;--graybg:#E5E7EB;--graytx:#6B7280}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.osw{font-family:Oswald,Inter,sans-serif;font-weight:700}
header.app{background:var(--navy);color:#fff}
.hwrap{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.hlogo{height:48px}
.htitle{line-height:1.05}
.htitle .t1{font-size:20px;letter-spacing:-.02em}
.htitle .t2{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:none;border:0;color:#cbd5e1;font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:8px 14px;border-radius:6px;cursor:pointer}
.tab:hover{color:#fff}.tab.on{background:var(--orange);color:#fff}
.kioskbtn{margin-left:auto;background:#fff;color:var(--navy);border:0;font:inherit;font-weight:900;font-size:13px;padding:9px 16px;border-radius:6px;cursor:pointer}
.kioskbtn:hover{background:var(--orange2);color:#fff}
.synced{font-size:10.5px;color:#7A93AC;letter-spacing:.04em}
main{max-width:1180px;margin:0 auto;padding:22px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px}
.cardhead{padding:10px 16px;background:#F3F4F6;border-bottom:1px solid var(--border);font-family:Oswald;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px 10px 0 0}
.cardhead .sub{font-family:Inter;font-size:11px;color:var(--mid);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mid);padding:8px;font-weight:700}
th:first-child,td:first-child{padding-left:16px}
td{padding:8px;border-top:1px solid #F1F2F4;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover{background:#FFF3EC}
.b{font-weight:800}.mid{color:var(--mid)}.dim{color:#9CA3AF}
.tiny{font-size:11px;color:#9CA3AF;display:block;font-weight:400}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:800;white-space:nowrap}
.p-over{background:var(--greenbg);color:var(--greentx)}
.p-below{background:var(--redbg);color:var(--redtx)}
.p-none{background:var(--graybg);color:var(--graytx);font-weight:700}
.p-est{background:#FFF3EC;color:#9A3412;font-weight:700;font-size:10px}
.gain-up{color:var(--green);font-weight:800}.gain-dn{color:var(--red);font-weight:800}
.btn{font:inherit;border-radius:7px;padding:9px 16px;font-weight:800;cursor:pointer;border:1px solid transparent}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange2)}
.btn-ghost{background:#fff;border-color:#D1D5DB;color:var(--ink)}.btn-ghost:hover{background:#F3F4F6}
.btn-link{background:none;border:0;color:var(--mid);cursor:pointer;font:inherit;font-size:13px;padding:0}.btn-link:hover{color:var(--ink)}
.btn-del{background:none;border:0;color:#EF4444;font-size:11.5px;cursor:pointer;font-weight:600}.btn-del:hover{color:#B91C1C}
label.f{display:block}
label.f span.lab{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mid);margin-bottom:4px}
input,select{font:inherit;width:100%;border:1px solid #D1D5DB;border-radius:7px;padding:8px 10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--orange);border-color:var(--orange)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:14px 16px}
.filters label.f{min-width:140px}
.filters .count{margin-left:auto;color:var(--mid);font-size:13px;padding-bottom:8px}
.kpicard{background:var(--navy);color:#fff;border-radius:10px;padding:14px}
.kpicard .n{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#9FB3C8}
.kpicard .v{font-family:Oswald;font-size:30px;font-weight:700;margin-top:2px}
.kpicard .v small{color:#64748B;font-size:18px}
.kpicard .pct{color:var(--orange);font-size:11.5px;font-weight:700;margin-top:2px}
.kpicard .std{color:#64748B;font-size:10.5px;margin-top:3px}
.linebar{position:relative;height:9px;background:#E5E7EB;border-radius:99px;overflow:hidden;min-width:110px}
.linebar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.linebar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--navy)}
.banner{background:var(--navy);color:#fff;border-radius:10px;padding:20px;display:flex;gap:18px;align-items:flex-start}
.banner img{height:82px}
.banner .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--orange);font-weight:800}
.banner h2{font-family:Oswald;font-size:34px;margin:4px 0 0}
.banner .meta{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:10px;color:#C7D2E0;font-size:13px}
.banner .meta .dim2{color:#64748B}
.chartcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px}
.chartcard h4{margin:0 0 4px;font-family:Oswald;font-size:15px}
.chartcard .stats{font-size:13px;float:right}
.chartcard .pts{margin-top:6px;font-size:11.5px;color:#4B5563;line-height:1.6}
.chartcard .pts .d{color:#9CA3AF}
.chartwrap{position:relative;height:190px}
.footnote{border-top:1px solid var(--border);padding-top:12px;font-size:13px;color:#4B5563;line-height:1.55}
.section-t{font-family:Oswald;font-size:18px;font-weight:700;margin:0 0 12px}
.stack>*+*{margin-top:20px}
.note{font-size:11.5px;color:#9CA3AF;margin-top:10px}
.toggle{display:inline-flex;border:1px solid #D1D5DB;border-radius:8px;padding:3px;gap:2px;font-size:11.5px;font-weight:800}
.toggle button{border:0;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mid);font:inherit;font-weight:800}
.toggle button.on{background:var(--navy);color:#fff}
.pillars{background:#0B2035;color:var(--orange);text-align:center;font-family:Oswald,Inter,sans-serif;font-weight:700;letter-spacing:.10em;font-size:13px;padding:11px 12px;text-transform:uppercase}
.pillars span{white-space:nowrap;margin:0 10px;display:inline-block}
.pillars.light{background:#fff;border-top:2px solid var(--orange);border-radius:0 0 10px 10px}
.lbgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.lbcol{padding:0}
.lbcol h5{margin:0;padding:8px 14px;font-family:Oswald;font-size:12.5px;letter-spacing:.08em;color:#fff;background:#0B3A63}
.lbcol.f h5{background:#7A2E12}
.lbrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #F1F2F4;cursor:pointer}
.lbrow:hover{background:#FFF3EC}
.rank{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex:0 0 auto;color:#fff;background:#9CA3AF}
.rank.r1{background:#D4A017}.rank.r2{background:#8E9BA8}.rank.r3{background:#A4713C}
.lbname{font-weight:800;flex:1;font-size:13px}
.lbname small{display:block;font-weight:400;color:var(--mid);font-size:10.5px}
.lbval{font-weight:900;font-family:Oswald;font-size:17px;text-align:right}
.lbval small{display:block;font-family:Inter;font-weight:600;font-size:10px;color:var(--mid)}
.lbempty{padding:14px;color:#9CA3AF;font-size:12.5px;border-top:1px solid #F1F2F4}
.picklist{max-height:300px;overflow-y:auto;border:1px solid #D1D5DB;border-radius:8px;padding:6px;background:#fff}
.picklist label{display:flex;gap:9px;align-items:center;padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.picklist label:hover{background:#F3F4F6}
.picklist input{width:auto}
.sendcard{background:var(--navy);border-radius:12px;overflow:hidden}
.sendcard .h{color:#fff;font-family:Oswald;font-weight:700;font-size:16px;letter-spacing:.04em;padding:12px 18px;display:flex;align-items:center;gap:10px}
.sendcard .h::before{content:"";width:4px;height:18px;background:var(--orange);border-radius:2px}
.sendcard .body{background:#FAF7F2;padding:18px}
.sendcard .how{font-size:12.5px;color:#4B5563;line-height:1.55;margin-top:12px}
.warn{background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:12px 16px;font-size:13px}
.alert{background:#FEF2F2;border:1px solid #FCA5A5;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px}
/* chips (multi-select) */
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;border:1px solid #D1D5DB;border-radius:8px;padding:8px;background:#fff}
.chip{border:1px solid #D1D5DB;background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:#374151}
.chip:hover{border-color:var(--orange)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chipnote{font-size:11px;color:var(--mid);margin-top:4px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{background:#E8EDF3;color:var(--navy);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:700}
/* kiosk */
.kiosk{min-height:100vh;background:var(--navy);color:#fff;padding:22px 16px}
.kiosk .top{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto 22px;width:100%}
.kiosk .inner{max-width:680px;margin:0 auto;width:100%}
.kiosk .wide{max-width:1000px;margin:0 auto;width:100%}
.kiosk h2{font-family:Oswald;font-size:30px;margin:0 0 16px}
.kbig{display:block;width:100%;border:0;border-radius:12px;padding:18px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;margin-bottom:12px}
.kbig.orange{background:var(--orange);color:#fff}.kbig.orange:hover{background:var(--orange2)}
.kbig.white{background:#fff;color:var(--navy)}.kbig.white:hover{background:#E5E7EB}
.kbig.dark{background:#0B3A63;color:#fff;font-weight:700;font-size:15px}.kbig.dark:hover{background:#12507F}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.searchrow input{flex:2;min-width:200px;font-size:16px;padding:14px}
.searchrow select{flex:1;min-width:150px;font-size:15px;padding:14px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:400px;overflow-y:auto}
.namegrid button{background:#0B3A63;border:0;color:#fff;font:inherit;font-weight:700;font-size:13.5px;text-align:left;padding:12px 10px;border-radius:8px;cursor:pointer}
.namegrid button:hover{background:#12507F}
.namegrid button .sub{display:block;font-weight:400;font-size:11px;color:#9FB3C8;margin-top:2px}
.kioskcard{background:#fff;color:var(--ink);border-radius:14px;padding:22px}
.kioskcard h2{color:var(--ink)}
.exitlink{background:none;border:0;color:#7A93AC;font:inherit;font-size:11.5px;cursor:pointer;text-decoration:underline}
.center{text-align:center}
.loading{display:flex;min-height:60vh;align-items:center;justify-content:center;color:var(--mid)}
.liftrow{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff}
.liftrow .nm{font-weight:800;font-size:13px;margin-bottom:6px}
.liftrow .inrow{display:flex;gap:8px;align-items:center}
.liftrow .inrow input{flex:1.3}
.liftrow .inrow select{flex:1}
.est{font-size:11.5px;font-weight:800;color:var(--navy);margin-top:5px;min-height:16px}
.est .o{color:var(--orange)}
.dupbox{background:#FFF7ED;border:1px solid #FDBA74;border-radius:10px;padding:14px;margin-bottom:14px}
.dupbox b{display:block;margin-bottom:6px}
.dupbox button{margin:4px 6px 0 0}
@media print{
  .print-hide,header.app,.kiosk .top{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .card,.chartcard,.banner{border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  body.compact .charts-section{display:none!important}
  body.compact table{font-size:12px}
  .footnote{font-size:10pt;color:#374151}
  .kiosk{background:#fff;color:var(--ink);padding:0}
  @page{margin:.6in}
}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.banner{flex-direction:column}.banner h2{font-size:26px}}
</style>
</head>

/* Brzycki estimated 1RM: w * 36 / (37 - reps). reps 1 returns the lifted weight. */
const est1RM = (w,r) => { r=+r||1; if(r<=1) return +w; return Math.round(+w*36/(37-Math.min(r,5))*10)/10; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const listOf = v => (v||"").split(",").map(x=>x.trim()).filter(Boolean);
const inToFtIn = n => { n=+n||0; return {ft:Math.floor(n/12), inch:Math.round(n%12)}; };
const fmtHeight = n => { if(!n) return ""; const h=inToFtIn(n); return `${h.ft}'${h.inch}"`; };
const fmtNum = v => { const n=Math.round(v*10)/10; return (n===Math.trunc(n)?Math.trunc(n):n).toString(); };

/* ---------------- data layer ---------------- */
const useSupa = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const supa = useSupa ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;

const DB = {
  async load(){
    if (useSupa){
      const [a,t,e,s] = await Promise.all([
        supa.from("athletes").select("*"),
        supa.from("tests").select("*"),
        supa.from("exercises").select("*").order("sort"),
        supa.from("settings").select("*")
      ]);
      if (a.error||t.error||e.error) throw (a.error||t.error||e.error);
      S.athletes=a.data; S.tests=t.data;
      S.exercises = e.data.length ? e.data : DEFAULT_EXERCISES.slice();
      if (!e.data.length) await supa.from("exercises").insert(DEFAULT_EXERCISES);
      const row = k => (s.data||[]).find(x=>x.key===k);
      S.periods = row("periods") ? JSON.parse(row("periods").value) : DEFAULT_PERIODS.slice();
      S.sports  = row("sports")  ? JSON.parse(row("sports").value)  : DEFAULT_SPORTS.slice();
      if (!row("periods")) await supa.from("settings").upsert({key:"periods",value:JSON.stringify(S.periods)});
      if (!row("sports"))  await supa.from("settings").upsert({key:"sports", value:JSON.stringify(S.sports)});
      S.gradYears = row("gradyears") ? JSON.parse(row("gradyears").value) : DEFAULT_GRADYEARS.slice();
      if (!row("gradyears")) await supa.from("settings").upsert({key:"gradyears",value:JSON.stringify(S.gradYears)});
      S.term = row("term") ? JSON.parse(row("term").value) : DEFAULT_TERM;
      if (!row("term")) await supa.from("settings").upsert({key:"term",value:JSON.stringify(S.term)});
    } else {
      S.athletes=JSON.parse(localStorage.getItem("nn-athletes")||"[]");
      S.tests=JSON.parse(localStorage.getItem("nn-tests")||"[]");
      S.exercises=JSON.parse(localStorage.getItem("nn-exercises")||"null")||DEFAULT_EXERCISES.slice();
      S.periods=JSON.parse(localStorage.getItem("nn-periods")||"null")||DEFAULT_PERIODS.slice();
      S.sports=JSON.parse(localStorage.getItem("nn-sports")||"null")||DEFAULT_SPORTS.slice();
      S.gradYears=JSON.parse(localStorage.getItem("nn-gradyears")||"null")||DEFAULT_GRADYEARS.slice();
      S.term=JSON.parse(localStorage.getItem("nn-term")||"null")||DEFAULT_TERM;
    }
    S.lastSync = new Date();
  },
  localSave(){
    if (useSupa) return;
    localStorage.setItem("nn-athletes",JSON.stringify(S.athletes));
    localStorage.setItem("nn-tests",JSON.stringify(S.tests));
    localStorage.setItem("nn-exercises",JSON.stringify(S.exercises));
    localStorage.setItem("nn-periods",JSON.stringify(S.periods));
    localStorage.setItem("nn-sports",JSON.stringify(S.sports));
    localStorage.setItem("nn-gradyears",JSON.stringify(S.gradYears));
    localStorage.setItem("nn-term",JSON.stringify(S.term));
  },
  async upsertAthletes(arr){ if(!arr.length)return; if(useSupa){const{error}=await supa.from("athletes").upsert(arr);if(error)throw error;} this.localSave(); },
  async upsertAthlete(a){ if(useSupa){const{error}=await supa.from("athletes").upsert(a);if(error)throw error;} this.localSave(); },
  async deleteAthlete(id){ if(useSupa){const t=await supa.from("tests").delete().eq("athlete_id",id); if(t.error)throw t.error; const{error}=await supa.from("athletes").delete().eq("id",id); if(error)throw error;} this.localSave(); },
  async insertTests(rows){ if(useSupa){const{error}=await supa.from("tests").insert(rows);if(error)throw error;} this.localSave(); },
  async deleteTest(id){ if(useSupa){const{error}=await supa.from("tests").delete().eq("id",id);if(error)throw error;} this.localSave(); },
  async upsertExercise(e){ if(useSupa){const{error}=await supa.from("exercises").upsert(e);if(error)throw error;} this.localSave(); },
  async deleteExercise(id){ if(useSupa){const{error}=await supa.from("exercises").delete().eq("id",id);if(error)throw error;} this.localSave(); },
  async saveList(key,arr){ if(useSupa){const{error}=await supa.from("settings").upsert({key,value:JSON.stringify(arr)});if(error)throw error;} this.localSave(); },
  /* Pull fresh rows without disturbing anything the user is typing. */
  async sync(){
    if (!useSupa || S.syncing) return;
    S.syncing = true;
    try{
      const [a,t] = await Promise.all([supa.from("athletes").select("*"), supa.from("tests").select("*")]);
      if (!a.error && !t.error){
        const changed = a.data.length!==S.athletes.length || t.data.length!==S.tests.length;
        S.athletes=a.data; S.tests=t.data; S.lastSync=new Date();
        if (changed && !inForm()) render(); else updateSyncLabel();
      }
    }catch(e){ console.warn("sync failed",e); }
    S.syncing=false;
  }
};
function dbFail(e){ console.error(e); alert("Save failed — the change may not have reached the database.\n\n"+(e.message||e)+"\n\nIf deletes keep failing, your Supabase delete policies are likely missing (re-run setup.sql)."); }
function updateSyncLabel(){
  const el=document.getElementById("synclabel"); if(!el||!S.lastSync)return;
  el.textContent = "synced "+S.lastSync.toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
}

/* ---------------- derived ---------------- */
const testsFor=(aid,exid)=>S.tests.filter(t=>t.athlete_id===aid&&t.ex_id===exid);
const latestT=(aid,exid)=>{const r=testsFor(aid,exid);return r.length?r.reduce((a,b)=>a.date>=b.date?a:b):null;};
const firstT =(aid,exid)=>{const r=testsFor(aid,exid);return r.length?r.reduce((a,b)=>a.date<=b.date?a:b):null;};
const bestT  =(aid,exid)=>{const r=testsFor(aid,exid);return r.length?r.reduce((a,b)=>+a.value>=+b.value?a:b):null;};
const kpiFor=(ex,a)=>{const raw=a.gender==="Female"?ex.kpi_f:ex.kpi_m;return raw==null||raw===""?null:+raw;};
function evalKPI(ex,a,v){
  if(v==null)return null;
  const k=kpiFor(ex,a),bw=+a.weight;
  if(ex.kpi_type==="ratio"){
    const ratio=bw>0?v/bw:null;
    if(k==null)return{ratio,target:null,pass:null};
    return{ratio,target:k*bw,pass:ratio!=null?ratio>=k:null};
  }
  if(k==null)return{ratio:null,target:null,pass:null};
  return{ratio:null,target:k,pass:v>=k};
}
const confirmed = a => String(a.confirmed_term||"") === String(S.term);
const pillHTML=p=>p===true?'<span class="pill p-over">OVER THE LINE</span>':p===false?'<span class="pill p-below">BELOW</span>':'<span class="pill p-none">no standard</span>';
/* "365×3" note when the number came from a multi-rep set */
const repNote=t=>(t&&+t.reps>1)?`${fmtNum(t.weight)}×${t.reps}`:"";

/* ---------------- kiosk timers ---------------- */
let doneTimer=null, idleTimer=null;
function clearDoneCountdown(){ if(doneTimer){clearInterval(doneTimer);doneTimer=null;} }
function startDoneCountdown(){
  clearDoneCountdown();
  let n=10;
  doneTimer=setInterval(()=>{
    n--;
    const el=document.getElementById("kcount");
    if(el) el.textContent=n;
    if(n<=0){ clearDoneCountdown(); if(S.view==="kiosk"&&S.kiosk.stage==="done") A.kBackToPick(); }
  },1000);
}
/* If someone walks off mid-entry, clear the screen for the next athlete. */
function resetIdle(){
  if(idleTimer) clearTimeout(idleTimer);
  if(S.view!=="kiosk") return;
  if(S.kiosk.stage==="pick") return;
  idleTimer=setTimeout(()=>{
    if(S.view==="kiosk"&&S.kiosk.stage!=="pick") A.kBackToPick();
  }, 120000);
}
["click","keydown","input","touchstart"].forEach(ev=>window.addEventListener(ev,resetIdle,{passive:true}));

  const cards=kpiEx.map(ex=>{
    let ev=0,ps=0;
    F.forEach(a=>{const t=latestT(a.id,ex.id);if(!t)return;const r=evalKPI(ex,a,+t.value);if(r&&r.pass!==null){ev++;if(r.pass)ps++;}});

      <div class="count">${F.length} athletes in view</div>

/* Each athlete's BEST qualifying entry for the lift. "source" lets you
   exclude rep-estimated numbers so a true single isn't beaten by a formula. */
function lbEntries(ex, gender){
  const pool=S.athletes.filter(a=>{
    if(a.gender!==gender)return false;
    if(S.lb.period!=="All"){
      if(S.lb.period===UNASSIGNED){ if(listOf(a.periods).length)return false; }
      else if(!listOf(a.periods).includes(S.lb.period))return false;
    }
    if(S.lb.sport!=="All"&&!listOf(a.sports).includes(S.lb.sport))return false;
    return true;
  });
  const rows=[];
  pool.forEach(a=>{
    let ts=testsFor(a.id,ex.id);
    if(S.lb.source==="true") ts=ts.filter(t=>+t.reps<=1);
    if(!ts.length)return;
    const best=ts.reduce((x,y)=>+x.value>=+y.value?x:y);
    const useRel = S.lb.metric==="relative" && ex.kpi_type==="ratio" && +a.weight>0;
    const metric = useRel ? (+best.value/+a.weight) : +best.value;
    rows.push({a,t:best,metric,useRel});
  });
  return rows.sort((x,y)=>y.metric-x.metric).slice(0,3);
}
function lbColumn(ex,gender){
  const rows=lbEntries(ex,gender);
  const body=rows.length?rows.map((r,i)=>`
    <div class="lbrow" onclick="A.openReport('${r.a.id}')">
      <div class="rank r${i+1}">${i+1}</div>
      <div class="lbname">${esc(r.a.last_name)}, ${esc(r.a.first_name)}
        <small>${r.a.weight} lb${r.a.grad_year?` · '${String(r.a.grad_year).slice(2)}`:""}${repNote(r.t)?` · ${repNote(r.t)} est.`:" · true 1RM"}</small></div>
      <div class="lbval">${r.useRel?r.metric.toFixed(2)+"×":fmtNum(r.metric)}
        <small>${r.useRel?`${fmtNum(r.t.value)} ${ex.unit}`:(ex.kpi_type==="ratio"&&+r.a.weight>0?`${(+r.t.value/+r.a.weight).toFixed(2)}× BW`:ex.unit)}</small></div>
    </div>`).join(""):`<div class="lbempty">No qualifying entries yet.</div>`;
  return `<div class="lbcol ${gender==="Female"?"f":""}"><h5>${gender==="Female"?"GIRLS":"BOYS"} — TOP 3</h5>${body}</div>`;
}

/* ---------------- roster ---------------- */
function rosterMatches(){
  const q=S.roster.q.trim().toLowerCase();
  let out=S.athletes.filter(a=>{
    if(S.roster.gender!=="All"&&a.gender!==S.roster.gender)return false;
    if(S.roster.period!=="All"){
      if(S.roster.period===UNASSIGNED){ if(listOf(a.periods).length)return false; }
      else if(!listOf(a.periods).includes(S.roster.period))return false;
    }
    if(S.roster.sport!=="All"&&!listOf(a.sports).includes(S.roster.sport))return false;
    if(S.roster.confirm==="Confirmed"&&!confirmed(a))return false;
    if(S.roster.confirm==="Not confirmed"&&confirmed(a))return false;
    if(q&&!(a.last_name.toLowerCase().includes(q)||a.first_name.toLowerCase().includes(q)))return false;
    return true;
  });
  const cnt=a=>S.tests.filter(t=>t.athlete_id===a.id).length;
  const S_=S.roster.sort;
  out.sort((a,b)=>
    S_==="weight"? (+b.weight)-(+a.weight) :
    S_==="tests" ? cnt(b)-cnt(a) :
    S_==="untested"? cnt(a)-cnt(b) :
    a.last_name.localeCompare(b.last_name));
  return out;
}

  const ft=document.getElementById("pf-ft").value, inch=document.getElementById("pf-in").value;
  const f={first_name:g("pf-first"),last_name:g("pf-last"),gender:document.getElementById("pf-gender").value,
    grad_year:g("pf-grad"),height:(ft!==""?(+ft*12+(+inch||0)):null),weight:+g("pf-weight"),
    periods:S.draftPeriods.join(", "),sports:S.draftSports.join(", ")};
  if(!f.first_name||!f.last_name||!(f.weight>0)){alert("First name, last name and body weight are required — relative strength can't compute without body weight.");return null;}
  if(f.height===null){alert("Please choose your height (feet and inches).");return null;}
  return f;
}

/* ---------------- kiosk ---------------- */
/* Nothing shows until they type 2+ letters or pick a group.
   A wall of 500 names is unusable and is itself a small privacy leak. */
function matchAthletes(){
  const q=S.kiosk.search.trim().toLowerCase(), g=S.kiosk.group;
  if(q.length<2 && g==="All") return null;   // null = show the prompt, not an empty list
  const out=S.athletes.filter(a=>{
    if(g!=="All"&&!listOf(a.periods).includes(g)&&!listOf(a.sports).includes(g))return false;
    if(q.length<2)return true;
    return a.last_name.toLowerCase().startsWith(q)||a.first_name.toLowerCase().startsWith(q)
      ||`${a.first_name} ${a.last_name}`.toLowerCase().includes(q);
  }).sort((a,b)=>a.last_name.localeCompare(b.last_name));
  return out;
}

function reportHTML(athleteView){
  const a=S.athletes.find(x=>x.id===S.reportId); if(!a)return "<p>Athlete not found.</p>";
  const tested=S.exercises.filter(e=>testsFor(a.id,e.id).length);
  if(!S.histEx)S.histEx=S.exercises[0]?.id;

  const tableRows=S.exercises.map(ex=>{
    const ft=firstT(a.id,ex.id),lt=latestT(a.id,ex.id),bt=bestT(a.id,ex.id);
    const r=lt?evalKPI(ex,a,+lt.value):null;
    const hasGain=ft&&lt&&ft.id!==lt.id;
    const gain=hasGain?+lt.value-+ft.value:null;
    const pct=hasGain&&+ft.value>0?Math.round(gain/+ft.value*100):null;
    const gcell=gain==null?'<span class="dim">—</span>':
      `<span class="${gain>0?'gain-up':gain<0?'gain-dn':'mid'}">${gain>0?'+':''}${fmtNum(gain)}${pct!=null?` <small>(${gain>0?'+':''}${pct}%)</small>`:''}</span>`;
    return `<tr><td class="b">${esc(ex.name)}</td>
      <td class="mid">${ft?`${fmtNum(ft.value)} <span class="dim" style="font-size:11px">(${ft.date.slice(2,7)})</span>${repNote(ft)?`<span class="tiny">${repNote(ft)} est.</span>`:""}`:"—"}</td>
      <td class="b">${lt?`${fmtNum(lt.value)} ${ex.unit}${repNote(lt)?`<span class="tiny">${repNote(lt)} est.</span>`:""}`:'<span class="dim" style="font-weight:400">not tested</span>'}</td>
      <td>${gcell}</td><td class="mid">${bt?fmtNum(bt.value):"—"}</td>

  const charts=tested.map(ex=>{
    const data=testsFor(a.id,ex.id).sort((x,y)=>x.date.localeCompare(y.date));

    return `<div class="chartcard">
      <div class="stats"><b>${fmtNum(last.value)} ${ex.unit}</b>${r?.ratio!=null?` <span class="mid">· ${r.ratio.toFixed(2)}× BW</span>`:""} ${pillHTML(r?.pass)}</div>

      <div class="pts">${pts}${data.length===1?' <span class="d">· first test on file — the line fills in as they retest</span>':""}</div></div>`;
  }).join("");

  const stds=S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null)
    .map(e=>`${esc(e.name)} M ${e.kpi_m!=null?e.kpi_m+(e.kpi_type==="ratio"?"×BW":" "+e.unit):"—"} / F ${e.kpi_f!=null?e.kpi_f+(e.kpi_type==="ratio"?"×BW":" "+e.unit):"—"}`).join(" · ");

  const hist=testsFor(a.id,S.histEx).sort((x,y)=>y.date.localeCompare(x.date)).map(t=>{

    <div class="print-hide" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center">
      <button class="btn-link" onclick="A.reportBack(${athleteView})">← Back</button>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${athleteView?"":`<button class="btn btn-ghost" onclick="A.toggleEdit()">${S.editingProfile?"Close editor":"Edit profile"}</button>`}
        <div class="toggle" title="Controls what you see and what goes in the PDF"><button class="${S.printMode==='compact'?'on':''}" onclick="A.setPrint('compact')">One-sheet</button>
        <button class="${S.printMode==='full'?'on':''}" onclick="A.setPrint('full')">With charts</button></div>
        <button class="btn btn-orange" onclick="A.downloadPDF('${a.id}')">DOWNLOAD PDF</button>
      </div></div>
    ${S.editingProfile&&!athleteView?`<div class="card print-hide" style="padding:20px">${profileFormHTML(a,`A.saveProfileEdit('${a.id}')`,"A.toggleEdit()")}</div>`:""}
    <div class="banner"><img src="${LOGO}" alt="Naperville North Huskies">
      <div><div class="eyebrow">Naperville North Strength &amp; Performance · Athlete Report</div>
      <h2>${esc(a.first_name)} ${esc(a.last_name)}</h2>

    <div class="charts-section" ${S.printMode==="compact"?'style="display:none"':''}><h3 class="section-t">PROGRESS BY LIFT — EVERY TEST DATE</h3>

      <div class="note">Dashed navy line = current team standard at this athlete's current body weight. Orange line = tested maxes by date.</div></div>
    <div class="footnote">
      <p style="margin:0">Standing is graded against the current team standard at this athlete's current body weight. Gain compares the first recorded test to the most recent test. Rel. strength = max ÷ body weight.</p>
      <p style="margin:6px 0 0">Numbers marked <b>est.</b> are estimated one-rep maxes calculated from a multi-rep set using the Brzycki formula (1RM = weight × 36 ÷ (37 − reps)); the set that produced them is shown beside the number.</p>
      <p style="margin:6px 0 0"><b>Team standards:</b> ${stds}</p></div>
    <div class="pillars light" style="border-radius:10px;border:1px solid var(--border);border-top:3px solid var(--orange)">${PILLARS.map(p=>`<span>${p}</span>`).join("")}</div>
    ${athleteView?"":`<div class="sendcard print-hide">

        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
          <button class="btn btn-orange" onclick="A.downloadPDF('${a.id}')">DOWNLOAD PDF REPORT</button>

        </div>
        <p class="how"><b>How it works:</b> "Download PDF Report" saves a branded PDF — one page on <b>One-sheet</b>, or with every growth chart on <b>With charts</b> (toggle above). "Open Email Draft" opens your mail app with the summary already written — attach the downloaded PDF before you send. A web page can't attach a file to an email by itself; that last click is yours.</p>

    <div class="card print-hide" style="padding:18px">

        <select style="width:auto" onchange="A.setHistEx(this.value)">${S.exercises.map(e=>`<option value="${e.id}" ${S.histEx===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select></div>
      <ul style="list-style:none;padding:0;margin:12px 0 0;font-size:13.5px">${hist||'<li class="dim">Nothing logged for this exercise.</li>'}</ul></div>`}
  </div>`;
}
function mountCharts(){
  document.querySelectorAll("canvas[data-ex]").forEach(cv=>{
    const a=S.athletes.find(x=>x.id===cv.dataset.athlete);
    const ex=S.exercises.find(e=>e.id===cv.dataset.ex);
    if(!a||!ex)return;
    const data=testsFor(a.id,ex.id).sort((x,y)=>x.date.localeCompare(y.date));
    if(!data.length)return;
    const r=evalKPI(ex,a,+data[data.length-1].value);
    const ds=[{label:ex.name,data:data.map(d=>+d.value),borderColor:"#FF4800",pointRadius:4,pointBackgroundColor:"#002F55",borderWidth:3,tension:0}];
    if(r?.target!=null)ds.push({label:"The line",data:data.map(()=>r.target),borderColor:"#002F55",borderDash:[6,4],borderWidth:1.5,pointRadius:0});
    /* One data point on a tight axis reads like a broken graph — pad it. */
    const vals=data.map(d=>+d.value).concat(r?.target!=null?[r.target]:[]);
    const lo=Math.min(...vals), hi=Math.max(...vals);
    const pad=Math.max((hi-lo)*0.25, hi*0.12, 5);
    S.chartRefs.push(new Chart(cv,{type:"line",data:{labels:data.map(d=>d.date),datasets:ds},
      options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{afterLabel:ctx=>{const d=data[ctx.dataIndex];return repNote(d)?`from ${repNote(d)}`:"";}}}},
      scales:{x:{ticks:{font:{size:10}}},
        y:{ticks:{font:{size:10}},suggestedMin:Math.max(0,lo-pad),suggestedMax:hi+pad}}}}));
  });
}

}
function bulkHTML(){

/* ---------------- PDF generation (jsPDF) ---------------- */
const NAVY_RGB=[0,47,85], ORANGE_RGB=[255,72,0], MIDG=[107,114,128], INKG=[17,24,39], GREENG=[4,120,87], REDG=[220,38,38];
function safeName(str){ return String(str).replace(/[^a-z0-9]+/gi,"_").replace(/^_|_$/g,""); }

function buildPDF(a){
  const { jsPDF } = window.jspdf;
  const d = new jsPDF({unit:"pt", format:"letter"});
  const W=612, H=792, M=44;
  let y;

  /* banner */
  const bh=104;
  d.setFillColor(...NAVY_RGB); d.roundedRect(M,M,W-2*M,bh,6,6,"F");
  try{ d.addImage(LOGO,"PNG",M+14,M+(bh-84)/2,96,84); }catch(e){}
  const tx=M+14+96+16;
  d.setTextColor(...ORANGE_RGB); d.setFont("helvetica","bold"); d.setFontSize(7.5);
  d.text("NAPERVILLE NORTH STRENGTH & PERFORMANCE  ·  ATHLETE REPORT", tx, M+26);
  d.setTextColor(255,255,255); d.setFontSize(26);
  d.text(`${a.first_name} ${a.last_name}`, tx, M+56);
  d.setTextColor(199,210,224); d.setFont("helvetica","normal"); d.setFontSize(9);
  const groups=[...listOf(a.periods),...listOf(a.sports)];
  const meta=[a.gender, a.height?fmtHeight(a.height):null, `${a.weight} lb`,
    groups.length?groups.join(" · "):null, a.grad_year?`Class of ${a.grad_year}`:null, `Printed ${today()}`]
    .filter(Boolean).join("   ·   ");
  d.text(d.splitTextToSize(meta, W-2*M-96-40), tx, M+76);
  y = M+bh+26;

  /* table */
  d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(12);
  d.text("CURRENT NUMBERS vs THE LINE", M, y); y+=12;
  const cols=[M, M+116, M+200, M+280, M+372, M+446, M+524];
  const heads=["EXERCISE","FIRST TEST","CURRENT","GAIN","ALL-TIME BEST","REL. STR.","STANDING"];
  d.setFillColor(243,244,246); d.rect(M,y,W-2*M,22,"F");
  d.setTextColor(...MIDG); d.setFontSize(6.8);
  heads.forEach((h,i)=>d.text(h, cols[i]+7, y+14));
  y+=22;
  const rowH=30;
  S.exercises.forEach(ex=>{
    const ft=firstT(a.id,ex.id), lt=latestT(a.id,ex.id), bt=bestT(a.id,ex.id);
    d.setDrawColor(229,231,235); d.setLineWidth(.6); d.line(M,y,W-M,y);
    const base=y+18;
    d.setTextColor(...INKG); d.setFont("helvetica","bold"); d.setFontSize(9);
    d.text(String(ex.name), cols[0]+7, base);
    if(lt){
      const r=evalKPI(ex,a,+lt.value);
      d.setFont("helvetica","normal"); d.setTextColor(...MIDG); d.setFontSize(8.5);
      d.text(ft?`${fmtNum(ft.value)} (${ft.date.slice(2,7)})`:"—", cols[1]+7, base);
      d.setFont("helvetica","bold"); d.setTextColor(...INKG); d.setFontSize(9.5);
      d.text(`${fmtNum(lt.value)} ${ex.unit}`, cols[2]+7, base);
      if(repNote(lt)){ d.setFont("helvetica","normal"); d.setFontSize(6.8); d.setTextColor(...MIDG);
        d.text(`${repNote(lt)} est.`, cols[2]+7, base+9); }
      const hasGain=ft&&lt&&ft.id!==lt.id;
      if(hasGain){
        const g=+lt.value-+ft.value, pct=+ft.value>0?Math.round(g/+ft.value*100):null;
        d.setFont("helvetica","bold"); d.setFontSize(9.5);
        d.setTextColor(...(g>0?GREENG:g<0?REDG:MIDG));
        d.text(`${g>0?"+":""}${fmtNum(g)}${pct!=null?`  (${g>0?"+":""}${pct}%)`:""}`, cols[3]+7, base);
      } else { d.setTextColor(...MIDG); d.setFont("helvetica","normal"); d.text("—", cols[3]+7, base); }
      d.setFont("helvetica","normal"); d.setTextColor(...MIDG); d.setFontSize(8.5);
      d.text(bt?fmtNum(bt.value):"—", cols[4]+7, base);
      d.setTextColor(...INKG);
      d.text(r?.ratio!=null?`${r.ratio.toFixed(2)}x BW`:"—", cols[5]+7, base);
      /* standing pill */
      const p=r?.pass;
      const txt=p===true?"OVER THE LINE":p===false?"BELOW":"NO STANDARD";
      const bg=p===true?[209,250,229]:p===false?[254,226,226]:[229,231,235];
      const fg=p===true?[6,95,70]:p===false?[185,28,28]:[107,114,128];
      d.setFontSize(6.8); d.setFont("helvetica","bold");
      const pw=d.getTextWidth(txt)+12;
      d.setFillColor(...bg); d.roundedRect(cols[6]+7, base-8, pw, 12, 5,5,"F");
      d.setTextColor(...fg); d.text(txt, cols[6]+13, base);
    } else {
      d.setFont("helvetica","normal"); d.setTextColor(156,163,175); d.setFontSize(8.5);
      d.text("not tested", cols[2]+7, base);
    }
    y+=rowH;
  });
  d.setDrawColor(229,231,235); d.line(M,y,W-M,y);

  /* footnotes */
  y+=24;
  d.setTextColor(55,65,81); d.setFont("helvetica","normal"); d.setFontSize(8.6);
  const fn1="Standing is graded against the current team standard at this athlete's current body weight. Gain compares the first recorded test to the most recent test. Rel. Str. = max divided by body weight.";
  d.splitTextToSize(fn1, W-2*M).forEach(l=>{ d.text(l,M,y); y+=11; });
  y+=3;
  const fn2="Numbers marked est. are estimated one-rep maxes from a multi-rep set (Brzycki: 1RM = weight x 36 / (37 - reps)); the set that produced them is shown beneath the number.";
  d.splitTextToSize(fn2, W-2*M).forEach(l=>{ d.text(l,M,y); y+=11; });
  y+=3;
  const stds=S.exercises.filter(e=>e.kpi_m!=null||e.kpi_f!=null)
    .map(e=>`${e.name} M ${e.kpi_m!=null?e.kpi_m+(e.kpi_type==="ratio"?"xBW":" "+e.unit):"—"} / F ${e.kpi_f!=null?e.kpi_f+(e.kpi_type==="ratio"?"xBW":" "+e.unit):"—"}`).join(" · ");
  d.setFont("helvetica","bold"); d.text("Team standards:", M, y);
  const sw=d.getTextWidth("Team standards: ")+2;
  d.setFont("helvetica","normal");
  d.splitTextToSize(stds, W-2*M-sw).forEach((l,i)=>{ d.text(l, M+(i===0?sw:0), y); if(i===0)y+=11; else y+=11; });

  /* charts pages (Full mode only) */
  if (S.printMode==="full" && S.chartRefs.length){
    const per=2, cw=(W-2*M-16)/2, chh=150;
    let cx=M, cy=0, count=0;
    d.addPage();
    d.setTextColor(...NAVY_RGB); d.setFont("helvetica","bold"); d.setFontSize(13);
    d.text("PROGRESS BY LIFT — EVERY TEST DATE", M, M+14);
    cy=M+34;
    S.chartRefs.forEach(ch=>{
      let img; try{ img=ch.canvas.toDataURL("image/png",1.0); }catch(e){ return; }
      if (cy+chh+30 > H-M){ d.addPage(); cy=M+10; cx=M; count=0; }
      const exName = ch.data.datasets[0].label||"";
      d.setTextColor(...INKG); d.setFont("helvetica","bold"); d.setFontSize(9);
      d.text(String(exName).toUpperCase(), cx, cy);
      d.addImage(img,"PNG",cx,cy+6,cw,chh);
      count++;
      if (count%per===0){ cx=M; cy+=chh+34; } else { cx=M+cw+16; }
    });
  }

  /* pillars footer on every page */
  const pages=d.getNumberOfPages();
  for(let p=1;p<=pages;p++){
    d.setPage(p);
    d.setFillColor(11,32,53); d.rect(M,H-M-26,W-2*M,26,"F");
    d.setTextColor(...ORANGE_RGB); d.setFont("helvetica","bold"); d.setFontSize(9.5);
    d.text(PILLARS.join("    "), W/2, H-M-9, {align:"center"});
  }
  return d;
}

const A={
  go(v){S.view=v;S.editingProfile=false;render();},
  setF(k,v){S.f[k]=v;render();},
  openReport(id){S.reportId=id;S.histEx=null;S.view="report";S.editingProfile=false;render();window.scrollTo(0,0);},
  reportBack(av){if(av){S.kiosk.stage="home";render();}else A.go("board");},
  setPrint(m){S.printMode=m;render();},
  setHistEx(v){S.histEx=v;render();},
  toggleEdit(){S.editingProfile=!S.editingProfile;render();},
  toggleChip(kind,el,val){
    const arr=kind==="period"?S.draftPeriods:S.draftSports;
    const i=arr.indexOf(val);
    if(i>=0)arr.splice(i,1);else arr.push(val);
    el.classList.toggle("on");
  },
  async saveProfileEdit(id){
    const f=readProfileForm(); if(!f)return;
    const a={...S.athletes.find(x=>x.id===id),...f};
    S.athletes=S.athletes.map(x=>x.id===id?a:x); S.editingProfile=false; render();
    try{await DB.upsertAthlete(a);}catch(e){dbFail(e);}
  },
  _readEmail(){
    const to=document.getElementById("em-to"), fr=document.getElementById("em-from");
    if(to) S.emailTo=to.value.trim();
    if(fr) S.emailFrom=fr.value.trim();
  },
  downloadPDF(id){
    this._readEmail();
    const a=S.athletes.find(x=>x.id===id); if(!a)return;
    if(!window.jspdf){alert("PDF library didn't load — check your internet connection and refresh.");return;}
    try{
      const doc=buildPDF(a);
      doc.save(`${safeName(a.last_name)}_${safeName(a.first_name)}_Report_${today()}.pdf`);
    }catch(e){ console.error(e); alert("Couldn't build the PDF: "+(e.message||e)); }
  },
  emailDraft(id){
    this._readEmail();
    const a=S.athletes.find(x=>x.id===id); if(!a)return;
    if(!S.emailTo){ alert("Enter the athlete or parent email address first."); return; }
    const lines=[];
    S.exercises.forEach(ex=>{
      const ft=firstT(a.id,ex.id), lt=latestT(a.id,ex.id); if(!lt)return;
      const r=evalKPI(ex,a,+lt.value);
      const gain=(ft&&ft.id!==lt.id)?+lt.value-+ft.value:null;
      lines.push(`  ${ex.name}: ${fmtNum(lt.value)} ${ex.unit}${repNote(lt)?` (from ${repNote(lt)}, est.)`:""}`
        +`${gain!=null?` — ${gain>0?"+":""}${fmtNum(gain)} since first test`:""}`
        +`${r?.pass===true?" — OVER THE LINE":r?.pass===false?" — below the standard":""}`);
    });
    const body=[
      `${a.first_name}'s current Naperville North Strength & Performance numbers are attached as a PDF.`,
      ``,
      `Summary:`,
      ...(lines.length?lines:["  No tests logged yet."]),
      ``,
      `Body weight on file: ${a.weight} lb${a.height?` · Height: ${fmtHeight(a.height)}`:""}.`,
      `Relative strength is calculated against current body weight, so keeping that up to date matters.`,
      `Numbers marked "est." are estimated one-rep maxes from a multi-rep set (Brzycki formula).`,
      ``,
      PILLARS.join("  "),
      ``,
      `— ${S.emailFrom||"Huskies Strength & Performance"}`,
      `Naperville North High School`
    ].join("\n");
    const subject=`${a.first_name} ${a.last_name} — Naperville North Strength & Performance Athlete Report`;
    const url=`mailto:${encodeURIComponent(S.emailTo)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    if(url.length>1900){
      window.location.href=`mailto:${encodeURIComponent(S.emailTo)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("Report attached.\n\n"+PILLARS.join("  ")+"\n\n— "+(S.emailFrom||"Huskies Strength & Performance"))}`;
    } else window.location.href=url;
  },
  async delAthlete(id){
    const a=S.athletes.find(x=>x.id===id);

    if(!confirm(`Delete ${a.first_name} ${a.last_name} and all ${n} of their test entries?\n\nThis cannot be undone.`))return;

    const a={...S.athletes.find(x=>x.id===id),...f,confirmed_term:S.term};
    S.athletes=S.athletes.map(x=>x.id===id?a:x); S.kiosk.stage="home"; render();
    try{await DB.upsertAthlete(a);}catch(e){dbFail(e);}
  },
  calcEst(exId){
    const ex=S.exercises.find(e=>e.id===exId);
    const w=document.getElementById("te-"+exId).value;
    const out=document.getElementById("tv-"+exId);
    if(!w||isNaN(+w)){out.innerHTML="";return;}
    if(!ex.reps_ok){out.innerHTML=`<span class="o">${fmtNum(+w)} ${ex.unit}</span> will be recorded`;return;}
    const r=+document.getElementById("tr-"+exId).value||1;
    const e=est1RM(+w,r);
    out.innerHTML=r<=1?`Recorded as a true 1RM: <span class="o">${fmtNum(e)} ${ex.unit}</span>`
      :`${fmtNum(+w)} × ${r} → estimated 1RM <span class="o">${fmtNum(e)} ${ex.unit}</span>`;
  },
  async kSubmitTests(){
    const me=S.athletes.find(x=>x.id===S.kiosk.meId);
    const date=document.getElementById("te-date").value||today();
    const rows=[];
    S.exercises.forEach(ex=>{
      const el=document.getElementById("te-"+ex.id); if(!el)return;
      const w=el.value; if(w===""||isNaN(+w))return;
      const reps=ex.reps_ok?(+document.getElementById("tr-"+ex.id).value||1):1;
      rows.push({id:uid(),athlete_id:me.id,ex_id:ex.id,weight:+w,reps,value:ex.reps_ok?est1RM(+w,reps):+w,date});
    });
    if(!rows.length){alert("Nothing entered yet — add at least one number, or tap Not me.");return;}
    S.tests.push(...rows);
    try{await DB.insertTests(rows);}catch(e){dbFail(e);}
    S.kiosk.savedCount=rows.length; S.kiosk.stage="done"; render(); startDoneCountdown();
  },
  /* setup */
  async updEx(i,k,v){
    const ex={...S.exercises[i]};
    ex[k]=(k==="kpi_m"||k==="kpi_f")?(v===""?null:+v):v;
    S.exercises[i]=ex; render();
    try{await DB.upsertExercise(ex);}catch(e){dbFail(e);}
  },
  async delEx(id){
    const ex=S.exercises.find(e=>e.id===id);
    if(!confirm(`Remove ${ex.name}? Past entries stay in the database but stop displaying.`))return;
    try{ await DB.deleteExercise(id); S.exercises=S.exercises.filter(e=>e.id!==id); render(); }catch(e){dbFail(e);}
  },
  async addEx(){
    const g=id=>document.getElementById(id).value;
    const name=g("nx-name").trim(); if(!name){alert("Give the exercise a name.");return;}
    const ex={id:uid(),name,unit:g("nx-unit"),kpi_type:g("nx-type"),
      kpi_m:g("nx-m")===""?null:+g("nx-m"),kpi_f:g("nx-f")===""?null:+g("nx-f"),
      reps_ok:document.getElementById("nx-reps").checked,sort:S.exercises.length+1};
    S.exercises.push(ex); render();
    try{await DB.upsertExercise(ex);}catch(e){dbFail(e);}
  },
  async setTerm(){
    const v=document.getElementById("term-in").value.trim();
    if(!v){alert("Give the semester a label, e.g. 2026-27 S2.");return;}
    if(v===S.term){alert("That's already the current semester.");return;}
    const n=S.athletes.length;
    if(!confirm(`Start "${v}"?\n\nAll ${n} athlete(s) will be asked to confirm their class period the next time they use the kiosk. Their current periods stay on file until they do.`))return;
    S.term=v; render();
    try{await DB.saveList("term",v);}catch(e){dbFail(e);}
  },
  setLb(k,v){S.lb[k]=v;render();},
  setRoster(k,v){S.roster[k]=v;render(); if(k==="q"){const el=document.querySelector('.filters input');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}},
  setBulk(k,v){S.bulk[k]=v;S.bulk.picked=[];render();},
  bulkPick(id,on){ if(on){ if(!S.bulk.picked.includes(id))S.bulk.picked.push(id); } else S.bulk.picked=S.bulk.picked.filter(x=>x!==id); render(); },
  bulkAll(on){
    const src=S.bulk.from;
    const pool=S.athletes.filter(a=>src==="All"?true:src===UNASSIGNED?!listOf(a.periods).length:listOf(a.periods).includes(src));
    S.bulk.picked = on? pool.map(a=>a.id) : []; render();
  },
  async bulkMove(){
    const to=document.getElementById("bulk-to").value;
    if(!S.bulk.picked.length){alert("Check at least one athlete first.");return;}
    const label = to===UNASSIGNED? "Unassigned (no class period)" : to;
    if(!confirm(`Move ${S.bulk.picked.length} athlete(s) to ${label}?\n\nThis replaces their current class period(s). Sports are not affected.`))return;
    const changed=[];
    S.athletes=S.athletes.map(a=>{
      if(!S.bulk.picked.includes(a.id))return a;
      const n={...a, periods: to===UNASSIGNED? "" : to};
      changed.push(n); return n;
    });
    S.bulk.picked=[]; render();
    try{ await DB.upsertAthletes(changed); }catch(e){ dbFail(e); }
  },
  async renameListItem(kind,oldVal){
    const nv=(prompt(`Rename "${oldVal}" to:`, oldVal)||"").trim();
    if(!nv||nv===oldVal)return;
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    if(arr.some(x=>x.toLowerCase()===nv.toLowerCase())){alert(`"${nv}" already exists on the list.`);return;}
    const field=kind==="period"?"periods":kind==="sport"?"sports":"grad_year";
    const changed=[];
    S.athletes=S.athletes.map(a=>{
      if(kind==="grad"){
        if(String(a.grad_year)!==String(oldVal))return a;
        const n={...a,grad_year:nv}; changed.push(n); return n;
      }
      const l=listOf(a[field]); if(!l.includes(oldVal))return a;
      const n={...a,[field]:l.map(x=>x===oldVal?nv:x).join(", ")}; changed.push(n); return n;
    });
    const i=arr.indexOf(oldVal); if(i>=0)arr[i]=nv;
    arr.sort((a,b)=>a.localeCompare(b));
    /* keep filters pointing at the renamed value */
    ["lb","roster"].forEach(g=>{ if(S[g].period===oldVal)S[g].period=nv; if(S[g].sport===oldVal)S[g].sport=nv; });
    if(S.f.period===oldVal)S.f.period=nv; if(S.f.sport===oldVal)S.f.sport=nv;
    if(S.bulk.from===oldVal)S.bulk.from=nv;
    render();
    try{
      await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);
      await DB.upsertAthletes(changed);
      if(changed.length) setTimeout(()=>alert(`Renamed. ${changed.length} athlete profile(s) updated automatically.`),80);
    }catch(e){ dbFail(e); }
  },
  async addListItem(kind){
    const el=document.getElementById("new-"+kind); const v=el.value.trim(); if(!v)return;
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    if(arr.some(x=>x.toLowerCase()===v.toLowerCase())){alert(`"${v}" is already on the list.`);return;}
    arr.push(v); arr.sort((a,b)=>a.localeCompare(b)); render();
    try{await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);}catch(e){dbFail(e);}
  },
  async removeListItem(kind,val){
    const arr=kind==="period"?S.periods:kind==="sport"?S.sports:S.gradYears;
    const used=S.athletes.filter(a=>kind==="grad"?String(a.grad_year)===String(val):listOf(kind==="period"?a.periods:a.sports).includes(val)).length;
    if(!confirm(`Remove "${val}" from the ${kind} list?${used?`\n\n${used} athlete(s) are currently tagged with it — they keep the tag until you edit their profiles.`:""}`))return;
    const i=arr.indexOf(val); if(i>=0)arr.splice(i,1); render();
    try{await DB.saveList(kind==="period"?"periods":kind==="sport"?"sports":"gradyears",arr);}catch(e){dbFail(e);}
  }
};
window.A=A;

/* ---------------- boot + live sync ---------------- */
(async()=>{
  try{await DB.load();}catch(e){console.error(e);S.dbError=e.message||String(e);}
  S.ready=true; render();
  if(useSupa){
    /* push-based updates */
    supa.channel("board-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"athletes"},()=>DB.sync())
      .on("postgres_changes",{event:"*",schema:"public",table:"tests"},()=>DB.sync())
      .subscribe();
    /* safety net if realtime isn't enabled on the project */
    setInterval(()=>{ if(!inForm()) DB.sync(); }, 8000);
    window.addEventListener("focus",()=>{ if(!inForm()) DB.sync(); });
  }
})();
</script>
</body>
</html>
